<td>イソフムロン・フムロン等</td><td>雑菌（乳酸菌・腐敗菌等）の繁殖を抑制</td></tr><tr><td><strong>清澄作用</strong></td><td>ポリフェノール</td><td>タンパク質と結合・沈殿させ混濁を防ぐ</td></tr></table>\n<h4>殺菌作用の詳細</h4>\n<ul><li>ホップの苦み成分（α酸・イソフムロン）には<strong>グラム陽性菌に対する抗菌活性</strong>がある</li><li>特に乳酸菌などのビール汚染菌（ラクトバチルス属等）の繁殖を抑える</li><li>この殺菌作用がビール保存性を高め、中世ヨーロッパで「グルート（ハーブ混合物）」からホップへの移行が進んだ一因でもある</li><li>ただし完全な滅菌ではなく抑制効果であり、現代では製造衛生管理が主な保存手段</li></ul>\n<h4>清澄作用の詳細</h4>\n<ul><li>ホップに含まれる<strong>ポリフェノール</strong>（カテキン類等）が麦汁中の過剰なタンパク質と結合する</li><li>この結合体が<strong>トルーブ（Trub）</strong>と呼ばれる沈殿物を形成し、煮沸後に分離除去される</li><li>除去されないまま残った過剰タンパク質はビールの<strong>混濁（ヘイズ）</strong>の原因になる</li><li>ホップのポリフェノールによるタンパク質除去は「コールドトルーブ（冷却後の沈殿）」の形成にも関与する</li></ul>\n<h4>各選択肢の誤り成分の解説</h4>\n<p><strong>脱色作用</strong>：</p>\n<ul><li>ホップには脱色作用はない</li><li>ビールの色は主に麦芽の種類・焙煎度合いと醸造用カラメル（問011参照）によって決まる</li><li>「脱色」が含まれる選択肢（a・d）はすべて誤り</li></ul>\n<p><strong>糖化作用</strong>：</p>\n<ul><li>糖化（デンプンを糖に分解する）は<strong>麦芽中の酵素（アミラーゼ等）</strong>の役割</li><li>ホップには糖化作用はない</li><li>「糖化作用」は醸造工程の「仕込み（糖化）」段階で行われるが、ホップは煮沸工程で添加される（問005で糊粉層・アミラーゼについて解説）</li></ul>\n<p><strong>抗酸化作用</strong>：</p>\n<ul><li>ホップ成分には一定の抗酸化作用もあるが、それはホップの主要な「役割」として醸造上定義されているわけではない</li><li>問題文が想定する「重要な役割」は殺菌・清澄の2点であり、抗酸化作用は正解の選択肢に含まれない</li></ul>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 殺菌作用と脱色作用</strong>: 誤り。殺菌作用は正しいが、<strong>脱色作用</strong>はホップの役割ではない。ビールの色は麦芽で決まる。</li><li><strong>b) 殺菌作用と清澄作用</strong>: ✓ 正解。どちらもホップが持つ醸造上の重要な役割。殺菌はイソフムロン等、清澄はポリフェノールが担う。</li><li><strong>c) 糖化作用と清澄作用</strong>: 誤り。清澄作用は正しいが、<strong>糖化作用</strong>はホップではなく麦芽の酵素が担う。</li><li><strong>d) 抗酸化作用と脱色作用</strong>: 誤り。<strong>脱色作用</strong>はホップの役割ではない。抗酸化作用もホップの主要な醸造上の役割として定義されていない。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>ホップの5大役割</strong>：「苦み・香り・泡・殺菌・清澄」を5つセットで覚える</li><li><strong>「殺菌＝イソフムロン、清澄＝ポリフェノール」</strong>：どの成分がどの役割を担うかを対応させる</li><li><strong>「脱色・糖化は×」</strong>：脱色はカラメル（問011）・麦芽の役割、糖化はアミラーゼ（問005）の役割と整理する</li><li>ホップの殺菌作用はIPA（インディア・ペールエール）の歴史とも関連する：18世紀にイギリスからインドへの長距離輸送に耐えるよう、ホップを大量添加した高苦み・高アルコールのビールが作られた（これがIPAの起源）</li><li>問014（ザーツとハラタウ）と本問を合わせると「ホップの産地・種類・役割」が一通り整理できる</li></ul>"},{"id":"019","category":"ビアスタイル","subcategory":"ドイツビール","difficulty":"基礎","topic":"ヴァイツェンの特徴","keywords":["ヴァイツェン","バイエルン","小麦麦芽","上面発酵","ヘーフェヴァイツェン","クリスタルヴァイツェン","ドゥンクレスヴァイツェン","バナナ香"],"title":"ヴァイツェン：バイエルン生まれの小麦ビール","questionText":"ドイツのバイエルン地方で特に発展した、小麦麦芽を50％以上使用する上面発酵ビールを次の選択肢より選べ。","choices":[{"key":"a","text":"アルト"},{"key":"b","text":"シュタイン"},{"key":"c","text":"ヴァイツェン"},{"key":"d","text":"ケルシュ"}],"answer":"c) ヴァイツェン","answerKey":"c","explanationHtml":"<h3>なぜ正解か</h3>\n<p><strong>ヴァイツェン（Weizen）</strong> はドイツ語で「小麦」を意味し、<strong>小麦麦芽を50%以上</strong>使用する<strong>上面発酵</strong>ビールである。バイエルン地方（ミュンヘンを中心とする南ドイツ）で特に発展し、現在も同地方の代表的なビアスタイルとして知られる。バナナ様のエステル香とクローブ様のフェノール香が特徴的で、濁りのある「ヘーフェヴァイツェン（酵母入り）」が最も一般的なタイプ。</p>\n<h3>背景知識</h3>\n<h4>ヴァイツェンの主な種類</h4>\n<table><tr><th>タイプ</th><th>特徴</th></tr><tr><td><strong>ヘーフェヴァイツェン</strong></td><td>酵母を含む白濁タイプ。最もポピュラー。「Hefe＝酵母」</td></tr><tr><td><strong>クリスタルヴァイツェン</strong></td><td>ろ過して酵母を除いた透明タイプ。「Kristall＝水晶」</td></tr><tr><td><strong>ドゥンクレスヴァイツェン</strong></td><td>濃色の小麦ビール。「Dunkel＝暗い」。麦芽のコクが強い</td></tr><tr><td><strong>ヴァイツェンボック</strong></td><td>高アルコールの小麦ビール。「Bock＝強い」</td></tr></table>\n<h4>ヴァイツェン特有の香りの由来</h4>\n<p>ヴァイツェン酵母（<em>Saccharomyces cerevisiae</em>の特定株）が発酵中に特徴的な香り成分を生成する：</p>\n<ul><li><strong>バナナ香（酢酸イソアミル）</strong>: エステル化合物。発酵温度が低いほど多く生成される傾向</li><li><strong>クローブ香（4-ビニルグアイアコール）</strong>: フェノール化合物。小麦麦芽に含まれるフェルラ酸から生成</li><li>この2つの香りのバランスが、ヴァイツェンの個性を決める</li></ul>\n<h4>バイエルン地方とヴァイツェンの歴史</h4>\n<p>16世紀のバイエルンでは純粋令（ラインハイツゲボット、1516年）により麦芽・ホップ・水のみ使用が義務付けられ、小麦はパン用として優先された。ヴァイツェン醸造はバイエルン王家（ヴィッテルスバッハ家）の独占事業とされており、一般醸造所は小麦ビールを造れない時代があった。19世紀後半に独占が解かれ、一般に普及した。</p>\n<h4>ドイツの上面発酵3スタイルの比較</h4>\n<table><tr><th>スタイル</th><th>産地</th><th>主原料</th><th>色</th></tr><tr><td>ヴァイツェン</td><td>バイエルン（ミュンヘン等）</td><td>小麦麦芽50%以上</td><td>淡色〜中色</td></tr><tr><td>アルト</td><td>ノルトライン＝ヴェストファーレン（デュッセルドルフ）</td><td>大麦麦芽</td><td>銅褐色</td></tr><tr><td>ケルシュ</td><td>ノルトライン＝ヴェストファーレン（ケルン）</td><td>大麦麦芽＋小麦</td><td>淡色</td></tr></table>\n<p>ヴァイツェン・アルト・ケルシュはすべてドイツの上面発酵ビールだが、産地・原料・色が異なる。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) アルト</strong>: 誤り。アルトはデュッセルドルフで発展した<strong>濃色（銅褐色）の上面発酵ビール</strong>。小麦麦芽を50%以上使うスタイルではなく、大麦麦芽が主原料。「Alt＝古い」が語源。バイエルンではなくラインラント地方。</li><li><strong>b) シュタイン</strong>: 誤り。「シュタイン（Stein）」はドイツ語で「石」。<strong>シュタインビール（Steinbier）</strong>は焼いた石を麦汁に投入して加熱する古代的な醸造法のビール。小麦50%以上・バイエルン発展という条件を満たさない。なお「シュタイン」だけではビアスタイルの名称としては不完全。</li><li><strong>c) ヴァイツェン</strong>: ✓ 正解。「Weizen＝小麦」。小麦麦芽50%以上・上面発酵・バイエルン発展の3条件すべてを満たす。</li><li><strong>d) ケルシュ</strong>: 誤り。ケルシュはケルン市を中心とする限定地域の<strong>淡色上面発酵ビール</strong>。フルーティで爽やかなアロマが特徴だが、小麦麦芽50%以上は使用しない（主に大麦麦芽）。EU地理的表示保護によりケルン産のみが「ケルシュ」を名乗れる。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>ヴァイツェン（Weizen）＝小麦（Wheat）</strong> は英独対応で覚えやすい</li><li>「<strong>小麦50%以上・上面発酵・バイエルン</strong>」の3点がヴァイツェンの定義</li><li>バナナ香＝エステル（酢酸イソアミル）、クローブ香＝フェノール（4-ビニルグアイアコール）の化学名は発展問題用</li><li>ドイツの上面発酵3兄弟：「<strong>バイエルン＝ヴァイツェン</strong>」「<strong>デュッセルドルフ＝アルト</strong>」「<strong>ケルン＝ケルシュ</strong>」と産地で区別</li><li>ヘーフェ（Hefe）＝酵母：「ヘーフェヴァイツェン＝濁り小麦ビール」の意味も覚えておく</li></ul>"},{"id":"020","category":"原材料","subcategory":"ホップ","difficulty":"基礎","topic":"ホップの使用部位","keywords":["ホップ","雌株","球花","毬花","ルプリン","α酸","未授精","アサ科"],"title":"ホップの使用部位：雌株の球花（毬花）だけを使う理由","questionText":"ビール醸造に使われるホップの部位として適切なものを、次の選択肢より選べ。（2016年）","choices":[{"key":"a","text":"雄株の茎と葉"},{"key":"b","text":"雌株の茎と葉"},{"key":"c","text":"雄株の球花"},{"key":"d","text":"雌株の球花"}],"answer":"d) 雌株の球花","answerKey":"d","explanationHtml":"<h3>なぜ正解か</h3>\n<p>ホップ（<em>Humulus lupulus</em>）は雌雄異株の植物で、ビール醸造に使用するのは<strong>雌株の球花（毬花／コーン）のみ</strong>である。球花は生育すると松かさ（松ぼっくり）に似た球状になり、その内側の黄色い粉状の物質<strong>ルプリン（lupulin）</strong>に苦味・香り成分が集中している。また「未授精」の状態（雄株から隔離された雌株）で育てることが重要で、授精すると種子が形成されてルプリン含量が低下し、品質が落ちる。</p>\n<h3>背景知識</h3>\n<h4>ホップの植物学的特徴</h4>\n<ul><li><strong>科</strong>: アサ科（Cannabaceae）</li><li><strong>属</strong>: カラハナソウ属</li><li><strong>学名</strong>: <em>Humulus lupulus</em></li><li><strong>性質</strong>: 多年生つる植物。毎年地下茎から新たなつるを伸ばし、1シーズンで5〜8mに成長</li><li><strong>雌雄異株</strong>: 雌株と雄株が別々の個体</li></ul>\n<h4>球花（毬花）の構造</h4>\n<p>球花は複数の苞葉（ほうよう）が重なって球状を形成する。その苞葉の基部に<strong>ルプリン腺</strong>があり、黄色い粉末状のルプリンが含まれる。</p>\n<p><strong>ルプリンの成分</strong>：</p>\n<table><tr><th>成分</th><th>種類</th><th>役割</th></tr><tr><td>α酸（フムロン類）</td><td>苦味前駆体</td><td>煮沸でイソα酸に変化し苦味を付与</td></tr><tr><td>β酸（ルプロン類）</td><td>苦味成分</td><td>抗菌作用。苦味への寄与は少ない</td></tr><tr><td>精油成分</td><td>ミルセン・リナロール等</td><td>花・柑橘・ハーブ・スパイス系の香り</td></tr><tr><td>ポリフェノール</td><td>タンニン等</td><td>清澄化・防腐効果</td></tr></table>\n<h4>雌株を使う理由・未授精にする理由</h4>\n<p>1. <strong>ルプリンが雌株の球花に集中</strong>: 雄株の花は小さく、苦味・香り成分をほとんど含まない</p>\n<p>2. <strong>未授精で品質を維持</strong>: 雄花の花粉が届いて授精すると種子が形成され、ルプリン腺が種子の形成に資源を使い、α酸・精油含量が低下する</p>\n<p>3. <strong>種子は品質低下の原因</strong>: 授精した球花は種子を含み、ビールに脂肪分が溶け出して品質を損なう可能性がある</p>\n<p>このため、商業ホップ農園では<strong>雄株を排除し、雌株だけを栽培する</strong>のが標準的な管理方法。</p>\n<h4>ホップの利用形態</h4>\n<p>収穫された球花はそのまま（生ホップ）では使われず、加工されて醸造に供される：</p>\n<table><tr><th>形態</th><th>特徴</th></tr><tr><td>ペレットホップ</td><td>球花を粉砕・圧縮した粒状。最も一般的。保存性高い</td></tr><tr><td>ホップエキス</td><td>ルプリンを溶媒で抽出した液状。大量生産ビールに多用</td></tr><tr><td>全粒ホップ（フラワーホップ）</td><td>乾燥した球花をそのまま使用。香りが豊か</td></tr></table>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 雄株の茎と葉</strong>: 誤り。雄株はルプリンを持つ球花を形成しない。茎・葉はいずれの株でも苦味・香りの有効成分を含まないため醸造には使わない。</li><li><strong>b) 雌株の茎と葉</strong>: 誤り。雌株であっても、茎や葉にはルプリンが含まれない。使用するのは「球花（毬花）」の部分のみ。</li><li><strong>c) 雄株の球花</strong>: 誤り。雄株の「花」は小さく、ルプリン腺がほとんど発達しない。苦味・香りの成分が乏しく醸造に用いない。また雄株が圃場にあると雌株が授精して品質が低下するため、農園では雄株を除去する。</li><li><strong>d) 雌株の球花</strong>: ✓ 正解。ルプリンを豊富に含む部位。未授精の雌株のみを栽培・収穫する。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「雌株の球花だけ」</strong> — 雌・球花の2点を同時に覚える</li><li><strong>松かさ（松ぼっくり）に似た形</strong> → 「球花」の名前のイメージとして定着させやすい</li><li>ルプリン＝黄色い粉 → α酸（苦味）＋精油（香り）の宝庫</li><li>雄株を除去する理由（授精→種子形成→品質低下）は発展問題でも出題される</li><li>ホップの植物学：アサ科・多年生つる植物・学名<em>Humulus lupulus</em>も関連知識として押さえておく</li></ul>"},{"id":"020","category":"原材料","subcategory":"ホップ","difficulty":"基礎","topic":"ホップの植物的特徴","keywords":["ホップ","アサ科","カラハナソウ属","球花","毬花","雌株","つる性植物"],"title":"ホップの植物的特徴──科・草丈・使用部位・球花","questionText":"ホップに関する説明として正しいものを、次の選択肢より選べ。（2017年）","choices":[{"key":"a","text":"バラ科のつる性の植物である"},{"key":"b","text":"収穫期には1mほどの長さに成長する"},{"key":"c","text":"ビール醸造には雄株の葉を使用する"},{"key":"d","text":"ホップの「球花」は「毬花」などとも表記される"}],"answer":"d) ホップの「球花」は「毬花」などとも表記される","answerKey":"d","explanationHtml":"<h3>なぜ正解か</h3>\n<p>ビール醸造に使うホップの果実は生育すると松かさ（松ぼっくり）に似た球状の形態になることから<strong>「球花（きゅうか）」</strong>と呼ばれ、<strong>「毬果（きゅうか）」「毬花（まりか）」</strong>と表記されることもある。これが正しい説明である。</p>\n<h3>背景知識</h3>\n<h4>ホップの植物学的分類</h4>\n<table><tr><th>項目</th><th>正しい情報</th></tr><tr><td>科</td><td><strong>アサ科</strong>（Cannabaceae）※バラ科ではない</td></tr><tr><td>属</td><td><strong>カラハナソウ属</strong>（Humulus）</td></tr><tr><td>学名</td><td><em>Humulus lupulus</em></td></tr><tr><td>生育型</td><td><strong>つる性</strong>の多年草</td></tr><tr><td>収穫期</td><td>8〜9月（北半球）</td></tr><tr><td>草丈（収穫期）</td><td><strong>約7m</strong>（1mではない）</td></tr></table>\n<h4>選択肢の誤り一覧</h4>\n<table><tr><th>選択肢</th><th>誤りの内容</th><th>正しい情報</th></tr><tr><td>a</td><td>バラ科</td><td><strong>アサ科</strong></td></tr><tr><td>b</td><td>1m</td><td><strong>7m</strong></td></tr><tr><td>c</td><td>雄株の葉</td><td><strong>雌株の果実（球花）</strong></td></tr><tr><td>d</td><td>球花＝毬花</td><td><strong>✓ 正しい</strong></td></tr></table>\n<h4>ホップの使用部位：雌株の球花</h4>\n<p>ホップは雌雄異株（雌株と雄株が別の個体）であり、醸造に使用するのは<strong>未授精の雌株の果実（球花）</strong>である。雌株が授精すると種子が形成され、苦味成分の含有量が低下するため、商業栽培では雄株を排除して雌株のみを栽培する。</p>\n<h4>球花の構造と醸造上の役割</h4>\n<pre><code>球花（毬花）\n<p>├── 苞葉（ブラクト）：松かさ状の葉片</p>\n<p>└── ルプリン腺（黄色い粉状の腺体）</p>\n<p>    ├── アルファ酸 → 煮沸でイソアルファ酸に変化 → 苦味（問題012参照）</p>\n<p>    ├── ベータ酸 → 抗菌作用</p>\n<p>    └── 精油成分 → ホップアロマ（香り）&lt;/code&gt;&lt;/pre&gt;</p>\n<p>ルプリンはホップの球花の根元に付着する黄色い粉状の腺体で、苦味・香り成分が凝縮されている。</p>\n<h4>日本のホップ産地</h4>\n<p>日本では主に<strong>岩手県遠野市</strong>が国内最大のホップ産地として知られる。遠野は「ホップの里」として、クラフトビール産業との連携でも注目されている。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) バラ科のつる性の植物である</strong>: 誤り。ホップは<strong>アサ科カラハナソウ属</strong>。バラ科ではない。「つる性」という部分は正しいが、科の部分が誤り。</li><li><strong>b) 収穫期には1mほどの長さに成長する</strong>: 誤り。収穫期（8〜9月）には<strong>7m程度</strong>まで成長する。1mは著しく過小な数値。</li><li><strong>c) ビール醸造には雄株の葉を使用する</strong>: 誤り。「雄株」も「葉」も誤り。使用するのは<strong>雌株の果実（球花）</strong>。雄株は授精を防ぐために栽培から除外される。</li><li><strong>d) ホップの「球花」は「毬花」などとも表記される</strong>: ✓ 正解。松かさ状の形状から「球花」と呼ばれ、「毬果」「毬花」とも表記される。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「ホップ＝アサ科・7m・雌株の球花」</strong>：三点セットで覚える</li><li>「バラ科」は間違い。アサ科には大麻（Cannabis）も属しており、ホップはその近縁植物</li><li>草丈の数字：<strong>7m</strong>（7階建ての建物に匹敵）は「意外と大きい」と記憶に残りやすい</li><li>球花の中のルプリン（黄色い粉）が苦味・香りの源：問題012（イソアルファ酸）と連動</li><li>収穫期の<strong>8〜9月</strong>も頻出：夏の終わりに収穫されるホップのイメージ</li><li>2017年出題実績あり</li></ul>"},{"id":"020","category":"法規制","subcategory":"ドイツ・歴史的法令","difficulty":"基礎","topic":"ビール純粋令","keywords":["ビール純粋令","ラインハイツゲボート","1516年","バイエルン公国","大麦・ホップ・水","アインベック","グルート","原料規制"],"title":"ビール純粋令（ラインハイツゲボート）：1516年バイエルンの原料規制","questionText":"1516年に、バイエルン公国は「ビールは大麦、ホップ、水のみを原料とすべし」という内容の法令を発布した。この法令は一般的に何と呼ばれているか、次の選択肢より選べ。\n（2012年、2013年、2014年、2017年）","choices":[{"key":"a","text":"酒税法"},{"key":"b","text":"荘園令"},{"key":"c","text":"ビール純粋令"},{"key":"d","text":"グルート法"}],"answer":"c) ビール純粋令","answerKey":"c","explanationHtml":"<h3>なぜ正解か</h3>\n<p>1516年（日本では室町時代末期）、バイエルン公<strong>ヴィルヘルム4世</strong>が「<strong>ビール純粋令（Reinheitsgebot：ラインハイツゲボート）</strong>」を発布した。内容は「ビールの原料は<strong>大麦・ホップ・水</strong>のみとする」というもので、世界最古の食品安全法規の一つとされる。本問は正解率90%超の最頻出問題。</p>\n<h3>背景知識</h3>\n<h4>ビール純粋令の制定背景</h4>\n<ul><li><strong>当時のバイエルンの状況</strong>：大麦だけでなく小麦・ライ麦などの混合穀物がビールに使われ、品質が不安定だった。また毒性のある植物（ヒヨス等）が使われることもあった</li><li><strong>アインベックのビールへの対抗意識</strong>：北ドイツの都市<strong>アインベック（Einbeck）</strong>は品質の高いボックビール（強いラガー）で名声を博していた。バイエルンはこれに追いつくため品質基準を統一する必要があった</li><li><strong>小麦の確保</strong>：大麦をビール原料に限定することで、人間の食糧である小麦・ライ麦をビール醸造に転用することを防ぐ食料安保上の目的もあった</li></ul>\n<h4>ビール純粋令の内容と変遷</h4>\n<table><tr><th>時代</th><th>内容</th></tr><tr><td><strong>1516年（当初）</strong></td><td>大麦・ホップ・水のみ</td></tr><tr><td>後の改訂</td><td>酵母の発見（17世紀以降）により酵母も原料として追加が認識される</td></tr><tr><td>1871年</td><td>ドイツ統一後、バイエルン以外のドイツ全土に適用拡大</td></tr><tr><td>1987年</td><td>EU法との整合上、輸出用ドイツビールには外国産原料使用を許可（国内向けは維持）</td></tr><tr><td>現在</td><td>ドイツ国内向けのラガービールには事実上維持。ただし現行法では酵母も含む</td></tr></table>\n<p>&gt; 現代のビール純粋令（ドイツビール法）では「大麦麦芽・ホップ（製品含む）・水・酵母」が基本原料とされている。</p>\n<h4>アインベックとボックビール</h4>\n<ul><li><strong>アインベック（Einbeck）</strong>：北ドイツ・ニーダーザクセン州の都市</li><li>中世に品質の高い麦芽ビール（強いラガー）を産出し、ハンザ同盟の交易路を通じてヨーロッパ中に輸出していた</li><li>バイエルン人が「アインベック」を訛って「ein Bock（一頭の山羊）」と聞き間違えたことが<strong>ボックビール（Bockbier）</strong>の名前の由来とされる</li><li>ボックビールはアルコール度数の高い（6〜7%以上）濃色ラガーの総称</li></ul>\n<h4>グルート（Grut/Gruit）</h4>\n<p>ホップが普及する以前のヨーロッパでは、<strong>グルート</strong>と呼ばれるヤチヤナギ・ヨモギ・セイヨウノコギリソウ等のハーブ混合物がビールに添加されていた。ホップの普及（13〜16世紀）によりグルートは徐々に駆逐された。グルートの使用・販売は領主や教会が独占的に管理していたため、ホップへの移行は経済権力の移動とも関係していた。</p>\n<h4>ビール純粋令の現代的意義</h4>\n<ul><li>ドイツのビールブランドの品質保証・マーケティングシンボルとして機能</li><li>クラフトビールブームにより、純粋令に縛られない多様な原料のビール（フルーツ・スパイス等）が世界的に普及しているが、ドイツ国内では伝統的に純粋令への尊重が根強い</li><li>日本の酒税法（問011参照）もビールの原料を規定しており、2018年改正で果実・ハーブ等が追加された</li></ul>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 酒税法</strong>: 誤り。酒税法は日本の酒類に課税・規制するための現代の法律。1516年のドイツの法令ではない（問011参照）。</li><li><strong>b) 荘園令</strong>: 誤り。荘園令は中世の土地制度に関する法令（日本史の文脈では荘園整理令等）。ビールとは無関係。</li><li><strong>c) ビール純粋令</strong>: ✓ 正解。ドイツ語でReinheitsgebot（ラインハイツゲボート）。1516年バイエルン公国が大麦・ホップ・水を原料と定めた法令。</li><li><strong>d) グルート法</strong>: 誤り。「グルート」はホップ普及前のハーブ混合物の名称。グルートの販売を領主・教会が独占する慣行はあったが「グルート法」という名の法令は存在しない。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「1516年・バイエルン・大麦・ホップ・水」</strong>：試験最頻出の5点セット。正解率90%超の最重要問題</li><li><strong>ラインハイツゲボート（Reinheitsgebot）</strong>：「Reinheit（純粋）＋Gebot（命令）」という語構造。「純粋命令＝純粋令」と理解する</li><li><strong>酵母が含まれない理由</strong>：1516年当時、酵母の存在は科学的に認識されていなかった。後の科学発展（レーウェンフック、パスツール等）により酵母が発見された</li><li><strong>アインベックへの対抗意識</strong>：純粋令制定の動機として「北ドイツ（アインベック）の良質ビールに追いつく」という競争心があったことも頻出ポイント</li><li>2012・2013・2014・2017年と<strong>4年以上出題</strong>されている最重要問題。確実に正解できるようにする</li><li>問019（ホップの役割）・問014（ザーツホップ）とセットで「ホップ」の重要性を総合的に理解できる</li></ul>"},{"id":"021","category":"歴史・文化","subcategory":"イギリスビール史・文化","difficulty":"応用","topic":"エールワイフ・エールハウス","keywords":["エールワイフ","エールハウス","中世イギリス","ブライダル","ブライドエール","9世紀","エール","自家醸造"],"title":"エールワイフ：中世イギリスのエールハウスを経営した主婦","questionText":"9世紀のイギリスで流行ったエールハウスという居酒屋を経営する主婦は何と呼ばれたか、次の選択肢より選べ。（2016年）","choices":[{"key":"a","text":"エールブライド"},{"key":"b","text":"エールマザー"},{"key":"c","text":"エールミセス"},{"key":"d","text":"エールワイフ"}],"answer":"d) エールワイフ","answerKey":"d","explanationHtml":"<h3>なぜ正解か</h3>\n<p>9世紀のイギリスでは、自家醸造したエールを居酒屋（<strong>エールハウス</strong>）で客にふるまう商売が広まった。エールハウスは主婦が経営することが多く、こうした女性醸造者・経営者を<strong>エールワイフ（Alewife）</strong>と呼んだ。「wife（ワイフ）」は現代英語では「妻」を意味するが、古英語では「女性」という広い意味を持ち、「エールを扱う女性」という意味でこの呼称が定着した。</p>\n<h3>背景知識</h3>\n<h4>中世イギリスのエール文化</h4>\n<ul><li><strong>エールとビールの区別</strong>：中世イギリスでは「エール（Ale）」はホップを使わない麦芽飲料、「ビール（Beer）」はホップを使う飲料として区別されていた。中世には主にエールが飲まれており、ホップの普及（14〜16世紀）とともに「ビール」が台頭した</li><li><strong>なぜ主婦が醸造したか</strong>：エール醸造はパン作りと同じく日常的な家事の延長として位置づけられており、女性（主婦）が担う仕事だった。余ったエールを外部に販売することが商業エールハウスの起源となった</li><li><strong>エールハウスの広まり</strong>：9世紀ごろには農村・町を問わず各地にエールハウスが広がり、地域のコミュニティの中心となった</li></ul>\n<h4>エールワイフの社会的役割</h4>\n<ul><li>単なる居酒屋の女将にとどまらず、地域における醸造技術の担い手・情報交換の拠点として重要な存在だった</li><li>中世後期になると醸造業が専業化・商業化し、男性ギルドが参入するにつれてエールワイフの立場は縮小していった</li><li>「エールワイフ」は文学・歴史書にも登場する人物像であり、チョーサーの「カンタベリー物語」など中世文学にも関連する記述がある</li></ul>\n<h4>ブライダル（Bridal）の語源</h4>\n<p>解説文にある通り、エールは婚礼の祝い酒でもあった。</p>\n<ul><li><strong>ブライド・エール（Bride-Ale）</strong>：結婚式で花嫁が醸造・提供したエール</li><li>招待客はエールを購入することで新婚夫婦への支援とした（一種のクラウドファンディング的慣習）</li><li>「Bride-Ale（花嫁のエール）」が転訛して現代英語の <strong>\"Bridal（ブライダル）\"</strong> の語源となったとされる</li></ul>\n<p>&gt; <strong>語源のまとめ</strong>：Bride（花嫁）＋Ale（エール）→ Bride-Ale → Bridal</p>\n<h4>イギリスのパブ文化の系譜</h4>\n<table><tr><th>時代</th><th>場所の名称</th><th>特徴</th></tr><tr><td>中世〜</td><td><strong>エールハウス（Alehouse）</strong></td><td>主婦が経営、エール中心</td></tr><tr><td>中世〜</td><td><strong>タバーン（Tavern）</strong></td><td>ワイン・食事を提供、より上流向け</td></tr><tr><td>中世〜</td><td><strong>イン（Inn）</strong></td><td>宿泊機能あり、旅人向け</td></tr><tr><td>近代〜</td><td><strong>パブ（Public House）</strong></td><td>上記が統合・発展した形</td></tr></table>\n<p>現代イギリスの「パブ」は、エールハウスを中心にタバーン・インが融合した文化的遺産である。</p>\n<h4>選択肢の誤り語の解説</h4>\n<ul><li><strong>エールブライド（Ale Bride）</strong>：実在しない呼称。「bride（花嫁）」はブライド・エールで登場するが、エールハウスの経営者の呼称ではない。「ブライダル」の語源と混同させる引っかけ</li><li><strong>エールマザー（Ale Mother）</strong>：実在しない呼称。「mother（母）」という単語はビール酵母（yeast mother）文脈で使われることはあるが、エールハウス経営者の名称ではない</li><li><strong>エールミセス（Ale Missus/Missis）</strong>：実在しない呼称。「missus（女主人）」はイギリス俗語で妻・主婦を指すが、歴史的なエールハウス経営者の正式な呼称としては使われていない</li></ul>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) エールブライド</strong>: 誤り。「ブライド（花嫁）」はブライド・エール（ブライダルの語源）に登場するが、エールハウス経営者の呼称ではない。紛らわしい引っかけ。</li><li><strong>b) エールマザー</strong>: 誤り。実在しない呼称。「mother」はビール・酢の母（酵母・菌の塊）を指すことがあるが、エールハウス経営者の意味はない。</li><li><strong>c) エールミセス</strong>: 誤り。実在しない呼称。英語で「missus」は主婦・女性を指すが、歴史上の定着した用語としてのエールハウス経営者名称ではない。</li><li><strong>d) エールワイフ</strong>: ✓ 正解。古英語の「wife＝女性」に由来し、エールを醸造・販売する女性の総称として9世紀以降のイギリスで使われた。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「エールワイフ＝ale（エール）＋wife（女性）」</strong>：古英語の「wife＝女性（妻ではなく）」という語義を覚えるのがカギ</li><li><strong>「ブライダルの語源はブライド・エール」</strong>：Bride-Ale → Bridal という語源変化は試験に単独でも出題されやすい重要ポイント</li><li>選択肢の「エールブライド」は「ブライダルの語源（ブライド・エール）」を連想させる意図的な引っかけ。ブライドは花嫁のエールであり、エールハウスの女将ではない</li><li><strong>「エールとビール＝ホップの有無」</strong>：中世イギリスでのエール（ホップなし）とビール（ホップあり）の区別は試験頻出の対比</li><li>現代では「エール＝上面発酵ビールの総称」として使われており、歴史的な意味との混同に注意する</li></ul>"},{"id":"021","category":"醸造工程","subcategory":"製麦・麦芽","difficulty":"基礎","topic":"製麦工程","keywords":["製麦","麦芽","大麦","モルティング","浸麦","発芽","焙燥"],"title":"大麦から麦芽をつくる工程──製麦","questionText":"大麦から麦芽をつくる工程を何というか、次の選択肢より適切なものを選べ。（2012年）","choices":[{"key":"a","text":"仕込"},{"key":"b","text":"製麹"},{"key":"c","text":"製麦"},{"key":"d","text":"製芽"}],"answer":"c) 製麦","answerKey":"c","explanationHtml":"<h3>なぜ正解か</h3>\n<p><strong>製麦（せいばく）</strong>とは大麦を麦芽（モルト）に加工する工程の総称で、英語では<strong>モルティング（Malting）</strong>に相当する。大麦を水に浸して発芽させ、その後乾燥・焙燥することで、デンプンやタンパク質を分解する酵素（アミラーゼ・プロテアーゼなど）が活性化し、酵素で分解されやすい状態に変化した<strong>麦芽（モルト）</strong>が完成する。</p>\n<h3>背景知識</h3>\n<h4>製麦の三段階工程</h4>\n<pre><code>大麦\n<p> ↓ ①浸麦（しんばく）Steeping</p>\n<p>   水に浸して水分を吸わせる（水分を約12%→45%に）</p>\n<p> ↓ ②発芽（はつが）Germination</p>\n<p>   約15〜20℃の環境で4〜6日発芽させる</p>\n<p>   → 酵素（アミラーゼ・プロテアーゼ等）が生成・活性化</p>\n<p>   → 胚乳のデンプンが分解されやすい状態に変化</p>\n<p>   この段階の産物を「グリーンモルト（緑麦芽）」と呼ぶ</p>\n<p> ↓ ③焙燥（ばいそう）Kilning</p>\n<p>   50〜80℃以上の熱風で乾燥させ発芽を止める</p>\n<p>   → 水分を約3〜5%に低下</p>\n<p>   → 焙燥温度・時間で麦芽の色・香りが決まる</p>\n<p>麦芽（モルト）完成&lt;/code&gt;&lt;/pre&gt;</p>\n<h4>焙燥温度と麦芽の種類</h4>\n<table><tr><th>焙燥温度</th><th>麦芽の種類</th><th>色</th><th>主な用途</th></tr><tr><td>80℃以下（低温）</td><td>ペールモルト</td><td>淡色</td><td>ピルスナー・ペールエール</td></tr><tr><td>100〜150℃</td><td>クリスタルモルト・カラメルモルト</td><td>琥珀色</td><td>エール・アンバー系</td></tr><tr><td>200〜220℃</td><td>チョコレートモルト・ブラックモルト</td><td>黒褐色</td><td>スタウト・ポーター</td></tr></table>\n<h4>製麦の目的まとめ</h4>\n<p>1. <strong>酵素の生成と活性化</strong>：アミラーゼ・プロテアーゼ等がデンプン・タンパクを分解できる状態に</p>\n<p>2. <strong>成分の変化</strong>：大麦の固い細胞壁が柔らかくなり酵素が作用しやすくなる（溶解）</p>\n<p>3. <strong>香りと色の付与</strong>：焙燥工程でメイラード反応によりモルトフレーバーと色が生成</p>\n<h4>製麦と他の酒類製造工程との比較</h4>\n<table><tr><th>工程名</th><th>読み</th><th>目的</th><th>使用する酒類</th></tr><tr><td><strong>製麦（せいばく）</strong></td><td></td><td>大麦→麦芽</td><td><strong>ビール・ウイスキー</strong></td></tr><tr><td>製麹（せいきく）</td><td></td><td>米→麹</td><td>日本酒・本格焼酎・味噌</td></tr><tr><td>仕込（しこみ）</td><td></td><td>原料の混合・糖化・発酵準備</td><td>各種醸造酒全般</td></tr></table>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 仕込</strong>: 誤り。仕込は麦芽が完成した後の工程で、麦芽を温水に混合してマイシェをつくりビールを醸造する工程を指す。製麦（大麦→麦芽）より後の段階。</li><li><strong>b) 製麹（せいきく）</strong>: 誤り。麹（こうじ）菌を米などに繁殖させる工程で、日本酒・本格焼酎・味噌・醤油などで用いられる。ビール製造とは無関係。「麹」と「麦芽」を混同させる引っかけ。</li><li><strong>c) 製麦</strong>: ✓ 正解。大麦を浸麦→発芽→焙燥の三段階で麦芽に加工する工程。英語名はモルティング。</li><li><strong>d) 製芽</strong>: 誤り。「製芽」という正式な醸造用語は存在しない。「発芽させる」という意味に聞こえるが、製麦工程の正式名称ではない造語。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「大麦→麦芽＝製麦（モルティング）」</strong>：「麦を製す」という漢字の意味そのまま</li><li>製麦の三段階：<strong>浸麦→発芽→焙燥</strong>（「浸・発・焙」で覚える）</li><li>製麹（せいきく）との区別：麦芽はビール、麹は日本酒・焼酎</li><li>問題014・015・016との連動：製麦で生成された麦芽が仕込工程（マイシェ・糖化・タンパク休止）に使われる</li><li>焙燥温度でビールの色が決まる点は、ビアスタイル（淡色〜黒色）との関連でも頻出</li><li>2012年出題実績あり</li></ul>"},{"id":"021","category":"歴史・文化","subcategory":"日本ビール史","difficulty":"発展","topic":"日本最初のビール文献記録","keywords":["阿蘭陀問答","享保9年","1724年","ヒイル","オランダ","江戸時代","ビール初記録","否定的評価"],"title":"日本最古のビール記録：『阿蘭陀問答』の「殊のほか悪しき物」","questionText":"1724（享保9年）に刊行された書物で、ビールのことを「殊のほか悪しき物」と紹介している文献を次の選択肢より選べ。（2017年）","choices":[{"key":"a","text":"阿蘭陀問答"},{"key":"b","text":"解体新書"},{"key":"c","text":"化学新書"},{"key":"d","text":"航米日録"}],"answer":"a) 阿蘭陀問答","answerKey":"a","explanationHtml":"<h3>なぜ正解か</h3>\n<p>日本の文献にビールが初めて登場するのは1724年（享保9年）に刊行された<strong>『阿蘭陀問答』</strong>である。同書にはビールについて次のように記されている：</p>\n<p>&gt; 「殊のほか悪しき物にて何のあぢはいも無御座候、名はヒイルと申候」</p>\n<p>（殊の外（ことのほか）悪しき物で、何の味わいも無い。名前は「ヒイル」と申す）</p>\n<p>当時の日本人の口に合わなかったことを示す否定的な記述だが、これが日本に残るビール（「ヒイル」）に関する最古の文献記録とされる。</p>\n<h3>背景知識</h3>\n<h4>『阿蘭陀問答』とは</h4>\n<p>「阿蘭陀（オランダ）問答」は、オランダ（阿蘭陀）人との問答・交流を記録した江戸時代の文献。江戸幕府が長崎・出島のオランダ商館を通じてのみ西洋との交易を認めていた鎖国時代に、西洋の知識・文物が日本に断片的に伝わっていたことを示す資料群の一つ。1724年刊行。</p>\n<h4>「ヒイル」という名称</h4>\n<p>ビールの当時の表記「ヒイル」は、オランダ語の「bier（ビール）」が日本語に転訛したもの。オランダ語では「bier」、英語では「beer」だが、当時の日本への西洋文化の窓口はオランダ（出島）であったため、オランダ語発音が元になっている。</p>\n<h4>江戸時代と西洋文化の流入</h4>\n<p>江戸時代、日本は鎖国政策をとっていたが、長崎の出島を通じたオランダ・中国との交易は継続されていた。オランダ商館員（カピタン）が江戸に参府する「オランダ商館長江戸参府」の機会に、西洋の物品・食文化・科学技術が伝わった。ビールもこうした交流を通じて日本人の目に触れた。</p>\n<h4>ビールに関するその後の日本の文献</h4>\n<table><tr><th>年</th><th>文献・出来事</th><th>内容</th></tr><tr><td>1724年（享保9）</td><td><strong>阿蘭陀問答</strong></td><td>日本初のビール（ヒイル）記録。否定的記述</td></tr><tr><td>1853年（嘉永6）</td><td>ペリー来航</td><td>アメリカ海軍がビールを持参。幕府役人が接触</td></tr><tr><td>幕末〜明治初期</td><td>横浜・居留地での醸造</td><td>外国人向けに国内醸造が始まる</td></tr><tr><td>1869年（明治2）</td><td>コープランドらが横浜で醸造</td><td>日本初の本格的ビール醸造</td></tr></table>\n<h4>各選択肢の書物について</h4>\n<p><strong>解体新書（1774年）</strong>: 杉田玄白・前野良沢らによる西洋解剖学の翻訳書。オランダ語の解剖書『ターヘル・アナトミア』を日本語訳したもので、蘭学の発展に大きく貢献。ビールとは無関係。</p>\n<p><strong>化学新書（1837年）</strong>: 宇田川榕菴によるオランダ語化学書の翻訳・紹介書。西洋化学を日本に伝えた先駆的著作。「酸素」「水素」などの化学用語を造語したことでも知られる。ビール記述の文脈とは異なる。</p>\n<p><strong>航米日録（1860年）</strong>: 咸臨丸による太平洋横断航海に随行した木村摂津守（木村喜毅）らの記録。幕末のアメリカ渡航記で、福沢諭吉も乗船していた。1724年より136年後の文献であり、ビール初記録とは無関係。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 阿蘭陀問答</strong>: ✓ 正解。1724年（享保9年）刊行。日本最古のビール記録「ヒイル」を否定的に紹介。</li><li><strong>b) 解体新書</strong>: 誤り。1774年（安永3年）刊行の解剖学翻訳書。ビールの記述は含まない。阿蘭陀問答より50年後の出版。</li><li><strong>c) 化学新書</strong>: 誤り。1837年（天保8年）刊行の化学書。ビールに関する記述が主題ではない。</li><li><strong>d) 航米日録</strong>: 誤り。1860年（万延元年）の幕末渡航記録。1724年とは時代が大きく異なる。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「1724年・享保9年・阿蘭陀問答・ヒイル・悪しき物」</strong> の5点をセットで覚える</li><li>原文の一節「<strong>殊のほか悪しき物にて何のあぢはいも無御座候</strong>」は検定問題に直接引用されることがある。「殊のほか（ことのほか）＝非常に」「あぢはい＝味わい」</li><li>「阿蘭陀」＝オランダ。鎖国時代の情報窓口がオランダ→「ヒイル」はオランダ語「bier」の転訛</li><li>解体新書（1774）・化学新書・航米日録はいずれも阿蘭陀問答より<strong>後の時代</strong>の文献。1724年という年号が正解の鍵</li></ul>"},{"id":"022","category":"醸造工程","subcategory":"酵母","difficulty":"応用","topic":"酵母純粋培養法の発明","keywords":["エミール・クリスチャン・ハンゼン","純粋培養法","カールスバーグ研究所","1883年","近代ビールの三大発明","ルイ・パスツール","カール・フォン・リンデ","定温殺菌法"],"title":"近代ビールの三大発明：ハンゼンの酵母純粋培養法","questionText":"ビールにとって好ましい性質の酵母だけを確保するための方法である「酵母の純粋培養法」を発明した人物を、次の選択肢より選べ。（2015年）","choices":[{"key":"a","text":"エミール・クリスチャン・ハンゼン"},{"key":"b","text":"カール・フォン・リンデ"},{"key":"c","text":"ジェームス・バーバーストック"},{"key":"d","text":"ルイ・パスツール"}],"answer":"a) エミール・クリスチャン・ハンゼン","answerKey":"a","explanationHtml":"<h3>なぜ正解か</h3>\n<p>1883年、デンマークのカールスバーグ研究所でエミール・クリスチャン・ハンゼン（Emil Christian Hansen、1842〜1909）が<strong>酵母の純粋培養法</strong>を発明した。それまでビール醸造では複数の酵母株・雑菌が混在した状態で発酵が行われており、品質にばらつきが生じやすかった。ハンゼンは単一細胞の酵母を分離・培養し、醸造に望ましい性質の酵母だけを安定して確保する技術を確立した。これはビールの品質と安定性を劇的に向上させた。</p>\n<h3>背景知識</h3>\n<h4>近代ビールの三大発明</h4>\n<table><tr><th>発明</th><th>発明者</th><th>年</th><th>内容</th></tr><tr><td><strong>酵母の純粋培養法</strong></td><td>エミール・C・ハンゼン</td><td>1883年</td><td>単一酵母株の分離・純粋培養。雑菌混入防止</td></tr><tr><td><strong>冷凍機（人工冷却）</strong></td><td>カール・フォン・リンデ</td><td>1871〜73年頃</td><td>アンモニア冷凍機の実用化。季節・地域を問わずラガー醸造が可能に</td></tr><tr><td><strong>定温殺菌法（パスチャリゼーション）</strong></td><td>ルイ・パスツール</td><td>1860年代</td><td>低温加熱による殺菌。ビールの腐敗・酸化防止。保存性向上</td></tr></table>\n<p>三大発明はいずれも19世紀後半に集中しており、近代的なビール大量生産を可能にした技術的基盤となった。</p>\n<h4>カールスバーグ研究所の役割</h4>\n<p>カールスバーグ（Carlsberg）はデンマーク・コペンハーゲンのビールメーカー。創業者J・C・ヤコブセン（Jacob Christian Jacobsen）は1875年に科学的醸造研究を目的としたカールスバーグ研究所を設立した。ハンゼンはここで研究し、純粋培養酵母の単離に成功。同研究所はその後もビール科学に多大な貢献を続け、現在も機能している。</p>\n<h4>純粋培養法の意義</h4>\n<p>純粋培養法以前：</p>\n<ul><li>「打込み酵母」と呼ばれる前回の醸造残渣（複数酵母株・雑菌混在）を種酵母として使用</li><li>バッチごとに発酵が不安定で品質にばらつき</li><li>野生酵母や乳酸菌の混入による酸敗・異臭のリスクが常にあった</li></ul>\n<p>純粋培養法以後：</p>\n<ul><li>選別した単一酵母株を純粋培養して種酵母として使用</li><li>品質・風味の安定化と再現性の確保</li><li>菌株の保存・管理が可能になり、ブランドの個性を守れるようになった</li></ul>\n<h4>ルイ・パスツールとビール</h4>\n<p>パスツール（Louis Pasteur、1822〜1895）はフランスの微生物学者で「近代微生物学の父」。1876年に著書『ビールの研究』を発表し、発酵が酵母の生命活動であることを証明。また加熱殺菌法（パスチャリゼーション）を確立した。三大発明の「定温殺菌法」の発明者として、ハンゼンと並んでビール科学史に登場する重要人物。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) エミール・クリスチャン・ハンゼン</strong>: ✓ 正解。1883年・カールスバーグ研究所・酵母純粋培養法の発明者。</li><li><strong>b) カール・フォン・リンデ</strong>: 誤り。リンデ（Carl von Linde、1842〜1934）はドイツの工学者で<strong>冷凍機（アンモニア圧縮式冷凍機）</strong>の実用化に成功した。三大発明の「冷凍機」に対応する人物であり、酵母培養法の発明者ではない。</li><li><strong>c) ジェームス・バーバーストック</strong>: 誤り。架空または試験対策上の混同を狙った選択肢。バーバーストック（Barberstork）はビール醸造史上の著名人物として特定されていない。</li><li><strong>d) ルイ・パスツール</strong>: 誤り。パスツールは<strong>定温殺菌法（パスチャリゼーション）</strong>の発明者であり、三大発明のもう一つの発明者。酵母の純粋培養法を発明したのはハンゼンであって、パスツールではない。両者とも微生物・発酵に関わる19世紀の科学者であり混同しやすい。</li></ul>\n<h3>覚え方・関連事項</h3>\n<p><strong>三大発明の対応を丸ごと覚える：</strong></p>\n<table><tr><th>発明</th><th>人物</th><th>国</th></tr><tr><td>酵母の純粋培養法</td><td><strong>ハンゼン</strong></td><td>デンマーク</td></tr><tr><td>冷凍機</td><td><strong>リンデ</strong></td><td>ドイツ</td></tr><tr><td>定温殺菌法</td><td><strong>パスツール</strong></td><td>フランス</td></tr></table>\n<ul><li><strong>「ハンゼン＝純粋培養＝1883年＝カールスバーグ」</strong> のセットが最重要</li><li>パスツールはビール醸造史上の偉人だが、純粋培養ではなく<strong>殺菌法（パスチャリゼーション）</strong> の人物</li><li>リンデは<strong>冷凍機</strong>。「リンデ→冷（冷凍）」と音で結びつけて区別する</li><li>三大発明はすべて19世紀後半（1860〜1883年）に集中している点も覚えておく</li></ul>"},{"id":"022","category":"歴史・文化","subcategory":"ビールの飲み方・サービス","difficulty":"応用","topic":"タンブラーの語源","keywords":["タンブラー","tumble","語源","ビールグラス","ジョッキ","マグ","酒器"],"title":"「倒れる・ころぶ」を語源とするビールグラス──タンブラー","questionText":"英語で「倒れる・ころぶ」を意味する言葉を語源とする酒器を何というか、次の選択肢より選べ。（2013年）","choices":[{"key":"a","text":"ジョッキ"},{"key":"b","text":"タンブラー"},{"key":"c","text":"ピルスナー"},{"key":"d","text":"マグ"}],"answer":"b) タンブラー","answerKey":"b","explanationHtml":"<h3>なぜ正解か</h3>\n<p><strong>タンブラー（Tumbler）</strong>の語源は英語の<strong>tumble（タンブル）＝「倒れる・ころぶ」</strong>。その名の通り、もともとは動物の角や丸底の容器など<strong>自立できない形状の器</strong>を指す言葉だった。やがて平底で自立する現代的な形になってからも、その名称が残った。泡立ちが良いのが特徴とされる。</p>\n<h3>背景知識</h3>\n<h4>タンブラーの歴史的変遷</h4>\n<table><tr><th>時代</th><th>形状</th><th>素材</th></tr><tr><td>古代〜中世</td><td>丸底・自立不可</td><td>動物の角、丸底ガラス</td></tr><tr><td>近世以降</td><td>平底・自立可能</td><td>ガラス</td></tr><tr><td>現代</td><td>直線的な円筒形・平底</td><td>ガラス（一般的）、金属、プラスチック</td></tr></table>\n<h4>ビール用グラスの種類と特徴</h4>\n<table><tr><th>グラス名</th><th>特徴</th><th>語源・備考</th></tr><tr><td><strong>タンブラー</strong></td><td>円筒形・平底・泡立ち良好</td><td>tumble（倒れる）</td></tr><tr><td>ジョッキ</td><td>取っ手付き・大容量</td><td>Jug（水差し）が変化、または人名Jackの愛称</td></tr><tr><td>マグ</td><td>取っ手付き・円筒形・厚手</td><td>英語mug（顔・大きな容器）</td></tr><tr><td>ピルスナーグラス</td><td>細長い脚付き・上部が広がる</td><td>スタイル名（ピルスナービール用）</td></tr><tr><td>ヴァイツェングラス</td><td>上部が膨らむ長細い形状</td><td>小麦（Weizen）ビール用</td></tr><tr><td>スニフター</td><td>下膨れのブランデーグラス型</td><td>香りを閉じ込める形状・高ABVビール向け</td></tr></table>\n<h4>タンブラーの特徴</h4>\n<ul><li><strong>直線的な円筒形</strong>：内側が一定径のため注ぎやすい</li><li><strong>泡立ちが良い</strong>：底部から泡が均一に立ちのぼる</li><li><strong>汎用性が高い</strong>：ラガー・エールを問わず幅広いスタイルに使われる</li><li><strong>日本のビアホール文化</strong>との親和性が高く、広く普及</li></ul>\n<h4>「tumble」から派生した英語</h4>\n<ul><li><strong>tumble</strong>：ころぶ、転落する</li><li><strong>tumbler</strong>：もともと倒れる器＝タンブラー、また「曲芸師（宙返りする人）」の意味も</li><li><strong>tumble dryer</strong>：衣類乾燥機（ドラムが回転＝転がる）</li></ul>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) ジョッキ</strong>: 誤り。取っ手の付いた大きなビールグラスを指す。語源は英語のJug（水差し）またはJack（人名の愛称）から転じたとされ、「倒れる」とは無関係。</li><li><strong>b) タンブラー</strong>: ✓ 正解。tumble（倒れる・ころぶ）を語源とし、もともと自立できない丸底の器を指した。現在は平底の円筒形ガラスを指す。</li><li><strong>c) ピルスナー</strong>: 誤り。ピルスナーはビアスタイル名（チェコ・ピルゼン発祥）であり、同名のグラス（脚付きの細長いグラス）もあるが、語源は地名「ピルゼン（Pilsen）」。「倒れる」とは無関係。</li><li><strong>d) マグ</strong>: 誤り。取っ手付きの厚手の円筒形グラスで、英語mugは「顔」や「大きな容器」を意味する。「倒れる」とは語源が異なる。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「tumble（転ぶ）→タンブラー」</strong>：英語のtumbleをそのままカタカナ読みすれば「タンブル」≒「タンブラー」</li><li>ジョッキ（取っ手あり）とタンブラー（取っ手なし・円筒形）を形状で区別</li><li>タンブラーは<strong>「昔は倒れていた器」</strong>というストーリーで語源を記憶</li><li>問題007（レーシング）と連動：美しいレーシングが残るビアクリーンなグラスはタンブラーでも同様</li><li>2013年出題実績あり</li></ul>"},{"id":"023","category":"歴史・文化","subcategory":"ビールの言語・表記","difficulty":"基礎","topic":"各国語でのビールの呼び名","keywords":["啤酒","中国語","ピーチュウ","麦酒","cerveza","pivo","ビール語源","多言語"],"title":"世界の言語でのビールの呼び名：中国語「啤酒」と各国語","questionText":"日本語では、ビールを「麦酒」などとも書くことがある。「ビール」を中国語で表記したものを次の選択肢より選べ。（2012年）","choices":[{"key":"a","text":"美酒"},{"key":"b","text":"啤酒"},{"key":"c","text":"比酒"},{"key":"d","text":"飛酒"}],"answer":"b) 啤酒","answerKey":"b","explanationHtml":"<h3>なぜ正解か</h3>\n<p>中国語でビールは<strong>「啤酒（ピーチュウ / pí jiǔ）」</strong>と表記する。「啤（ピー）」は「beer（ビール）」の音を漢字で当てた音訳文字であり、「酒（チュウ）」は中国語で酒類全般を指す語。日本語の「麦酒（ばくしゅ）」が原料（麦）を意味する字を使うのに対し、中国語の「啤」は音を写した当て字という違いがある。</p>\n<h3>背景知識</h3>\n<h4>世界各国語でのビールの呼び名</h4>\n<table><tr><th>言語</th><th>ビールの名称</th><th>発音</th><th>語源・備考</th></tr><tr><td><strong>中国語</strong></td><td>啤酒</td><td>ピーチュウ（pí jiǔ）</td><td>「啤」は「beer」の音訳</td></tr><tr><td><strong>日本語</strong></td><td>ビール / 麦酒</td><td>ビール / ばくしゅ</td><td>「ビール」はオランダ語「bier」から。「麦酒」は原料の麦に由来</td></tr><tr><td><strong>英語</strong></td><td>beer</td><td>ビア</td><td>ゲルマン語起源（古英語 beor）</td></tr><tr><td><strong>ドイツ語</strong></td><td>Bier</td><td>ビア</td><td>英語と同語源</td></tr><tr><td><strong>スペイン語</strong></td><td>cerveza</td><td>セルヴェーサ</td><td>ラテン語 cervisia（穀物由来の酒）から</td></tr><tr><td><strong>ロシア語</strong></td><td>pivo</td><td>ピーヴォ</td><td>スラブ語系。「飲み物」に由来</td></tr><tr><td><strong>フランス語</strong></td><td>bière</td><td>ビエール</td><td>ドイツ語・英語と同語源</td></tr><tr><td><strong>イタリア語</strong></td><td>birra</td><td>ビッラ</td><td>同上</td></tr></table>\n<h4>「beer」系と「cerveza」系の語源分岐</h4>\n<p>世界のビールの呼び名は大きく2系統に分かれる：</p>\n<ul><li><strong>「beer/bier」系（ゲルマン語系）</strong>: 英語・ドイツ語・オランダ語・フランス語・イタリア語・日本語（カタカナ）など。古ゲルマン語の「beor」（発酵飲料）に由来するとされる</li><li><strong>「cerveza/cervoise」系（ラテン語系）</strong>: スペイン語・フランス語（古語 cervoise）など。ローマ帝国圏でビールを指したラテン語「cervisia」に由来</li></ul>\n<p>中国語・ロシア語などはこれらと異なる独自の系統を持つ。</p>\n<h4>日本語「麦酒」と「ビール」の使い分け</h4>\n<ul><li>「ビール」：外来語（カタカナ）表記。日常的に最も広く使われる</li><li>「麦酒（ばくしゅ）」：漢語的な表記。酒税法などの法律・公的文書では「麦酒」が使われることがある</li><li>明治期の文献では「ビール」の他に「ビイル」「ヒイル」などの表記も見られる</li></ul>\n<h4>「啤」という漢字について</h4>\n<p>「啤（ピー）」は中国語でビールを表すために作られた比較的新しい漢字（近代以降）。「口」へんに「卑」を組み合わせた形声文字で、「beer」の音（ビー）を写したものとされる。同様の音訳漢字として「可口可楽（コカコーラ）」「咖啡（コーヒー）」なども有名。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 美酒（měi jiǔ）</strong>: 誤り。「美酒」は中国語で「うまい酒・良い酒」を意味する熟語。ビールに限らず優れた酒全般を指す表現であり、ビールの固有名称ではない。</li><li><strong>b) 啤酒（pí jiǔ）</strong>: ✓ 正解。ビールの中国語表記。「啤」は「beer」の音訳。</li><li><strong>c) 比酒（bǐ jiǔ）</strong>: 誤り。「比」は「くらべる」を意味する漢字。「比酒」という表現はビールの正式名称ではない。音は近いが誤った選択肢。</li><li><strong>d) 飛酒（fēi jiǔ）</strong>: 誤り。「飛」は「とぶ」の意味。ビールとは無関係の造語的な誤答選択肢。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「啤酒＝ピーチュウ」</strong>: 「啤」は「beer」の音を漢字にした字と覚える</li><li>試験頻出の多言語セット：<strong>中国語「啤酒（ピーチュウ）」・スペイン語「cerveza（セルヴェーサ）」・ロシア語「pivo（ピーヴォ）」</strong> の3つは一緒に覚える</li><li>「美酒」は「美しい・良い酒」の意味で紛らわしい選択肢。ビールの固有表記ではない</li><li>日本語「麦酒」の「麦」は原料、中国語「啤酒」の「啤」は音訳という違いを意識すると区別しやすい</li></ul>"},{"id":"023","category":"醸造工程","subcategory":"糖化・マッシング","difficulty":"基礎","topic":"マイシェの定義","keywords":["マイシェ","仕込工程","糖化","おかゆ状","麦芽","温水","マッシング"],"title":"仕込工程でつくられる「おかゆ」状のもの──マイシェ","questionText":"ビールの仕込工程において、粉砕された麦芽と温水を混ぜ合わせてつくられる「おかゆ」状のものを何というか、次の選択肢より選べ。（2014年）","choices":[{"key":"a","text":"モルトエキス"},{"key":"b","text":"モルトペースト"},{"key":"c","text":"ブルッフ"},{"key":"d","text":"マイシェ"}],"answer":"d) マイシェ","answerKey":"d","explanationHtml":"<h3>なぜ正解か</h3>\n<p><strong>マイシェ（Maische）</strong>はドイツ語で、粉砕した麦芽（モルト）を温水と混合した<strong>おかゆ状の醪（もろみ）</strong>のことを指す。英語では<strong>マッシュ（Mash）</strong>に相当する。仕込槽や仕込釜に入れられた麦芽は最初は固形物として認識できるが、攪拌しながら適切な温度に保つことでデンプンとタンパク質が徐々に分解され、液状になっていく。</p>\n<h3>背景知識</h3>\n<h4>マイシェから麦汁へ</h4>\n<pre><code>粉砕麦芽 ＋ 温水\n<p>        ↓ 投入・混合</p>\n<p>    【マイシェ】（おかゆ状）</p>\n<p>        ・50℃：タンパク休止（プロテアーゼ活性）</p>\n<p>        ・65℃：糖化（β‐アミラーゼ主体）</p>\n<p>        ・75℃：糖化終了・マッシュアウト</p>\n<p>        ↓ 濾過（ロイタリング）</p>\n<p>    【麦汁】（清澄な糖液）&lt;/code&gt;&lt;/pre&gt;</p>\n<h4>マイシェの状態変化</h4>\n<table><tr><th>段階</th><th>状態</th></tr><tr><td>投入直後</td><td>麦芽の固形物が見える粗いおかゆ状</td></tr><tr><td>糖化中（攪拌・保温）</td><td>徐々に液化が進む</td></tr><tr><td>糖化終了後</td><td>液体（麦汁）＋固形残渣（麦殻）</td></tr><tr><td>濾過後</td><td>清澄な麦汁のみ（固形分は除去）</td></tr></table>\n<h4>各選択肢の用語の本来の意味</h4>\n<table><tr><th>用語</th><th>本来の意味</th></tr><tr><td><strong>マイシェ</strong></td><td>ドイツ語。麦芽＋温水のおかゆ状醪＝正解</td></tr><tr><td>モルトエキス</td><td>麦芽を煮出して濃縮した液体。ホームブルーイング等で原料として使う市販品</td></tr><tr><td>モルトペースト</td><td>一般的な醸造用語としては使われない造語</td></tr><tr><td>ブルッフ</td><td>麦汁煮沸時に生成されるタンパク質の凝固物（問題018参照）。マイシェとは別の工程・別の産物</td></tr></table>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) モルトエキス</strong>: 誤り。モルトエキスは麦芽エキスとも呼ばれ、麦汁を濃縮した製品。仕込工程のおかゆ状の状態を指す言葉ではない。</li><li><strong>b) モルトペースト</strong>: 誤り。醸造の正式用語ではない造語。「ペースト状」というイメージから引っかかりやすいが、正式名称はマイシェ。</li><li><strong>c) ブルッフ</strong>: 誤り。ブルッフは麦汁<strong>煮沸</strong>工程で生成されるタンパク質の凝固物で、マイシェ（糖化工程の醪）とは全く異なる。問題018で扱った用語。</li><li><strong>d) マイシェ</strong>: ✓ 正解。粉砕麦芽＋温水のおかゆ状の醪。英語名はマッシュ（Mash）。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「マイシェ＝マッシュ（Mash）のドイツ語版」</strong>：英語のマッシュポテトの「マッシュ」と同語源</li><li>「おかゆ」というキーワードが試験に出たら迷わずマイシェ</li><li>問題015（製造工程の順序：マイシェ→麦汁→若ビール→ビール）と連動</li><li>問題014（マイシェの温度管理：50℃・65℃・75℃）と連動</li><li>ブルッフ（問題018）との混同注意：同じ仕込工程でもマイシェは<strong>糖化段階の醪</strong>、ブルッフは<strong>煮沸段階の凝固物</strong></li><li>2014年出題実績あり</li></ul>"},{"id":"024","category":"歴史・文化","subcategory":"日本のビール史","difficulty":"応用","topic":"馬越恭平・東洋のビール王","keywords":["馬越恭平","東洋のビール王","日本麦酒醸造会社","大日本麦酒","恵比寿ビール","明治","ビヤホール"],"title":"「東洋のビール王」と呼ばれた人物──馬越恭平","questionText":"「東洋のビール王」と呼ばれた人物の名前を次の選択肢より選べ。（2017年）","choices":[{"key":"a","text":"岩崎 弥之助"},{"key":"b","text":"鳥井 駒吉"},{"key":"c","text":"中埜 又左衛門"},{"key":"d","text":"馬越 恭平"}],"answer":"d) 馬越 恭平","answerKey":"d","explanationHtml":"<h3>なぜ正解か</h3>\n<p><strong>馬越恭平（まごし きょうへい、1844〜1933）</strong>は、1891（明治24）年に経営不振の日本麦酒醸造会社の再建を託された実業家。徹底した経営合理化でわずか1年で黒字転換を実現し、その後1899（明治32）年8月4日に銀座8丁目に日本初のビヤホール「恵比寿ビール Beer Hall」を開業。さらに日本麦酒・大阪麦酒・札幌麦酒の三社合併により<strong>大日本麦酒</strong>を誕生させた中心人物として「<strong>東洋のビール王</strong>」と称された。</p>\n<h3>背景知識</h3>\n<h4>馬越恭平の主な功績年表</h4>\n<table><tr><th>年</th><th>出来事</th></tr><tr><td>1844年</td><td>出生</td></tr><tr><td>1891（明治24）年</td><td>日本麦酒醸造会社の再建を託されわずか1年で黒字化</td></tr><tr><td>1899（明治32）年8月4日</td><td>銀座8丁目に日本初のビヤホール「恵比寿ビール Beer Hall」を開業</td></tr><tr><td>1906（明治39）年</td><td>日本麦酒・大阪麦酒・札幌麦酒の三社合併により<strong>大日本麦酒</strong>を設立</td></tr><tr><td>1933年</td><td>逝去</td></tr></table>\n<h4>大日本麦酒とは</h4>\n<p>大日本麦酒（だいにほんびーる）は1906年に設立された日本最大のビール会社で、戦後の1949年に独占禁止法により<strong>朝日麦酒（現・アサヒビール）</strong>と<strong>日本麦酒（現・サッポロビール）</strong>に分割解体された。</p>\n<h4>選択肢の人物と日本ビール史の関係</h4>\n<table><tr><th>人物</th><th>本来の役割・所属</th></tr><tr><td><strong>馬越恭平</strong></td><td>日本麦酒醸造会社再建・大日本麦酒設立・東洋のビール王</td></tr><tr><td>岩崎弥之助</td><td>三菱財閥2代目総帥。ビール業界とは直接の関係は薄い</td></tr><tr><td>鳥井駒吉</td><td>サントリー創業者・鳥井信治郎の父。洋酒業界との関連はあるが別人</td></tr><tr><td>中埜又左衛門</td><td>愛知・半田の醸造家。カブトビール（丸三麦酒）の創業者として知られる</td></tr></table>\n<h4>ビヤホール開業との連動（問題009）</h4>\n<p>馬越恭平が1899年8月4日に開業した「恵比寿ビール Beer Hall」は問題009で扱った「ビヤホールの日（8月4日）」の由来である。馬越という人物と、ビヤホールの日・恵比寿ビール・大日本麦酒という事績をセットで覚えることが重要。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 岩崎弥之助</strong>: 誤り。三菱財閥の2代目。実業家として有名だが、ビール産業との直接的な関わりは知られていない。</li><li><strong>b) 鳥井駒吉</strong>: 誤り。サントリー創業者・鳥井信治郎の父の名前に似るが、ビール王の称号とは無関係。試験の引っかけとして名前が紛らわしい。</li><li><strong>c) 中埜又左衛門</strong>: 誤り。愛知県半田市の中埜家はカブトビール（丸三麦酒）の経営者として日本ビール史に名を残すが、「東洋のビール王」は馬越恭平の称号。</li><li><strong>d) 馬越恭平</strong>: ✓ 正解。日本麦酒醸造会社の再建・日本初ビヤホール開業・大日本麦酒設立の三大事績で「東洋のビール王」の称号を得た。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「馬越＝ビール王＝ビヤホール＝8月4日＝銀座8丁目」</strong>：すべて8に縁のある馬越恭平</li><li>問題009（ビヤホールの日）の主役が馬越恭平：同一人物の別問題として連動</li><li>大日本麦酒→戦後分割：<strong>アサヒ＋サッポロ</strong>という現代大手の源流として覚えておく</li><li>中埜又左衛門（カブトビール）は名古屋・半田の地域史で出題されることがある別の人物</li><li>2017年出題実績あり</li></ul>"},{"id":"024","category":"原材料","subcategory":"麦芽","difficulty":"基礎","topic":"ビールの液色と麦芽","keywords":["麦芽","液色","焙煎麦芽","SRM","EBC","ローストモルト","カラメルモルト","ペールモルト"],"title":"ビールの色を決めるのは麦芽：焙煎度合いと液色の関係","questionText":"選択肢のうち、ビールの液色に最も影響を及ぼすものはどれか。正しいものを次の選択肢より選べ。（2017年）","choices":[{"key":"a","text":"麦芽"},{"key":"b","text":"ホップ"},{"key":"c","text":"水"},{"key":"d","text":"酵母"}],"answer":"a) 麦芽","answerKey":"a","explanationHtml":"<h3>なぜ正解か</h3>\n<p>ビールの液色（黄金色・琥珀色・茶色・黒など）に最も大きな影響を与えるのは<strong>麦芽の色・種類</strong>である。麦芽は製麦（モルティング）の乾燥工程における加熱温度と時間によって色が変化し、焙煎度が高いほど麦芽が濃い色になり、それを使ったビールも濃い色になる。淡色の麦芽を使えば黄金色のビールに、黒く焙煎した麦芽（ローストモルト）を使えばスタウトのような黒いビールになる。</p>\n<h3>背景知識</h3>\n<h4>麦芽の焙煎度と色の対応</h4>\n<table><tr><th>麦芽の種類</th><th>焙煎温度</th><th>色（EBC）</th><th>用途・代表スタイル</th></tr><tr><td>ペールモルト（ラガーモルト）</td><td>低温乾燥</td><td>3〜5 EBC</td><td>ピルスナー・ラガー全般</td></tr><tr><td>ミュンヘンモルト</td><td>やや高温</td><td>10〜20 EBC</td><td>マルツェン・ヘレス</td></tr><tr><td>カラメルモルト（クリスタルモルト）</td><td>湿熱焙煎</td><td>50〜400 EBC</td><td>ペールエール・アンバーエール・甘みとコクの付与</td></tr><tr><td>チョコレートモルト</td><td>高温焙煎</td><td>800〜1000 EBC</td><td>ポーター・スタウト</td></tr><tr><td>ブラックモルト（ローストモルト）</td><td>最高温焙煎</td><td>1400 EBC以上</td><td>スタウト・ドライスタウト</td></tr></table>\n<h4>ビールの色の測定単位</h4>\n<p>ビールの色は国際的な指標で数値化されている：</p>\n<ul><li><strong>SRM（Standard Reference Method）</strong>: アメリカで使用。数値が高いほど濃い色</li><li><strong>EBC（European Brewery Convention）</strong>: ヨーロッパ・日本で使用。SRM × 約1.97 ≒ EBC</li></ul>\n<p>例：ピルスナーはSRM 2〜3程度（淡黄色）、スタウトはSRM 30以上（黒）</p>\n<h4>メイラード反応とカラメル化</h4>\n<p>麦芽が色づく主な化学反応：</p>\n<ul><li><strong>メイラード反応</strong>: アミノ酸と糖が加熱により反応し、褐色の色素と香ばしい風味を生成。焙煎温度が高いほど進行</li><li><strong>カラメル化反応</strong>: 糖が高温で分解・重合して茶色くなる反応</li></ul>\n<p>これらの反応が麦芽の色・風味の多様性を生み出す。</p>\n<h4>ホップ・水・酵母の液色への影響</h4>\n<ul><li><strong>ホップ</strong>: 緑色の植物成分を含むが、煮沸・発酵後には液色への影響はほとんどない</li><li><strong>水</strong>: ミネラル成分が風味に影響するが、液色への直接的な影響は軽微（一部の鉄分などが色に影響するケースはある）</li><li><strong>酵母</strong>: 発酵中に色素を生成することはなく、液色への直接的な影響はほぼない。ただし酵母が液中に懸濁すると白濁して色調が変わることはある（ヘーフェヴァイツェン等）</li></ul>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 麦芽</strong>: ✓ 正解。焙煎度・種類によって液色を決定する最大の要因。淡色〜黒色まで幅広い色調を生み出す。</li><li><strong>b) ホップ</strong>: 誤り。ホップはビールの苦味・香りに大きく寄与するが、液色への影響は非常に小さい。大量のドライホッピングでわずかに色調が変わることはあるが、決定的な要因ではない。</li><li><strong>c) 水</strong>: 誤り。水質（硬水・軟水・ミネラル成分）はビールの風味・泡立ち・口当たりに影響するが、液色の決定的な要因ではない。</li><li><strong>d) 酵母</strong>: 誤り。酵母は発酵（アルコール・CO₂生成）・風味形成に必須だが、ビールの液色を決める要因ではない。懸濁した酵母が白濁を引き起こすことはある。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「ビールの色＝麦芽の色」</strong> — 原料そのものの色が液体に移ると理解すると直感的</li><li><strong>焙煎が強い→色が濃い</strong>: ペールモルト（淡）→カラメルモルト（琥珀）→ローストモルト（黒）</li><li>黒ビール（スタウト・ポーター）には<strong>ローストモルト・チョコレートモルト</strong>が必須</li><li>ビールの色の単位は<strong>SRM（米）とEBC（欧・日）</strong> の2種類。SRM × 約2 ≒ EBC</li><li>正答率80.8%（2017年出題）と記録されており、基礎問題として重要</li></ul>"},{"id":"025","category":"ビアスタイル","subcategory":"エール","difficulty":"基礎","topic":"IPAの誕生・歴史","keywords":["IPA","India Pale Ale","インド","イギリス","ホップ","防腐","18世紀"],"title":"IPAはどこへ輸送するために開発されたか","questionText":"イギリスで誕生したIPAはどこに輸送されるために開発されたものか、その行先を、次の選択肢より選べ。（2016年）","choices":[{"key":"a","text":"イスタンブール"},{"key":"b","text":"イスラエル"},{"key":"c","text":"インド"},{"key":"d","text":"西インド諸島"}],"answer":"c) インド","answerKey":"c","explanationHtml":"<h3>なぜ正解か</h3>\n<p><strong>IPA（India Pale Ale）</strong>は名称そのものに答えが含まれており、<strong>India（インド）</strong>への輸送を目的として開発されたビアスタイルである。18世紀末、イギリスから植民地インドへのビール輸送には赤道を越える長距離の航海（数ヶ月）が必要で、通常のビールでは途中で劣化・腐敗してしまった。そこでホップの防腐効果を最大限に活用するために<strong>ホップを大量投入</strong>し、さらに<strong>アルコール度数を高め（4.5〜7.0%程度）</strong>て保存性を高めたビールが生まれた。これがIPAの起源とされる。</p>\n<h3>背景知識</h3>\n<h4>IPAの誕生とイギリス植民地時代</h4>\n<p>18世紀のイギリスは東インド会社を通じてインドを植民地支配しており、現地に駐在する兵士・官僚・商人たちへの物資補給が必要だった。ビールも重要な補給品の一つだったが、赤道を越える長期航海中に腐敗する問題があった。</p>\n<p><strong>解決策：ホップ大量投入＋高アルコール度数</strong></p>\n<ul><li><strong>ホップのイソアルファ酸</strong>には抗菌・防腐作用がある</li><li><strong>高アルコール</strong>も微生物の増殖を抑制する</li><li>長旅の振動・温度変化の中で熟成が進み、むしろ現地到着時に飲み頃になったという説もある</li></ul>\n<h4>IPAの特徴</h4>\n<table><tr><th>項目</th><th>内容</th></tr><tr><td>正式名称</td><td>India Pale Ale</td></tr><tr><td>発酵方式</td><td>上面発酵（エール）</td></tr><tr><td>ABV</td><td>4.5〜7.0%（やや高め）</td></tr><tr><td>IBU</td><td>40〜70以上（強い苦味）</td></tr><tr><td>特徴</td><td>強いホップの苦味・香り、やや高いアルコール</td></tr><tr><td>誕生時期</td><td>18世紀末</td></tr><tr><td>誕生地</td><td>イギリス</td></tr></table>\n<h4>IPAの派生スタイル</h4>\n<table><tr><th>スタイル</th><th>特徴</th></tr><tr><td>イングリッシュIPA</td><td>原点。土っぽいホップ香、やや抑えめの苦味</td></tr><tr><td>アメリカンIPA</td><td>柑橘・松脂系のホップ香が強烈。西海岸発祥</td></tr><tr><td>ダブルIPA（DIPA・IIPA）</td><td>ABV 7.5%以上、IBU 60以上の超強烈バージョン</td></tr><tr><td>セッションIPA</td><td>ABV 4%以下でホップ香を楽しむ低アルコール版</td></tr><tr><td>ニューイングランドIPA（NEIPA）</td><td>濁り系・柔らかい口当たり・フルーティー</td></tr></table>\n<h4>ホップの防腐作用（問題012との連動）</h4>\n<p>ホップのアルファ酸が煮沸でイソアルファ酸に変化し苦味をもたらすが、このイソアルファ酸には<strong>グラム陽性菌に対する抗菌作用</strong>もある。IPAのホップ大量投入は、この防腐機能を意図的に最大化したものといえる。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) イスタンブール</strong>: 誤り。「I」で始まる地名として紛らわしいが、IPAとは無関係。イスタンブールはオスマン帝国の首都（現トルコ）。</li><li><strong>b) イスラエル</strong>: 誤り。同様に「I」で始まる地名の引っかけ。IPAの誕生と無関係。</li><li><strong>c) インド</strong>: ✓ 正解。IPA＝<strong>India</strong> Pale Ale。18世紀末にイギリスからインドへの長期輸送に耐えるよう開発された。</li><li><strong>d) 西インド諸島</strong>: 誤り。カリブ海の島々で、イギリスの植民地でもあった。「インド」という言葉が含まれるため紛らわしいが、西インド諸島≠インド（南アジア）。IPAはインド亜大陸向けに開発された。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>IPA＝India Pale Ale</strong>：頭文字を展開すれば「インド」が答え</li><li>西インド諸島（Caribbean）はカリブ海の島々。インド亜大陸とは全く別の地域</li><li><strong>ホップ大量投入＋高ABV＝防腐のため</strong>という開発目的のストーリーで覚える</li><li>問題006（イングリッシュブラウンエール）と対比：ブラウンエールはホップ控えめ、IPAはホップ最大量</li><li>問題012（イソアルファ酸・ホップの防腐作用）と連動：ホップの抗菌作用がIPAの防腐に活用された</li><li>2016年出題実績あり</li></ul>"},{"id":"026","category":"醸造工程","subcategory":"発酵・熟成","difficulty":"基礎","topic":"若ビール","keywords":["若ビール","主発酵","前発酵","後発酵","熟成","貯酒タンク","Green Beer"],"title":"主発酵後・熟成前のビールを何というか──若ビール","questionText":"主発酵工程が終了し、貯酒タンクで熟成させる前のビールを何というか、次の選択肢より選べ。（2016年）","choices":[{"key":"a","text":"未ビール"},{"key":"b","text":"初ビール"},{"key":"c","text":"若ビール"},{"key":"d","text":"無濾過ビール"}],"answer":"c) 若ビール","answerKey":"c","explanationHtml":"<h3>なぜ正解か</h3>\n<p>主発酵（前発酵）が終了した直後のビールは<strong>「若ビール」</strong>と呼ばれる。英語では<strong>Green Beer（グリーンビール）</strong>または Young Beer ともいう。この段階ではアルコール発酵は完了しているが、ダイアセチル（バター臭）・アセトアルデヒド（青臭さ）などの不快な副産物が残っており、味わいが粗く未熟な香りを含んでいる。その後、貯酒タンクで低温熟成（後発酵・ラグリング）させることで副産物が除去・減少し、香味が整えられてビールとして完成する。</p>\n<h3>背景知識</h3>\n<h4>主発酵（前発酵）と後発酵（熟成）の違い</h4>\n<table><tr><th>段階</th><th>名称</th><th>内容</th><th>温度・期間</th></tr><tr><td>主発酵</td><td>前発酵</td><td>酵母が糖をアルコール＋CO₂に変換する主要工程</td><td>ラガー5〜12℃・1〜2週間、エール15〜25℃・3〜5日</td></tr><tr><td><strong>（主発酵終了直後）</strong></td><td><strong>若ビール</strong></td><td><strong>アルコールはあるが雑味・未熟な香りが残る</strong></td><td>—</td></tr><tr><td>後発酵</td><td>熟成・貯酒</td><td>低温で静置・副産物を除去・炭酸を整える</td><td>0〜4℃・数週間〜数ヶ月（ラガーの場合）</td></tr></table>\n<h4>若ビールに含まれる主な副産物</h4>\n<table><tr><th>物質</th><th>香り</th><th>由来</th><th>熟成での変化</th></tr><tr><td>ダイアセチル</td><td>バター・バタースコッチ臭</td><td>酵母の代謝副産物</td><td>酵母が再吸収して低減</td></tr><tr><td>アセトアルデヒド</td><td>青臭さ・生りんご臭</td><td>発酵中間産物</td><td>熟成で揮発・低減</td></tr><tr><td>硫化水素</td><td>卵の腐敗臭</td><td>発酵初期に発生</td><td>揮発して低減</td></tr></table>\n<h4>若ビールの状態</h4>\n<pre><code>主発酵終了\n<p>    ↓</p>\n<p>【若ビール】</p>\n<p>・アルコール：あり（発酵完了）</p>\n<p>・炭酸：不十分</p>\n<p>・副産物：ダイアセチル等が残存</p>\n<p>・外観：やや濁り</p>\n<p>    ↓ 後発酵・熟成・貯酒</p>\n<p>【熟成ビール】</p>\n<p>・副産物低減・炭酸安定・清澄化</p>\n<p>    ↓ ろ過・仕上げ</p>\n<p>【完成品ビール】&lt;/code&gt;&lt;/pre&gt;</p>\n<h4>多数年にわたる出題実績</h4>\n<p>この問題は2012・2013・2014・2016年と繰り返し出題され、2016年の正答率は<strong>98%</strong>という超頻出問題。確実に正解したい基礎問題である。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 未ビール</strong>: 誤り。実在しない造語。「まだビールになっていない」という意味に聞こえるが、主発酵後はアルコールを含む立派なビールの前段階。正式名称ではない。</li><li><strong>b) 初ビール</strong>: 誤り。実在しない造語。「最初に出てくるビール」という印象を与えるが、醸造用語ではない。</li><li><strong>c) 若ビール</strong>: ✓ 正解。主発酵終了後・熟成前の段階。英語名Green Beer / Young Beer。</li><li><strong>d) 無濾過ビール</strong>: 誤り。無濾過ビールは酵母・タンパク質を取り除くろ過工程を経ていないビールの総称で、濁りのある状態が特徴。若ビールとは別の概念で、完成品として販売される商品カテゴリ。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「若い＝まだ成熟していない」</strong>：若ビール＝まだ熟成が必要なビール、という名前通りの意味</li><li>英語名<strong>Green Beer</strong>の\"Green\"も「未熟・青い」の意で同じ意味</li><li>問題015（製造工程の順序：マイシェ→麦汁→<strong>若ビール</strong>→ビール）と連動。若ビールは4段階の第3ステップ</li><li>問題002（若ビールの発酵）と同テーマ：問題002はヴァイツェン酵母の特性、こちらは若ビールの定義</li><li>2012・2013・2014・2016年の超頻出問題。正答率98%（2016年）で絶対落とせない</li></ul>"}];

    let deck = [...ALL];
    let idx = 0;
    let revealed = false;
    let correctCount = 0;
    let answeredSet = new Set();
    let currentCat = '';

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function applyFilter(cat) {
      currentCat = cat;
      deck = cat ? ALL.filter(q => q.category === cat) : [...ALL];
      idx = 0;
      correctCount = 0;
      answeredSet = new Set();
      render();
    }

    function render() {
      if (deck.length === 0) {
        document.getElementById('questionText').textContent = '該当する問題がありません。';
        document.getElementById('choiceList').innerHTML = '';
        document.getElementById('quizMeta').innerHTML = '';
        document.getElementById('progressLabel').textContent = '';
        document.getElementById('progressFill').style.width = '0%';
        document.getElementById('btnReveal').disabled = true;
        document.getElementById('answerSection').classList.remove('visible');
        return;
      }

      const q = deck[idx];
      revealed = false;

      // progress
      const pct = Math.round((idx / deck.length) * 100);
      document.getElementById('progressLabel').textContent = `${idx + 1} / ${deck.length}問`;
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('scoreLabel').textContent =
        answeredSet.size > 0 ? `正解 ${correctCount} / ${answeredSet.size}問` : '';

      // meta badges
      const diffClass = 'badge-diff-' + (q.difficulty || '');
      document.getElementById('quizMeta').innerHTML =
        `<span class="badge badge-cat">${q.category}</span>` +
        (q.subcategory ? `<span class="badge badge-cat" style="opacity:.7">${q.subcategory}</span>` : '') +
        (q.difficulty ? `<span class="badge ${diffClass}">${q.difficulty}</span>` : '');

      // question
      document.getElementById('questionText').textContent = q.questionText || q.title;

      // choices
      const ul = document.getElementById('choiceList');
      ul.innerHTML = '';
      for (const c of q.choices) {
        const li = document.createElement('li');
        li.className = 'choice-item';
        li.innerHTML = `<span class="choice-key">${c.key})</span><span>${c.text}</span>`;
        ul.appendChild(li);
      }

      // answer section hidden
      document.getElementById('answerSection').classList.remove('visible');
      document.getElementById('btnReveal').disabled = false;
      document.getElementById('btnReveal').textContent = '答えを見る';

      // nav
      document.getElementById('btnPrev').disabled = idx === 0;
      document.getElementById('btnNext').disabled = idx === deck.length - 1;
    }

    function reveal() {
      if (revealed) return;
      revealed = true;
      const q = deck[idx];

      // highlight choices
      const items = document.getElementById('choiceList').children;
      for (const li of items) {
        const key = li.querySelector('.choice-key').textContent.replace(')', '');
        if (key === q.answerKey) li.classList.add('correct');
        else li.classList.add('wrong');
      }

      document.getElementById('answerText').textContent = q.answer;
      document.getElementById('explanationDiv').innerHTML = q.explanationHtml;
      document.getElementById('answerSection').classList.add('visible');
      document.getElementById('btnReveal').disabled = true;

      if (!answeredSet.has(idx)) {
        answeredSet.add(idx);
        correctCount++;
      }
      document.getElementById('scoreLabel').textContent =
        `正解 ${correctCount} / ${answeredSet.size}問`;
    }

    document.getElementById('btnReveal').addEventListener('click', reveal);

    document.getElementById('btnPrev').addEventListener('click', () => {
      if (idx > 0) { idx--; render(); }
    });
    document.getElementById('btnNext').addEventListener('click', () => {
      if (idx < deck.length - 1) { idx++; render(); }
    });

    document.getElementById('btnShuffle').addEventListener('click', () => {
      shuffle(deck);
      idx = 0;
      correctCount = 0;
      answeredSet = new Set();
      render();
    });
    document.getElementById('btnReset').addEventListener('click', () => {
      deck = currentCat ? ALL.filter(q => q.category === currentCat) : [...ALL];
      idx = 0;
      correctCount = 0;
      answeredSet = new Set();
      render();
    });

    document.getElementById('filterRow').addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilter(btn.dataset.cat);
    });

    // keyboard shortcuts
    document.addEventListener('keydown', e => {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!revealed) reveal(); }
      if (e.key === 'ArrowRight' || e.key === 'n') document.getElementById('btnNext').click();
      if (e.key === 'ArrowLeft'  || e.key === 'p') document.getElementById('btnPrev').click();
    });

    render();
  </script>
