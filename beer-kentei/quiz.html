  <script>
    const ALL = [{"id":"001","category":"原材料","subcategory":"麦芽","difficulty":"基礎","topic":"二条大麦とピルスナー","keywords":["二条大麦","六条大麦","ピルスナー","麦芽","原材料","小麦","ライ麦"],"title":"ピルスナーに使われる麦の種類","questionText":"一般的なピルスナースタイルに使われる麦の種類として、最も適切なものを次の選択肢より選べ。","choices":[{"key":"a","text":"小麦"},{"key":"b","text":"二条大麦"},{"key":"c","text":"六条大麦"},{"key":"d","text":"ライ麦"}],"answer":"b) 二条大麦","answerKey":"b","explanationHtml":"<h3>なぜ正解か</h3>\n<p>二条大麦（<em>Hordeum vulgare</em> var. <em>distichon</em>）はビール醸造用の主要穀物として世界中で最も多く使われている品種。穂の左右に2列だけ実がつく（二条）ため、粒が大きく均一に育ち、デンプン含有量が高くタンパク質が比較的少ない。これによりビール醸造に理想的な特性（高い糖化効率・澄んだ麦汁）を発揮する。ピルスナーは淡色で軽快な飲み口が特徴であり、この方向性を最大限に引き出すために二条大麦麦芽が採用される。</p>\n<h3>背景知識</h3>\n<h4>大麦の条性（じょうせい）</h4>\n<p>大麦は穂に実がつく列数によって分類される。</p>\n<table><tr><th>種類</th><th>列数</th><th>特徴</th></tr><tr><td>二条大麦</td><td>2列</td><td>粒が大きく均一、デンプン多、タンパク質少、醸造用に最適</td></tr><tr><td>六条大麦</td><td>6列</td><td>粒が小さく不均一になりがち、タンパク質多、食用・飼料用が主</td></tr></table>\n<p>二条大麦の産地は欧州（ドイツ・チェコ・イギリスなど）、オーストラリア、カナダなどが有名。日本では「サチホゴールデン」「ニシノホシ」などの二条大麦品種がビール麦として栽培されている。</p>\n<h4>六条大麦のビール醸造への使用</h4>\n<p>六条大麦は主に食用・飼料用だが、ビール醸造に使用されないわけではない。日本では一部のクラフトビールや大手ビールメーカーが六条大麦を使った商品を展開している。ただし「一般的なピルスナー」の主原料としては二条大麦が標準。</p>\n<h4>小麦麦芽（ヴァイツェンとの関係）</h4>\n<p>小麦をビール原料に使う代表スタイルはヴァイツェン（白ビール）。小麦麦芽は独特のバナナや丁子のような香りをもたらすが、タンパク質が多くろ過が難しいため、ピルスナーの原料には使われない。</p>\n<h4>ライ麦</h4>\n<p>ライ麦を使ったビールは「ロッゲンビア（Roggenbier）」と呼ばれる。β-グルカンが多くフィルトレーションが困難で、非常に少数のクラフトビールにのみ使用される特殊な原料。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 小麦</strong>: ヴァイツェン・ヴィットなど白ビール系スタイルに使用。ピルスナーには不適。</li><li><strong>b) 二条大麦</strong>: ✓ 正解。ビール醸造で最も普及した品種。ピルスナーの標準原料。</li><li><strong>c) 六条大麦</strong>: 一部のビールに使用実績はあるが、ピルスナーの「一般的」な選択ではない。</li><li><strong>d) ライ麦</strong>: ロッゲンビアなど特殊スタイル向け。ピルスナーには使用されない。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「二条 = ビール、六条 = 食卓」</strong> と覚えると区別しやすい</li><li>ビール原料として麦を扱う問題では「二条大麦が基本」が頻出のポイント</li><li>条件付き例外（六条大麦を使うビールも存在する）は引っかけとして出題されやすい</li><li>ピルスナーの定義：チェコのピルゼン発祥、淡色・下面発酵・ホップ香が特徴</li></ul>"},{"id":"002","category":"ビアスタイル","subcategory":"エールスタイル","difficulty":"基礎","topic":"アルトビール","keywords":["アルト","デュッセルドルフ","上面発酵","ドイツビール","エール","ラインラント","銅色","苦味"],"title":"アルトビール：デュッセルドルフ発祥の「古き」エール","questionText":"ドイツ・デュッセルドルフで発展したビアスタイルで、「古い」を意味するドイツ語がスタイル名の由来の一つとされている。このビアスタイルを次の選択肢より選べ。","choices":[{"key":"a","text":"アビイビール"},{"key":"b","text":"アルト"},{"key":"c","text":"シュヴァルツ"},{"key":"d","text":"ラオホ"}],"answer":"b) アルト","answerKey":"b","explanationHtml":"<h3>なぜ正解か</h3>\n<p>「アルト（Alt）」はドイツ語で「古い（old）」を意味する。これは19世紀後半に下面発酵（ラガー）ビールが普及する以前から、ドイツで伝統的に造られていた上面発酵（エール）製法を指している。「古い製法で造られたビール」という意味で「アルトビール」と呼ばれるようになった。デュッセルドルフはこのスタイルの本場であり、現地ではシンプルに「Alt」と呼ばれて親しまれている。</p>\n<h3>背景知識</h3>\n<h4>スタイルの特徴</h4>\n<p>アルトビールは上面発酵酵母を使用して醸造されるが、発酵・熟成温度はラガーに近い低温（約8〜15℃）で管理される。このため、エールでありながらラガーのような滑らかでクリーンな飲み口を持つ。</p>\n<ul><li><strong>色</strong>: 琥珀色〜銅赤色（SRM 11〜17程度）</li><li><strong>ABV</strong>: 4.5〜5.2%程度</li><li><strong>苦味</strong>: ホップの苦味がはっきりと感じられる（IBU 25〜50程度）</li><li><strong>風味</strong>: 麦芽のコクとホップのバランスが良く、フルーティなエステルは控えめ</li></ul>\n<h4>デュッセルドルフとの関係</h4>\n<p>デュッセルドルフはライン川沿いに位置するドイツ・ノルトライン＝ヴェストファーレン州の都市。アルトビールはこの地域に根付いた地酒的存在で、地元の醸造所（ウリゲ、シュリュッセル、フッフェンなど）が旧市街の醸造所直営パブで提供する文化が今も残る。</p>\n<h4>ラガーとの関係</h4>\n<p>19世紀以降、冷蔵技術の発達とともに下面発酵のラガービールがドイツ全土に普及した。しかしデュッセルドルフをはじめとする一部の地域では、あえて伝統的な上面発酵製法を守り続けた。その姿勢が「アルト（古い）」という名前に込められている。</p>\n<h4>類似スタイルとの比較</h4>\n<table><tr><th>スタイル</th><th>発酵</th><th>産地</th><th>特徴</th></tr><tr><td>アルト</td><td>上面（低温熟成）</td><td>デュッセルドルフ</td><td>銅色・ホップ苦味</td></tr><tr><td>ケルシュ</td><td>上面（低温熟成）</td><td>ケルン</td><td>淡色・爽やか</td></tr><tr><td>バイエルン式エール</td><td>上面</td><td>バイエルン</td><td>フルーティ</td></tr></table>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) アビイビール</strong>: ベルギーのアベイ（修道院）ビール。修道院またはその認定を受けた醸造所で造られるビールで、ベルギーのスタイル。デュッセルドルフとは無関係。</li><li><strong>b) アルト</strong>: ✓ 正解。ドイツ語で「古い」を意味し、デュッセルドルフを中心に発展した上面発酵ビール。</li><li><strong>c) シュヴァルツ</strong>: ドイツ語で「黒い」を意味する黒ビール。下面発酵（ラガー）スタイルで、特にチューリンゲン地方やフランコニア地方が産地として知られる。名前の由来は「黒」であり「古い」ではない。</li><li><strong>d) ラオホ</strong>: ドイツ語で「煙」を意味する燻製麦芽を使ったビール。バンベルク（フランコニア地方）が本場。スモーキーな風味が特徴で、名前の由来は「煙」。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「Alt = 古い」</strong>：英語の「old」と同源。「alte（古い）＋ Bier（ビール）」＝昔ながらの製法のビール</li><li><strong>デュッセルドルフ＝アルト、ケルン＝ケルシュ</strong>：ともにライン川沿いの都市で、それぞれ独自の上面発酵ビールを持つライバル関係</li><li><strong>ドイツの「古い製法」は上面発酵</strong>：ラガーが主流になる前、ヨーロッパのビールはほぼすべてエール（上面発酵）だった</li><li>ケルシュとアルトはともにドイツのEU地理的表示保護（PGI）を受けており、正式名称として使用できる産地が定められている</li></ul>"},{"id":"002","category":"醸造工程","subcategory":"発酵・熟成","difficulty":"基礎","topic":"若ビール","keywords":["若ビール","主発酵","貯酒タンク","熟成","二次発酵","ラガリング","酵母","未熟香"],"title":"若ビール：主発酵後・熟成前のビール","questionText":"主発酵工程が終了し、貯酒タンクで熟成させる前のビールを何というか。次の選択肢より選べ。","choices":[{"key":"a","text":"若ビール"},{"key":"b","text":"青ビール"},{"key":"c","text":"無ろ過ビール"},{"key":"d","text":"素ビール"}],"answer":"a) 若ビール","answerKey":"a","explanationHtml":"<h3>なぜ正解か</h3>\n<p>主発酵（一次発酵）が終了したばかりのビールは、まだ味が粗く、硫黄臭や未熟な香り成分（ジアセチルなど）が残っている。熟成によって丸みのある味わいに仕上がる前の「未完成な状態」を指して<strong>若ビール（わかビール）</strong>と呼ぶ。「若い＝未熟・成長途中」という日本語の語感をそのまま当てた用語で、英語では \"green beer\" とも呼ばれる。</p>\n<h3>背景知識</h3>\n<h4>ビールの製造工程の流れ</h4>\n<pre><code>仕込み（糖化・ろ過）→ 煮沸・ホップ添加 → 冷却 → 主発酵 → [若ビール] → 貯酒（熟成） → ろ過 → 製品</code></pre>\n<h4>主発酵（一次発酵）</h4>\n<ul><li>酵母が麦汁中の糖をアルコールと CO₂ に分解する工程</li><li>ラガービールでは約 8〜15°C で 7〜10 日間程度かけて行われる</li><li>発酵が終わると酵母は沈降し、ビールの液面が落ち着く</li></ul>\n<h4>貯酒・熟成（ラガリング）</h4>\n<ul><li>若ビールを <strong>貯酒タンク（ラガータンク）</strong> に移して低温（0°C前後）で熟成させる工程</li><li>熟成の目的：</li></ul>  1. **ジアセチルの除去**：酵母が二酢酸様の不快な風味物質を再吸収する\n<p>  2. <strong>硫黄化合物の揮散</strong>：硫化水素などが自然に抜けていく</p>\n<p>  3. <strong>タンパク質・酵母の沈降</strong>：ビールの清澄化</p>\n<p>  4. <strong>炭酸ガスの溶解</strong>：炭酸が馴染み、口当たりが滑らかになる</p>\n<p>  5. <strong>香味成分の調和</strong>：各成分がバランスよく整う</p>\n<h4>熟成期間</h4>\n<ul><li>大量生産のラガーでは数週間〜1か月程度</li><li>クラフトビールや伝統的なラガーでは数か月以上かける場合もある</li><li>「ラガー」の語源はドイツ語の <strong>lagern（貯蔵する）</strong> に由来する</li></ul>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 若ビール</strong>: ✓ 正解。主発酵終了後・熟成前の未熟なビールの正式名称。</li><li><strong>b) 青ビール</strong>: 誤り。英語の \"green beer\"（若ビールの英語訳）を直訳したような語感だが、日本語の正式用語は「若ビール」。「青ビール」という工程上の専門用語は存在しない。</li><li><strong>c) 無ろ過ビール</strong>: 誤り。ろ過工程を経ていないビール（酵母や澱が残った状態）の総称。製造工程の位置が異なり、熟成後に該当する場合もある。クラフトビールや「白ビール（ヴァイツェン）」が代表例。</li><li><strong>d) 素ビール</strong>: 誤り。ビール業界の工程用語としては使われない造語。「素」は「加工前・添加前」のニュアンスを持つが、この文脈では不正確。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「若い＝未熟」</strong> のイメージで覚える。人間でも「若い」は「まだ成長途中」を意味するのと同じ。</li><li>英語の <strong>\"green beer\"</strong> は「若ビール」の直訳で、試験では英語との対応も意識すると理解が深まる。</li><li><strong>主発酵 → 若ビール → 貯酒（熟成） → ろ過 → 製品</strong> という工程の流れをセットで覚えておくと、関連問題にも対応しやすい。</li><li>ジアセチルは「バタースコッチ」のような風味を持つ欠陥臭として知られており、熟成で取り除かれることも関連知識として押さえておくと良い。</li></ul>"},{"id":"003","category":"歴史・文化","subcategory":"ビアカクテル","difficulty":"基礎","topic":"シャンディガフ","keywords":["シャンディガフ","ビアカクテル","ジンジャーエール","ビアスプリッツァー","ブラックベルベット","レッドアイ","1対1","混合比率"],"title":"シャンディガフ：ビールとジンジャーエールのビアカクテル","questionText":"ビールを使ったカクテルにはさまざまな種類がある。ビールとジンジャーエールを１対１の割合で混ぜてつくるビアカクテルを次の選択肢より選べ。","choices":[{"key":"a","text":"シャンディガフ"},{"key":"b","text":"ビアスプリッツァー"},{"key":"c","text":"ブラックベルベット"},{"key":"d","text":"レッドアイ"}],"answer":"a) シャンディガフ","answerKey":"a","explanationHtml":"<h3>なぜ正解か</h3>\n<p>シャンディガフ（Shandy Gaff）は、<strong>ビールとジンジャーエールを1対1で割ったビアカクテル</strong>。ビールの苦みがジンジャーエールの甘みと辛みで和らぎ、アルコール度数が下がるため飲みやすく、夏場や食前酒として人気がある。イギリス発祥とされ、\"shandy\" とも略される。</p>\n<h3>背景知識</h3>\n<h4>主なビアカクテル一覧</h4>\n<table><tr><th>カクテル名</th><th>材料A</th><th>材料B</th><th>比率</th></tr><tr><td><strong>シャンディガフ</strong></td><td>ビール</td><td>ジンジャーエール</td><td>1:1</td></tr><tr><td><strong>ビアスプリッツァー</strong></td><td>ビール</td><td>白ワイン</td><td>1:1</td></tr><tr><td><strong>ブラックベルベット</strong></td><td>黒ビール（スタウト）</td><td>スパークリングワイン（白）</td><td>1:1</td></tr><tr><td><strong>レッドアイ</strong></td><td>ビール</td><td>トマトジュース</td><td>1:1</td></tr></table>\n<h4>シャンディガフの特徴</h4>\n<ul><li><strong>起源</strong>：19世紀のイギリスで生まれたとされる。\"Gaff\" はイギリス俗語で「場所・店」を意味し、パブで親しまれてきた。</li><li><strong>特徴</strong>：アルコール度数が約半分になり、ジンジャーの風味が爽やかさを加える。</li><li><strong>バリエーション</strong>：ジンジャーエールの代わりにジンジャービア（発酵させた生姜飲料）を使う場合もある。ジンジャービア版は「シャンディ」と呼ばれることが多い。</li></ul>\n<h4>ビアスプリッツァー</h4>\n<ul><li><strong>材料</strong>：ビール＋白ワイン（1:1）</li><li>ワインのフルーティな酸味とビールの苦みが合わさった軽やかな味わい。\"Spritzer\" はドイツ語で「泡・はじける」の意。</li></ul>\n<h4>ブラックベルベット</h4>\n<ul><li><strong>材料</strong>：黒ビール（ギネスなどスタウト）＋スパークリングワイン（シャンパンなど白）（1:1）</li><li>1861年にイギリスのロンドン、ブルックス・クラブで<strong>アルバート公の死を悼んで</strong>作られたとされる格調あるカクテル。黒ビールの層とシャンパンの層が美しく分かれる見た目も特徴。</li></ul>\n<h4>レッドアイ</h4>\n<ul><li><strong>材料</strong>：ビール＋トマトジュース（1:1）</li><li>名前の由来は「二日酔いで充血した目（red eye）」。二日酔いの朝に飲まれる「迎え酒」としても知られる。リコピンが豊富なトマトジュースでビールを割るため、見た目が赤い。</li></ul>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) シャンディガフ</strong>: ✓ 正解。ビール＋ジンジャーエール（1:1）。イギリス発祥の定番ビアカクテル。</li><li><strong>b) ビアスプリッツァー</strong>: 誤り。ビール＋<strong>白ワイン</strong>（1:1）。ジンジャーエールではなくワインを使う。</li><li><strong>c) ブラックベルベット</strong>: 誤り。<strong>黒ビール</strong>＋<strong>スパークリングワイン（白）</strong>（1:1）。ビールの種類と混ぜる飲料が両方異なる。</li><li><strong>d) レッドアイ</strong>: 誤り。ビール＋<strong>トマトジュース</strong>（1:1）。ジンジャーエールではなく野菜ジュースを使う。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>混ぜるもので覚える頭文字</strong>：</li></ul>  - **シャ**ンディガフ → **ジ**ンジャーエール（「ジ」は清涼飲料）\n<p>  - <strong>ビ</strong>アスプリッツァー → <strong>ワ</strong>イン（「ビ」の仲間はワイン）</p>\n<p>  - <strong>ブ</strong>ラックベルベット → <strong>ス</strong>パークリングワイン＋<strong>黒</strong>ビール（黒い高級感）</p>\n<p>  - <strong>レ</strong>ッドアイ → <strong>ト</strong>マトジュース（「レッド＝赤＝トマト」）</p>\n<ul><li><strong>4つのカクテルはすべて1:1</strong>という点が試験頻出ポイント。比率は共通なので、<strong>何と何を混ぜるか</strong>を正確に覚えることが重要。</li></ul>\n<ul><li>ブラックベルベットは<strong>アルバート公の死（1861年）</strong>という歴史的背景を持つ唯一のカクテルで、歴史問題としても出題されることがある。</li></ul>"},{"id":"003","category":"歴史・文化","subcategory":"日本のビール史","difficulty":"発展","topic":"宝酒造と中びん","keywords":["宝酒造","中びん","500ml","昭和32年","1957年","業界初","日本ビール史"],"title":"日本初の中びん（500ml）ビールを発売したメーカー","questionText":"1957（昭和32）年、日本初の中びん（500ml）のビールを発売したメーカーを、次の選択肢より選べ。","choices":[{"key":"a","text":"アサヒビール"},{"key":"b","text":"オリオンビール"},{"key":"c","text":"キッコーマン"},{"key":"d","text":"宝酒造"}],"answer":"d) 宝酒造","answerKey":"d","explanationHtml":"<h3>なぜ正解か</h3>\n<p>宝酒造は1957（昭和32）年、当時のビール業界では存在しなかった<strong>中びん（500ml）</strong>サイズを日本で初めて発売した。大びんより25円安い<strong>100円</strong>という価格設定で、消費者の手の届きやすい選択肢として市場に投入した。宝酒造のビール事業は1957年から1967（昭和42）年の10年間に及んだ。</p>\n<h3>背景知識</h3>\n<h4>宝酒造のビール事業</h4>\n<p>宝酒造は焼酎・みりんで知られる酒類メーカーだが、1957〜1967年の10年間、ビール事業にも参入していた。中びんという新サイズの導入は、当時の大手4社（キリン・アサヒ・サッポロ・サントリー）とは異なる差別化戦略であった。結果的にビール事業からは撤退しているが、<strong>容量規格の先駆け</strong>という点で日本のビール史に名を残している。</p>\n<h4>当時のびんビール規格</h4>\n<p>戦後の日本では、主に<strong>大びん（633ml）</strong>が標準規格として流通していた。宝酒造が導入した中びん（500ml）は業界初のサイズであり、その後に広く普及する500ml缶・びんの原型ともいえる重要なイノベーションであった。</p>\n<h4>価格と市場戦略</h4>\n<p>大びんが125円前後で販売されていた時代に、中びんを<strong>100円</strong>という価格で投入。25円の差は当時の消費者にとって大きなメリットであり、小家族や一人飲みの需要を取り込もうとした戦略が読み取れる。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) アサヒビール</strong>: 明治時代から続く大手ビールメーカー。中びんの先駆けとは無関係。</li><li><strong>b) オリオンビール</strong>: 1957年に設立された沖縄のビールメーカー。設立年が一致するため紛らわしいが、中びん発売とは関係しない。</li><li><strong>c) キッコーマン</strong>: 醤油・食品メーカーであり、ビール事業への参入歴はない。選択肢の中で最も縁遠い誤答。</li><li><strong>d) 宝酒造</strong>: ✓ 正解。1957〜1967年にビール事業を展開し、業界初の中びん（500ml）を100円で発売。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「宝の中びん」</strong> → 宝酒造が業界初の中びん（500ml）を発売</li><li>年号は <strong>1957（昭和32）年</strong>、価格は <strong>100円</strong>（大びんより25円安）</li><li>オリオンビールも1957年設立なので混同注意。オリオンは「設立年」、宝酒造は「中びん発売年」として区別する</li><li>宝酒造のビール事業期間：<strong>1957〜1967年（10年間）</strong>で撤退している点も出題されやすい</li></ul>"},{"id":"004","category":"原材料","subcategory":"ホップ","difficulty":"基礎","topic":"ホップの名産地","keywords":["ホップ","ハラタウ","ザーツ","テトナング","ドイツ","チェコ","アロマホップ","産地"],"title":"ホップの世界的名産地：ハラタウ・ザーツ・テトナング","questionText":"「ハラタウ地方」「ザーツ地方」「テトナング地方」に共通するものは何か、適切なものを次の選択肢より選べ。","choices":[{"key":"a","text":"大麦の名産地"},{"key":"b","text":"ホップの名産地"},{"key":"c","text":"ヴァイツェンの銘醸地"},{"key":"d","text":"ビアグラスの名産地"}],"answer":"b) ホップの名産地","answerKey":"b","explanationHtml":"<h3>なぜ正解か</h3>\n<p>3つの地方はいずれもホップの世界的名産地として知られる。</p>\n<ul><li><strong>ハラタウ（Hallertau）</strong>: ドイツ南東部・バイエルン州。世界最大のホップ産地。</li><li><strong>テトナング（Tettnang）</strong>: ドイツ南西部・バーデン＝ヴュルテンベルク州。ボーデン湖畔の産地。</li><li><strong>ザーツ（Saaz / チェコ語：Žatec）</strong>: チェコ北西部・ボヘミア地方。チェコを代表するアロマホップの産地。</li></ul>\n<p>これらはいずれも大麦でも小麦でもなく、ホップ（Humulus lupulus）の栽培地として歴史的に著名な地域である。</p>\n<h3>背景知識</h3>\n<h4>ホップとは</h4>\n<p>ホップはアサ科の多年生つる植物の毬花（球果）を乾燥させたもので、ビール醸造において以下の役割を担う。</p>\n<ul><li><strong>苦味の付与</strong>: α酸（フムロン等）が熱で異性化してイソα酸となり苦味を生む</li><li><strong>香りの付与</strong>: β酸・精油成分がフローラル・シトラス・ハーブなどの香りを与える</li><li><strong>防腐・泡持ち向上</strong>: 抗菌作用があり、かつては保存料として重要だった</li></ul>\n<h4>三大産地の特徴</h4>\n<table><tr><th>産地</th><th>国</th><th>代表品種</th><th>特徴</th></tr><tr><td>ハラタウ</td><td>ドイツ（バイエルン）</td><td>ハラタウアー、ペルレ、マグナム</td><td>世界最大産地、穏やかな香り</td></tr><tr><td>テトナング</td><td>ドイツ（バーデン）</td><td>テトナンガー</td><td>繊細なフローラル・スパイシー香</td></tr><tr><td>ザーツ</td><td>チェコ（ボヘミア）</td><td>ザーツ（サーズ）</td><td>ピルスナーに欠かせない上品な香り</td></tr></table>\n<h4>ノーブルホップ（貴族ホップ）</h4>\n<p>ハラタウアー・テトナンガー・ザーツ・シュパルター（ドイツ）の4品種は「ノーブルホップ」と総称される。α酸含量が低く苦味は穏やかだが、香りが繊細で上品なことが特徴。伝統的なヨーロッパスタイルのラガーに多用される。</p>\n<h4>その他の主要産地</h4>\n<ul><li><strong>アメリカ・ワシントン州ヤキマバレー</strong>: 世界屈指の産地。シトラ・カスケード・センテニアルなど新世代品種が多い</li><li><strong>イギリス・ケント州</strong>: イングリッシュエールに使われるフグル・イーストケントゴールディングスの産地</li><li><strong>オーストラリア・ニュージーランド</strong>: ネルソンソーヴィン（NZ）など独自品種が発展</li></ul>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 大麦の名産地</strong>: 誤り。大麦の主要産地はドイツ・フランス・イギリス・オーストラリア・カナダ等だが、ハラタウ・ザーツ・テトナングは大麦の産地として特に知られていない。</li><li><strong>b) ホップの名産地</strong>: ✓ 正解。3地方ともホップの世界的産地として歴史的に著名。</li><li><strong>c) ヴァイツェンの銘醸地</strong>: 誤り。ヴァイツェン（小麦ビール）はバイエルン地方全体のスタイルであり、これらの産地概念とは異なる。ハラタウはバイエルン内にあるが「ヴァイツェンの銘醸地」とは呼ばれない。</li><li><strong>d) ビアグラスの名産地</strong>: 誤り。ビアグラスの産地としては特に知られていない。ガラス工芸で有名な地方（ボヘミアはガラスでも有名だが）とこれらのホップ産地は別の文脈。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「ハラテツザー」</strong>: <strong>ハラ</strong>タウ・<strong>テ</strong>トナング・<strong>ツ</strong>（ザー）ツ → 3大ホップ産地の頭文字</li><li><strong>国の対応</strong>: ハラタウとテトナングは<strong>ドイツ</strong>、ザーツは<strong>チェコ</strong>（旧ズデーテン地方のドイツ語名）</li><li><strong>ノーブルホップ4品種</strong>はこれら産地と紐づけて覚える：ハラタウアー（ハラタウ）、テトナンガー（テトナング）、ザーツ（ザーツ）、シュパルター（シュパルト）</li><li>ピルスナーウルケルのホップ香はザーツ産ホップによるもの。「ピルスナーといえばザーツ」</li></ul>"},{"id":"004","category":"醸造工程","subcategory":"ビール指標・用語","difficulty":"基礎","topic":"IBU・ABV","keywords":["IBU","ABV","苦味単位","アルコール度数","International Bitterness Units","Alcohol By Volume","容量パーセント"],"title":"ビールの指標：IBUとABVの意味","questionText":"「IBU」とは、ビールの苦味を示す数値であるが、「ABV」は何を示す数値か、次の選択肢より選べ。","choices":[{"key":"a","text":"アルコール度数"},{"key":"b","text":"アロマホップ使用比率"},{"key":"c","text":"麦芽使用比率"},{"key":"d","text":"平均麦汁濃度"}],"answer":"a) アルコール度数","answerKey":"a","explanationHtml":"<h3>なぜ正解か</h3>\n<p><strong>ABV</strong>は <strong>Alcohol By Volume</strong> の略称で、液体中のアルコール含有量を容量パーセント（vol%）で示す指標である。例えば「ABV 5%」は、100mlのビール中に5mlのアルコールが含まれることを意味する。ラベルや醸造記録に広く使われる国際的な標準表記であり、日本の「アルコール度数」と同義。</p>\n<h3>背景知識</h3>\n<h4>IBU（International Bitterness Units）</h4>\n<p>IBUは<strong>国際苦味単位</strong>で、ビールの苦みの強さを数値化したもの。ホップに含まれるアルファ酸が煮沸によってイソアルファ酸に変換される量をベースに算出される。</p>\n<table><tr><th>IBU目安</th><th>ビールの苦さの印象</th><th>代表スタイル</th></tr><tr><td>5〜15</td><td>ほぼ苦みなし</td><td>ウィート、ラガー系</td></tr><tr><td>20〜40</td><td>中程度の苦み</td><td>ペールエール、ピルスナー</td></tr><tr><td>40〜70</td><td>しっかりした苦み</td><td>IPA</td></tr><tr><td>70以上</td><td>強烈な苦み</td><td>ダブルIPA、インペリアルIPA</td></tr></table>\n<h4>ABV（Alcohol By Volume）</h4>\n<p>ABVはビールに限らず、ワイン・蒸留酒など全ての酒類に使われる世界標準の表記。日本の酒税法における「アルコール分」の定義（温度15℃における容量百分比）とほぼ同義である。</p>\n<p>一般的なビールのABV帯：</p>\n<ul><li><strong>ロービール・ノンアルコール</strong>: 0〜0.9%</li><li><strong>ライトビール</strong>: 3〜4%</li><li><strong>標準的なラガー</strong>: 4〜5%</li><li><strong>クラフト系エール・IPA</strong>: 5〜8%</li><li><strong>インペリアル系</strong>: 8%以上</li></ul>\n<h4>その他の主要な指標</h4>\n<ul><li><strong>OG（Original Gravity）</strong>: 発酵前の麦汁比重。糖分量の指標。</li><li><strong>FG（Final Gravity）</strong>: 発酵後の比重。残糖の多寡を示す。</li><li><strong>SRM / EBC</strong>: ビールの色の濃さを示す数値（SRMは米国基準、EBCは欧州基準）。</li></ul>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) アルコール度数</strong>: ✓ 正解。ABV＝Alcohol By Volume、容量パーセントでアルコール量を示す。</li><li><strong>b) アロマホップ使用比率</strong>: 誤り。「A」から始まるホップ関連と連想しやすいが、そのような指標は存在しない。</li><li><strong>c) 麦芽使用比率</strong>: 誤り。麦芽比率に関係する指標はなく、ABVとは無関係。</li><li><strong>d) 平均麦汁濃度</strong>: 誤り。麦汁濃度を示す指標はOG（原麦汁比重）などが該当し、ABVではない。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>IBU</strong> = <strong>I</strong>nternational <strong>B</strong>itterness <strong>U</strong>nits → 「苦さ」の国際単位</li><li><strong>ABV</strong> = <strong>A</strong>lcohol <strong>B</strong>y <strong>V</strong>olume → 「アルコール」の容量比</li><li>頭文字を英語で展開すると自然に意味がわかる：<strong>A</strong>lcohol（アルコール）、<strong>B</strong>y Volume（容量ごとに）</li><li>セットで問われることが多いため、<strong>IBU＝苦み・ABV＝アルコール度数</strong>の対応をセットで覚える</li></ul>"},{"id":"004","category":"歴史・文化","subcategory":"ビール祭り・グラス","difficulty":"基礎","topic":"オクトーバーフェスト・マース","keywords":["オクトーバーフェスト","マース","Maß","1Lジョッキ","シュタンゲ","ポカール","ラドラー","ケルシュ"],"title":"オクトーバーフェストのマース：1Lジョッキの呼び名","questionText":"世界最大のビール祭り「オクトーバーフェスト」で提供される１Lのジョッキの呼び名を次の選択肢より選べ。","choices":[{"key":"a","text":"シュタンゲ"},{"key":"b","text":"ポカール"},{"key":"c","text":"ラドラー"},{"key":"d","text":"マース"}],"answer":"d) マース","answerKey":"d","explanationHtml":"<h3>なぜ正解か</h3>\n<p>オクトーバーフェストで提供されるビールはすべて <strong>マース（Maß）</strong> と呼ばれる<strong>1Lの取っ手付きジョッキ</strong>で提供される。ドイツ語の \"Maß\" は「升・計量」を意味する単語で、歴史的に1Lを基準単位としたことに由来する。オクトーバーフェストでは1L未満での提供は認められておらず、このマースが祭りの象徴となっている。</p>\n<h3>背景知識</h3>\n<h4>オクトーバーフェスト</h4>\n<ul><li><strong>開催地</strong>：ドイツ・ミュンヘン（バイエルン州）のテレジエンヴィーゼ広場</li><li><strong>開催期間</strong>：毎年9月中旬〜10月第1日曜日（約2週間）</li><li><strong>起源</strong>：1810年、バイエルン王太子ルートヴィヒ（後のルートヴィヒ1世）とテレーゼ王女の結婚式を祝う馬術競技会が起源。翌年以降も毎年開催されるようになった。</li><li><strong>規模</strong>：年間来場者約600万人、消費ビール量約700万Lに及ぶ世界最大のビール祭り</li><li><strong>提供ビール</strong>：ミュンヘン市内の6大醸造所（ホフブロイ、レーベンブロイ、パウラーナー、アウグスティナー、シュパーテン、ハッカー・プショール）のみが出店を許可される</li></ul>\n<h4>マース（Maß）の特徴</h4>\n<ul><li><strong>容量</strong>：1L（ミリリットル）</li><li><strong>形状</strong>：厚手のガラス製、大きな取っ手付き</li><li><strong>重量</strong>：ビールを入れると約1.3〜1.5kg になる</li><li><strong>価格</strong>：2024年時点で1杯15ユーロ前後（年々値上がりしている）</li><li><strong>法規制</strong>：オクトーバーフェストでは1L単位での提供が義務づけられており、「ハルベ（0.5L）」での注文はできない</li></ul>\n<h4>ドイツのビールグラス・器の種類</h4>\n<table><tr><th>名称</th><th>特徴</th><th>主に使われるビール</th></tr><tr><td><strong>マース（Maß）</strong></td><td>1L取っ手付きジョッキ</td><td>オクトーバーフェストビール、ラガー全般</td></tr><tr><td><strong>シュタンゲ（Stange）</strong></td><td>細長い円筒形（200〜300mL）</td><td>ケルシュ（ケルン地方）、アルトビール</td></tr><tr><td><strong>ポカール（Pokal）</strong></td><td>取っ手なし、足付きゴブレット型</td><td>ピルスナー、ボック等</td></tr><tr><td><strong>ヴァイツェングラス</strong></td><td>上部が広がる縦長グラス（500mL）</td><td>ヴァイツェン（小麦ビール）</td></tr><tr><td><strong>クルーグ（Krug）</strong></td><td>陶器製ジョッキ</td><td>バイエルン伝統スタイル</td></tr></table>\n<h4>ラドラー（Radler）</h4>\n<ul><li>ビールをレモネード（またはスプライトなどの柑橘系炭酸飲料）で割ったビアカクテル</li><li>名前の由来はドイツ語の「Radfahrer（自転車乗り）」。1922年にミュンヘン郊外のサイクリスト向け酒場で、在庫不足のため薄めて提供したことが起源とされる</li><li>アルコール度数が低く（約2〜3%）、夏の定番ドリンク</li><li>前問のシャンディガフとほぼ同義だが、ラドラーはドイツ・オーストリア圏の呼称</li></ul>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) シュタンゲ</strong>: 誤り。ドイツ語で「棒・竿」を意味する<strong>細長い円筒形グラス</strong>（200〜300mL）。ケルン地方の<strong>ケルシュ</strong>専用グラスとして有名で、ウェイターが特製のトレー（Kranz＝花輪）に並べて運ぶ。</li><li><strong>b) ポカール</strong>: 誤り。<strong>取っ手がなく足のついたゴブレット型グラス</strong>。ワイングラスに似た形状で、ピルスナーやボックビールに使われることが多い。</li><li><strong>c) ラドラー</strong>: 誤り。これはグラスの名前ではなく、<strong>ビール＋レモネードのビアカクテル</strong>の名称。グラスと飲み物を混同させる引っかけ選択肢。</li><li><strong>d) マース</strong>: ✓ 正解。オクトーバーフェストで唯一使われる1L取っ手付きジョッキ。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>マース＝1L＝オクトーバーフェスト</strong>：この3つをセットで暗記する</li><li><strong>シュタンゲ＝細長い棒状＝ケルシュ</strong>：「シュタンゲ（Stange）＝棒」の意味からグラスの形を連想する</li><li><strong>ラドラーはカクテル名</strong>：グラス名と飲み物名の混同に注意。ラドラー（自転車乗り）＝ビール＋レモネードで覚える</li><li><strong>ポカール＝取っ手なし足あり</strong>：「ポカール（Pokal）」は英語の \"cup\" に相当するトロフィー型グラスをイメージする</li><li>試験では「マース＝何L？」という容量を問う問題も出やすいため、<strong>1L</strong> という数字を確実に覚えておく</li></ul>"},{"id":"005","category":"原材料","subcategory":"麦芽・大麦","difficulty":"応用","topic":"二条大麦と六条大麦","keywords":["二条大麦","六条大麦","プラネット","製麦","浸麦","糊粉層","胚乳","穀皮"],"title":"二条大麦と六条大麦：特徴と製麦の基礎知識","questionText":"ビール原料に使用される大麦に関する記述のうち、誤っているものを次の選択肢より選べ。","choices":[{"key":"a","text":"プラネットはヨーロッパ以外にオーストラリアでも代表的な品種である"},{"key":"b","text":"一般的に二条大麦は六条大麦に比べ、穀粒が小粒で穀皮が厚い傾向がある"},{"key":"c","text":"製麦工程での浸麦終了時点の大麦の水分含量は40〜45％である"},{"key":"d","text":"糊粉層は胚乳の一部であり、酵素の合成・分泌や発芽に必要なホルモンの伝達に関与する"}],"answer":"b) 一般的に二条大麦は六条大麦に比べ、穀粒が小粒で穀皮が厚い傾向がある","answerKey":"b","explanationHtml":"<h3>なぜ正解か</h3>\n<p>選択肢 b) は<strong>逆の記述</strong>であるため誤り。正しくは、<strong>二条大麦は六条大麦に比べて穀粒が大きく、穀皮が薄い</strong>傾向がある。</p>\n<ul><li>二条大麦：穀粒が<strong>大きい</strong>・穀皮が<strong>薄い</strong>・デンプン含量が<strong>多い</strong> → ビール醸造に最適</li><li>六条大麦：穀粒が<strong>小さい</strong>・穀皮が<strong>厚い</strong>・タンパク質・酵素力が<strong>高い</strong></li></ul>\n<p>穀皮が厚いと麦汁の苦み・渋みに影響するため、ビール醸造では穀皮の薄い二条大麦が世界的な主流となっている。</p>\n<h3>背景知識</h3>\n<h4>二条大麦と六条大麦の違い</h4>\n<p>「条数」とは、穂の列数を指す。穂軸の1節から伸びる小穂が2列のものが二条、6列のものが六条。</p>\n<table><tr><th>比較項目</th><th>二条大麦</th><th>六条大麦</th></tr><tr><td>穀粒の大きさ</td><td>大きい（均一）</td><td>小さい（不均一になりやすい）</td></tr><tr><td>穀皮の厚さ</td><td>薄い</td><td>厚い</td></tr><tr><td>デンプン含量</td><td>多い</td><td>少ない</td></tr><tr><td>タンパク質含量</td><td>少ない</td><td>多い</td></tr><tr><td>酵素力</td><td>低め</td><td>高い</td></tr><tr><td>ビール醸造への適性</td><td>高い（現在の主流）</td><td>やや低い（補助原料使用時に有利）</td></tr><tr><td>主な産地</td><td>ヨーロッパ、オーストラリア、北米</td><td>日本、北米の一部</td></tr></table>\n<p>&gt; 日本では古くから六条大麦が栽培されてきたが、ビール醸造向けには二条大麦を輸入・国産化している。</p>\n<h4>代表的な二条大麦品種</h4>\n<ul><li><strong>プラネット（Planet）</strong>：ヨーロッパ（特にドイツ・チェコ）とオーストラリアで広く栽培される醸造用品種。均一な粒揃いと高いエキス収量が特徴。</li><li><strong>スカーレット（Scarlett）</strong>：ヨーロッパ産の代表品種。安定した品質で世界的に使用される。</li><li><strong>ゴールデンプロミス（Golden Promise）</strong>：スコットランドの伝統品種。シングルモルトウイスキーや一部クラフトビールに使用される。</li><li><strong>はるな二条</strong>：日本国内で開発された醸造用二条大麦品種。</li></ul>\n<h4>製麦工程と浸麦（ちんばく）</h4>\n<p>製麦（モルティング）は大麦を麦芽（モルト）に加工する工程。主な流れは以下の通り。</p>\n<pre><code>大麦 → 浸麦（水分を吸わせる） → 発芽（根・葉芽を出させる） → 焙燥（乾燥・焙煎） → 麦芽</code></pre>\n<p><strong>浸麦（steeping）</strong>：</p>\n<ul><li>大麦を水に浸して水分を吸収させる工程</li><li>目的：発芽に必要な水分と酸素を供給する</li><li>浸麦開始時の大麦の水分含量：約<strong>12〜15%</strong></li><li><strong>浸麦終了時の水分含量：約40〜45%</strong>（選択肢 c の記述は正しい）</li><li>水浸け（浸水）と水切り（空気休止）を繰り返しながら水分を均一に吸収させる</li><li>所要時間：約40〜50時間</li></ul>\n<h4>大麦の構造と糊粉層（アリューロン層）</h4>\n<p>大麦粒は以下の主要部分から構成される。</p>\n<pre><code>[果皮・種皮（穀皮）] → 外層\n<p>[糊粉層（アリューロン層）] → 胚乳の最外層</p>\n<p>[デンプン胚乳（内乳）] → 主にデンプンを含む</p>\n<p>[胚（はい）] → 発芽の起点&lt;/code&gt;&lt;/pre&gt;</p>\n<p><strong>糊粉層（アリューロン層）</strong>：</p>\n<ul><li><strong>胚乳の一部</strong>（最外層）であり、選択肢 d の記述は正しい</li><li>発芽時に胚から分泌されるジベレリン（植物ホルモン）を受け取り、<strong>アミラーゼ・プロテアーゼなどの酵素を合成・分泌</strong>する</li><li>この酵素群がデンプン胚乳のデンプンやタンパク質を分解し、発酵に使える糖やアミノ酸を生成する（糖化の準備）</li></ul>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) プラネットはヨーロッパ以外にオーストラリアでも代表的な品種である</strong>: 正しい記述。プラネットはヨーロッパとオーストラリア両方で広く栽培される主要醸造用品種。</li><li><strong>b) 一般的に二条大麦は六条大麦に比べ、穀粒が小粒で穀皮が厚い傾向がある</strong>: ✓ <strong>誤り（正解）</strong>。実際は逆で、二条大麦は穀粒が<strong>大きく</strong>、穀皮が<strong>薄い</strong>。</li><li><strong>c) 製麦工程での浸麦終了時点の大麦の水分含量は40〜45％である</strong>: 正しい記述。浸麦終了時の水分目標値は40〜45%で、これにより均一な発芽が促される。</li><li><strong>d) 糊粉層は胚乳の一部であり、酵素の合成・分泌や発芽に必要なホルモンの伝達に関与する</strong>: 正しい記述。糊粉層は胚乳最外層として、ジベレリンによるシグナルを受けて酵素を産生・分泌する重要な組織。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>二条＝大きい・薄い・ビール向き</strong>：「二条大麦はビール醸造の主役」と覚え、そこから「大粒・薄皮」を連想する</li><li><strong>六条＝小さい・厚い・酵素力高い</strong>：六条はタンパク質・酵素が豊富だが穀皮が厚くビールの品質に影響しやすい</li><li><strong>浸麦終了＝40〜45%</strong>：「浸麦で四十（40）五（5）分の水分」とリズムで覚える（ちなみに開始時は約12〜15%）</li><li><strong>糊粉層の役割</strong>：「ホルモン受容→酵素分泌」という2段階の連鎖を押さえる。ジベレリン→糊粉層→アミラーゼ産生の流れ</li><li>「誤っているものを選べ」型は、<strong>正しそうに見えるが逆になっている記述</strong>が狙われやすい。数値・方向性（大小・高低・厚薄）に特に注意する</li></ul>"},{"id":"005","category":"ブランド・銘柄","subcategory":"アメリカクラフトビール","difficulty":"応用","topic":"ボストン・ビールとサミュエル・アダムス","keywords":["ボストン・ビール","サミュエル・アダムス","ジム・コック","クラフトビール","アメリカ","マイクロブルワリー","クラフトビール運動"],"title":"ボストン・ビール社とアメリカクラフトビール運動の象徴「サミュエル・アダムス」","questionText":"1984年にジム・コックが創業し、アメリカのクラフトビール文化を象徴する存在となったビール会社として正しいものを、次の選択肢より選べ。","choices":[{"key":"a","text":"ABインベブ"},{"key":"b","text":"アンカー・ブリューイング"},{"key":"c","text":"ストーン・ブリューイング"},{"key":"d","text":"ボストン・ビール"}],"answer":"d) ボストン・ビール","answerKey":"d","explanationHtml":"<h3>なぜ正解か</h3>\n<p>ボストン・ビール社（The Boston Beer Company）は1984年にジム・コック（Jim Koch）がマサチューセッツ州ボストンで創業した。同社の主力ブランド「サミュエル・アダムス（Samuel Adams）」はアメリカ建国の父の一人であるサミュエル・アダムズに由来し、手作りの風味と個性を打ち出した。大量生産型ビールが市場を席巻していた当時に全国流通を実現し、クラフトビールが商業的に成立することを証明。同社は一時、アメリカ最大のクラフトブルワリーとなった。</p>\n<h3>背景知識</h3>\n<h4>アメリカのクラフトビール運動の流れ</h4>\n<p>1970〜80年代のアメリカでは、バドワイザー・ミラー・クアーズなど大手3社が市場の大半を占める寡占状態だった。1965年の禁酒法廃止後も地ビール文化は根付かず、薄くて飲みやすいライトラガーが主流だった。</p>\n<p>この状況に変化をもたらしたのが以下の出来事：</p>\n<ul><li><strong>1965年</strong>: アンカー・ブリューイングがフリッツ・メイタグに買収され復活</li><li><strong>1977年</strong>: 自家醸造（ホームブルーイング）の合法化（連邦法）</li><li><strong>1984年</strong>: ボストン・ビール社設立・サミュエル・アダムス発売</li><li><strong>1990年代〜</strong>: マイクロブルワリーが全米で急増</li></ul>\n<h4>ボストン・ビール社の特徴</h4>\n<ul><li><strong>創業者</strong>: ジム・コック（ハーバード大MBA・JD取得者、元コンサルタント）</li><li><strong>創業年</strong>: 1984年</li><li><strong>本社</strong>: マサチューセッツ州ボストン</li><li><strong>主力製品</strong>: サミュエル・アダムス ボストン・ラガー</li><li><strong>上場</strong>: 1995年にNYSE上場（ティッカー：SAM）</li></ul>\n<h4>サミュエル・アダムス（ブランド）</h4>\n<p>サミュエル・アダムズ（1722〜1803）はボストン出身の政治家・独立運動家で、醸造業者の家系にも連なる人物。ブランド名には「アメリカの伝統と自由への意志」が込められている。代表的な製品はボストン・ラガー（ビエナ・ラガースタイル）。</p>\n<h4>各選択肢の会社について</h4>\n<table><tr><th>会社名</th><th>国</th><th>特徴</th></tr><tr><td>ABインベブ</td><td>ベルギー（多国籍）</td><td>バドワイザー・コロナ等を持つ世界最大のビール会社</td></tr><tr><td>アンカー・ブリューイング</td><td>アメリカ（サンフランシスコ）</td><td>1896年創業、アメリカのクラフトビール復興の先駆け</td></tr><tr><td>ストーン・ブリューイング</td><td>アメリカ（カリフォルニア）</td><td>1996年創業、大胆なホップを使ったIPAで有名</td></tr><tr><td>ボストン・ビール</td><td>アメリカ（ボストン）</td><td>1984年創業、サミュエル・アダムスで有名</td></tr></table>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) ABインベブ</strong>: 誤り。ABインベブ（Anheuser-Busch InBev）はバドワイザーを擁するアメリカ最大の大手ビールメーカー・アンハイザー・ブッシュとベルギーのインベブが2008年に合併した多国籍企業。クラフトビールとは対極の大量生産型。</li><li><strong>b) アンカー・ブリューイング</strong>: 誤り。アンカーはクラフトビール復興の先駆けだが、創業は1896年（再生は1965年）。ジム・コックの会社ではなく、設立年も異なる。</li><li><strong>c) ストーン・ブリューイング</strong>: 誤り。ストーン・ブリューイングはグレッグ・コックとスティーブ・ワグナーが1996年にカリフォルニア州で創業。ジム・コックとは別人であり、創業年も異なる。</li><li><strong>d) ボストン・ビール</strong>: ✓ 正解。1984年にジム・コックが創業、サミュエル・アダムスを世に広めたアメリカクラフトビールの象徴的企業。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「1984年 + ジム・コック = ボストン・ビール = サミュエル・アダムス」</strong> をセットで覚える</li><li>ストーン・ブリューイングの共同創業者も「コック（Koch）」姓だが、<strong>グレッグ・コック</strong>（1996年創業）。ジム・コックとは別人。試験では混同に注意</li><li>アンカー・ブリューイングは「先駆け」、ボストン・ビールは「全国普及の象徴」と役割で区別する</li><li>サミュエル・アダムスのラベルの人物はアメリカ建国の父・サミュエル・アダムズ（政治家）</li><li>ボストン・ビールは後に「トゥルーリー」（ハードセルツァー）でも有名になる</li></ul>"},{"id":"005","category":"歴史・文化","subcategory":"日本のビール史","difficulty":"発展","topic":"福沢諭吉とビール","keywords":["福沢諭吉","片山淳之助","西洋衣食住","胸膈を開く","幕末・明治","ビール紹介","洋学者"],"title":"「其味至て苦けれど胸膈を開く」──福沢諭吉とビールの名言","questionText":"ビールについて「其味至て苦けれど胸膈を開く為に妙なり」という言葉を残した偉人を次の選択肢より選べ。","choices":[{"key":"a","text":"緒方 洪庵"},{"key":"b","text":"川本 幸民"},{"key":"c","text":"中江 兆民"},{"key":"d","text":"福沢 諭吉"}],"answer":"d) 福沢 諭吉","answerKey":"d","explanationHtml":"<h3>なぜ正解か</h3>\n<p>福沢諭吉は<strong>片山淳之助</strong>という別名義で著した『<strong>西洋衣食住</strong>』（1867年）の中でビールを紹介し、「其味至て苦けれど胸膈を開く為に妙なり」と記した。意味は「その味は非常に苦いが、腹を割って話す（打ち解ける）ために絶妙である」。苦みを正直に認めつつも、ビールのコミュニケーション効果を的確に表現した言葉として知られる。</p>\n<h3>背景知識</h3>\n<h4>福沢諭吉と西洋文化の紹介</h4>\n<p>福沢諭吉（1835〜1901）は慶應義塾の創設者・啓蒙思想家として名高いが、幕末期には<strong>片山淳之助</strong>という筆名で西洋の生活文化を紹介する著作を多数刊行した。『西洋衣食住』（1867年）はその代表作の一つで、衣・食・住にわたる西洋の習慣を日本人向けにわかりやすく解説した書物である。</p>\n<h4>「胸膈を開く」の意味</h4>\n<p>「胸膈（きょうかく）」とは胸と横隔膜の間を指す言葉で、転じて<strong>心の内側・本音</strong>を意味する。「胸膈を開く」＝腹を割って話す・打ち解ける・友人になる、という意。苦みというハードルを越えた先に社交的な効用がある、というビールの本質を見事に言い表している。</p>\n<h4>幕末・明治期の洋学者とビール</h4>\n<table><tr><th>人物</th><th>ビールとの関係</th></tr><tr><td>福沢諭吉</td><td>『西洋衣食住』でビールを「胸膈を開く」と紹介</td></tr><tr><td>川本幸民</td><td>1853年頃に日本で初めてビールを醸造した蘭学者</td></tr><tr><td>緒方洪庵</td><td>天然痘ワクチン普及などで知られる蘭学者・医師</td></tr><tr><td>中江兆民</td><td>フランス思想を紹介した自由民権運動の思想家</td></tr></table>\n<h4>日本のビール史における位置づけ</h4>\n<p>1853年の川本幸民による試醸から、1869年の横浜でのビール醸造所設立、1877年の札幌麦酒醸造所（現サッポロビール）設立へと続く流れの中で、福沢諭吉の著作はビールを<strong>文化・習慣として日本人に広める</strong>役割を担った。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 緒方洪庵</strong>: 江戸末期の蘭学者・医師。天然痘ワクチン接種の普及に貢献した人物で、ビール関連の記述は特に知られていない。</li><li><strong>b) 川本幸民</strong>: 蘭学者で、1853年頃に日本で初めてビールを醸造したとされる人物。ビールと深く関わるが、この名言とは無関係。混同しやすいため要注意。</li><li><strong>c) 中江兆民</strong>: ルソーの思想を日本に紹介した「東洋のルソー」と称される自由民権運動の思想家。ビール関連の著述は特に知られていない。</li><li><strong>d) 福沢諭吉</strong>: ✓ 正解。別名・片山淳之助として著した『西洋衣食住』（1867年）でビールを紹介し、この名言を残した。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「苦いけど心を開く」＝福沢諭吉</strong>：一万円札の人物が日本にビール文化を紹介したと覚える</li><li>著書名：<strong>『西洋衣食住』</strong>、筆名：<strong>片山淳之助</strong>（福沢諭吉の別名義）</li><li><strong>川本幸民</strong>（初醸造）と<strong>福沢諭吉</strong>（文化紹介）は混同しやすいのでセットで整理する</li></ul>  - 川本幸民 → **作った人**（1853年、日本初醸造）\n<p>  - 福沢諭吉 → <strong>広めた人</strong>（1867年、著作でビール紹介）</p>"},{"id":"006","category":"法規制","subcategory":"アルコールと健康","difficulty":"応用","topic":"アルコールと健康・男女差","keywords":["新久里浜式スクリーニングテスト","健康日本21","適正飲酒の10か条","体内水分量","血中アルコール濃度","男女差","多量飲酒","肝臓"],"title":"アルコールと健康：男女差と飲酒ガイドライン","questionText":"「アルコールと健康」に関する記述のうち、誤っているものを選べ。","choices":[{"key":"a","text":"新久里浜式アルコール症スクリーニングテストは男女別に作成されている"},{"key":"b","text":"「健康日本21（第三次）」では多量飲酒者の減少が目標とされている"},{"key":"c","text":"「適正飲酒の10か条」では定期検査の対象として肝臓が示されている"},{"key":"d","text":"一般的に女性の方が男性より体内の水分量が多く、血中アルコール濃度が上昇しやすい"}],"answer":"d) 一般的に女性の方が男性より体内の水分量が多く、血中アルコール濃度が上昇しやすい","answerKey":"d","explanationHtml":"<h3>なぜ正解か</h3>\n<p>選択肢 d) の前半「女性の方が男性より体内の水分量が多い」が<strong>誤り</strong>。正しくは逆で、<strong>女性は男性より体内の水分量が少ない</strong>。</p>\n<ul><li>男性の体内水分量：体重の約<strong>60%</strong></li><li>女性の体内水分量：体重の約<strong>55%</strong>（脂肪組織の割合が高いため水分割合が低い）</li></ul>\n<p>水分量が少ないと、同じ量のアルコールを摂取しても血液中に溶け込む水分が少ないため<strong>血中アルコール濃度が高くなる</strong>。そのため女性はアルコールの影響を受けやすく、同じ量を飲んでも酔いやすい。後半の「血中アルコール濃度が上昇しやすい」は正しいが、その理由として「水分量が多い」と書かれている点が誤り。</p>\n<h3>背景知識</h3>\n<h4>女性がアルコールの影響を受けやすい理由</h4>\n<p>1. <strong>体内水分量が少ない</strong>：脂肪組織はアルコールをほとんど含まないため、女性は相対的な水分量が少なく、血中アルコール濃度が高くなりやすい</p>\n<p>2. <strong>アルコール脱水素酵素（ADH）の活性が低い</strong>：胃粘膜での初回通過代謝が男性より低く、より多くのアルコールが血中に吸収される</p>\n<p>3. <strong>体重が少ない傾向がある</strong>：体重あたりのアルコール量が同じ飲酒量でも多くなる</p>\n<p>4. <strong>女性ホルモンの影響</strong>：エストロゲンがアルコール代謝に影響し、月経周期によっても酔いやすさが変化する</p>\n<p>これらの理由から、女性の「節度ある適度な飲酒」の目安は男性より少なく設定されている。</p>\n<h4>体内水分量と血中アルコール濃度の計算</h4>\n<p>血中アルコール濃度（BAC）は以下で概算できる：</p>\n<pre><code>BAC（%）≈ アルコール摂取量（g）÷（体重（kg）× 体内水分割合 × 1000）× 100</code></pre>\n<p>例：60kgの男性（水分60%）と55kgの女性（水分55%）がビール500mL（アルコール約20g）を飲んだ場合：</p>\n<ul><li>男性：20 ÷（60 × 0.60 × 1000）× 100 ≈ 0.056%</li><li>女性：20 ÷（55 × 0.55 × 1000）× 100 ≈ 0.066%</li></ul>\n<p>同じ量でも女性の方が高い血中アルコール濃度になることがわかる。</p>\n<h4>新久里浜式アルコール症スクリーニングテスト（KAST）</h4>\n<ul><li><strong>久里浜医療センター</strong>（独立行政法人国立病院機構）が開発したスクリーニングツール</li><li>アルコール依存症や問題飲酒のリスクを自己評価するための質問票</li><li><strong>男性版（KAST-M）と女性版（KAST-F）が別々に作成</strong>されており、それぞれ異なる項目・カットオフ値を持つ（選択肢 a は正しい）</li><li>飲酒量・飲酒行動・身体症状などに関する複数の質問から構成される</li></ul>\n<h4>健康日本21（第三次）とアルコール目標</h4>\n<ul><li>厚生労働省が策定する国民健康増進計画（2024〜2035年度）</li><li>アルコール関連の目標として以下を設定：</li></ul>  - **生活習慣病のリスクを高める量を飲酒している者の減少**\n<p>  - <strong>多量飲酒者（1日平均60g超）の減少</strong>（選択肢 b は正しい）</p>\n<p>  - 飲酒習慣のない者（機会飲酒含む）の増加</p>\n<p>&gt; 純アルコール量の目安：「節度ある適度な飲酒」は1日平均<strong>20g程度</strong>。ビール（5%）換算で約500mL（中瓶1本）。女性や高齢者はその半量が目安とされることが多い。</p>\n<h4>適正飲酒の10か条</h4>\n<p>公益社団法人アルコール健康医学協会が提唱。10番目の条項として「定期的に健康診断を」が含まれ、特に<strong>肝臓の状態を確認する検査</strong>（γ-GTP、AST、ALT等）が推奨されている（選択肢 c は正しい）。</p>\n<p>主な条項の内容：</p>\n<p>1. 談笑しながら楽しく飲む</p>\n<p>2. 食べながら飲む</p>\n<p>3. 自分のペースでゆっくりと</p>\n<p>4. 強い酒は薄めて飲む</p>\n<p>5. 週1〜2日は休肝日を</p>\n<p>6. 薬飲用時は禁酒する</p>\n<p>7. 妊娠中・授乳中は禁酒</p>\n<p>8. 飲酒後の運動・入浴は控える</p>\n<p>9. 人に酒を強要しない</p>\n<p>10. 定期的に健康診断を（<strong>肝臓を含む</strong>）</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 新久里浜式アルコール症スクリーニングテストは男女別に作成されている</strong>: 正しい記述。KAST-M（男性版）とKAST-F（女性版）が別に存在する。</li><li><strong>b) 「健康日本21（第三次）」では多量飲酒者の減少が目標とされている</strong>: 正しい記述。多量飲酒者の減少は健康日本21（第三次）の明示的な目標の一つ。</li><li><strong>c) 「適正飲酒の10か条」では定期検査の対象として肝臓が示されている</strong>: 正しい記述。第10条で定期健康診断（肝臓を含む）の受診が推奨されている。</li><li><strong>d) 一般的に女性の方が男性より体内の水分量が多く、血中アルコール濃度が上昇しやすい</strong>: ✓ <strong>誤り（正解）</strong>。女性は体内水分量が<strong>少ない</strong>ため血中アルコール濃度が上昇しやすい。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>女性の水分量は「少ない」</strong>：女性は脂肪が多く水分割合が低い（男性60%・女性55%）→ 酔いやすい</li><li><strong>KASTは男女別</strong>：「男女で飲酒パターンが違うから別々のテスト」と理解すると覚えやすい</li><li><strong>「誤り」の典型パターン</strong>：正しい結論（血中アルコール濃度が上昇しやすい）に、<strong>誤った理由</strong>（水分量が多い）を組み合わせた選択肢。結論だけ見ると正しそうに見えるため注意</li><li><strong>純アルコール20gの目安</strong>：ビール500mL、日本酒1合、ワイン200mL、焼酎（25度）100mL がおよそ20g相当</li><li>試験では「男女の体内水分量の大小」と「それが血中アルコール濃度に与える影響の方向」の両方が問われるため、論理の流れをセットで覚える</li></ul>"},{"id":"006","category":"ビアスタイル","subcategory":"エール","difficulty":"応用","topic":"イングリッシュブラウンエール","keywords":["イングリッシュブラウンエール","ペールエール","スタウト","モルト","ナッツ風味","ホップ","ブレタノマイセス"],"title":"イングリッシュブラウンエールの特徴","questionText":"次のうち、イングリッシュブラウンエールの特徴として適切なものを選べ。","choices":[{"key":"a","text":"ペールエールよりホップの苦味が強い"},{"key":"b","text":"焙煎香が非常に強くスタウトに近い"},{"key":"c","text":"ペールエールよりホップの苦味や香りが穏やかである"},{"key":"d","text":"酸味が強くブレット香が特徴である"}],"answer":"c) ペールエールよりホップの苦味や香りが穏やかである","answerKey":"c","explanationHtml":"<h3>なぜ正解か</h3>\n<p>イングリッシュブラウンエールは<strong>モルト主体</strong>のビアスタイルで、ホップの苦味・香りはペールエールより抑えられている。モルト由来の甘味・ナッツ・キャラメルのような風味が前面に出るのが最大の特徴。スタウトほど強い焙煎香はなく、全体としてバランスが取れた穏やかな飲み口が持ち味である。</p>\n<h3>背景知識</h3>\n<h4>イングリッシュブラウンエールとは</h4>\n<p>イギリス発祥のエールスタイルで、ローストした麦芽（クリスタルモルト・チョコレートモルトなど）を使用することで茶褐色（ブラウン）の色調と風味を生む。代表銘柄にはイギリスの <strong>Newcastle Brown Ale</strong>（ニューカッスル・ブラウンエール）がある。</p>\n<p>主な特徴：</p>\n<ul><li><strong>色</strong>: 濃い琥珀色〜茶褐色（SRM 12〜22程度）</li><li><strong>ABV</strong>: 4〜6%程度</li><li><strong>IBU</strong>: 20〜30程度（ペールエールより低め）</li><li><strong>風味</strong>: ナッツ、キャラメル、トースト、わずかなチョコレート</li><li><strong>口当たり</strong>: 柔らかく穏やか、後味にほのかな甘さ</li></ul>\n<h4>エールスタイルの苦味・焙煎強度の比較</h4>\n<table><tr><th>スタイル</th><th>ホップ苦味</th><th>焙煎香</th><th>特徴</th></tr><tr><td>ペールエール</td><td>中〜強</td><td>弱</td><td>ホップ香が前面</td></tr><tr><td><strong>イングリッシュブラウンエール</strong></td><td><strong>弱〜中</strong></td><td><strong>中程度</strong></td><td><strong>モルト・ナッツが主役</strong></td></tr><tr><td>スタウト</td><td>中</td><td>非常に強</td><td>ローストコーヒー・チョコレート</td></tr><tr><td>IPA</td><td>非常に強</td><td>弱</td><td>強烈なホップ苦味・香り</td></tr></table>\n<h4>ノーザン vs サザン：二つのブラウンエール</h4>\n<table><tr><th>タイプ</th><th>代表地域</th><th>特徴</th></tr><tr><td>サザン（南部）ブラウンエール</td><td>ロンドン周辺</td><td>やや甘め、低ABV（3〜4%）、軽い</td></tr><tr><td>ノーザン（北部）ブラウンエール</td><td>ニューカッスル周辺</td><td>やや辛口、中ABV（4〜5.5%）、すっきり</td></tr></table>\n<h4>ブレタノマイセス（ブレット）とは</h4>\n<p>選択肢dの「ブレット香」は<strong>ブレタノマイセス</strong>（Brett）という野生酵母に由来する香り。馬小屋・革・ファンキーと表現される独特の風味で、ランビックやサワーエールで見られる。イングリッシュブラウンエールとは全く異なる方向性のスタイルである。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) ペールエールよりホップの苦味が強い</strong>: 誤り。ブラウンエールはペールエールよりモルト主体でホップは穏やか。逆の説明である。</li><li><strong>b) 焙煎香が非常に強くスタウトに近い</strong>: 誤り。焙煎モルトは使うが「非常に強い」レベルではない。スタウトはローストバーレイなどで強烈な焙煎香を持ち、ブラウンエールとは別カテゴリ。</li><li><strong>c) ペールエールよりホップの苦味や香りが穏やかである</strong>: ✓ 正解。モルト主体でホップを抑えた穏やかな飲み口がブラウンエールの本質。</li><li><strong>d) 酸味が強くブレット香が特徴である</strong>: 誤り。これはサワーエールやランビック系の特徴。ブレタノマイセス由来の酸味・ファンキー香はブラウンエールとは無関係。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>ブラウンエール＝モルトの茶色、ホップ控えめ</strong>：色と味のイメージを一致させて覚える</li><li>ペールエール（ホップ主役）の<strong>対極</strong>がブラウンエール（モルト主役）と整理する</li><li>スタウトとの違い：焙煎の強度。スタウトは「黒くてコーヒーのよう」、ブラウンエールは「茶色くてナッツのよう」</li><li>ブレット香は<strong>サワー系</strong>の目印ワード。ブラウンエールとセットで出たら誤答と判断できる</li></ul>"},{"id":"006","category":"歴史・文化","subcategory":"日本ビール史","difficulty":"発展","topic":"明治時代のビール産業","keywords":["札幌麦酒醸造場","大倉喜八郎","渋沢栄一","ジャパン・ブルワリー・カンパニー","生田秀","内国勧業博覧会","明治ビール史","官営払下げ"],"title":"明治時代のビール史：札幌麦酒醸造場払下げと関係人物","questionText":"明治時代のビールに関する出来事のうち、誤っているものを選べ。","choices":[{"key":"a","text":"香港法人ジャパン・ブルワリー・カンパニーには明治期の増資で渋沢栄一が株主として加わった"},{"key":"b","text":"開拓使廃止後、1886年に北海道庁から札幌麦酒醸造場の払下げを受けたのが渋沢栄一であった"},{"key":"c","text":"生田秀の醸造所では近代ビールの三大発明が採用された"},{"key":"d","text":"桜田ビールと浅田ビールはイギリス流エールで内国勧業博覧会に入賞した"}],"answer":"b) 開拓使廃止後、1886年に北海道庁から札幌麦酒醸造場の払下げを受けたのが渋沢栄一であった","answerKey":"b","explanationHtml":"<h3>なぜ正解か（なぜbが誤りか）</h3>\n<p>1886年（明治19年）に北海道庁から札幌麦酒醸造場の払下げを受けたのは<strong>大倉喜八郎</strong>であり、渋沢栄一ではない。渋沢栄一が関与するのはその翌年（1887年）で、大倉喜八郎らとともに<strong>札幌麦酒会社</strong>を設立する段階においてである。「払下げを受けた人物」と「その後の会社設立に加わった人物」を混同しないことがポイント。</p>\n<h3>背景知識</h3>\n<h4>札幌麦酒醸造場の官営から民営への変遷</h4>\n<table><tr><th>年</th><th>出来事</th></tr><tr><td>1876年</td><td>開拓使が札幌に「開拓使麦酒醸造所」設立（村橋久成・中川清兵衛らが設立）</td></tr><tr><td>1882年</td><td>開拓使廃止</td></tr><tr><td>1886年</td><td>北海道庁から<strong>大倉喜八郎</strong>へ払下げ（民営化）</td></tr><tr><td>1887年</td><td>大倉喜八郎・<strong>渋沢栄一</strong>らが出資し「<strong>札幌麦酒会社</strong>」設立</td></tr><tr><td>1906年</td><td>大日本麦酒（日本麦酒・大阪麦酒・札幌麦酒の三社合併）に統合</td></tr></table>\n<h4>大倉喜八郎とは</h4>\n<p>大倉喜八郎（1837〜1928）は明治期を代表する実業家。大倉財閥の創始者で、官営事業の払下げを積極的に活用して事業を拡大した。ホテルオークラの前身となる帝国ホテルにも関係する。</p>\n<h4>渋沢栄一とビール</h4>\n<p>渋沢栄一（1840〜1931）は「日本資本主義の父」と呼ばれる明治期の実業家。ビール事業への関与は複数にわたる：</p>\n<ul><li><strong>札幌麦酒会社</strong>（1887年）への出資・設立参画</li><li><strong>ジャパン・ブルワリー・カンパニー</strong>（キリンビールの前身、香港法人）への増資参画</li></ul>\n<h4>ジャパン・ブルワリー・カンパニー（JBC）</h4>\n<p>1885年に香港で設立された外国資本の醸造会社で、横浜に醸造所を置いた。現在のキリンビールの源流。明治期の増資の際に渋沢栄一が株主として加わったとされる（選択肢aの内容は正しい）。</p>\n<h4>生田秀と近代ビールの三大発明</h4>\n<p>生田秀（いくたひでる）は明治期の醸造家で、自身の醸造所において「近代ビールの三大発明」を採用したとされる。近代ビールの三大発明とは一般に以下を指す：</p>\n<p>1. <strong>冷凍機（人工冷却）の利用</strong> — ラガー醸造に必要な低温環境を人工的に実現</p>\n<p>2. <strong>純粋培養酵母</strong> — ルイ・パスツールとエミール・ハンセンの研究に基づく雑菌排除</p>\n<p>3. <strong>炭酸ガス封入（密閉発酵・瓶詰め技術）</strong> — 品質安定と輸送可能化</p>\n<p>（三大発明の定義は資料によって若干異なる場合がある）</p>\n<h4>内国勧業博覧会とビール</h4>\n<p>内国勧業博覧会は明治政府が産業振興のために開催した国内博覧会。複数回開催され、日本の近代産業技術を競う場となった。桜田ビール・浅田ビールはイギリス流エール製法で出品・入賞したとされる（選択肢dの内容は正しい）。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 香港法人ジャパン・ブルワリー・カンパニーには明治期の増資で渋沢栄一が株主として加わった</strong>: 正しい。JBCの増資に渋沢栄一が参加した。</li><li><strong>b) 開拓使廃止後、1886年に北海道庁から札幌麦酒醸造場の払下げを受けたのが渋沢栄一であった</strong>: ✓ 正解（誤りの選択肢）。払下げを受けたのは<strong>大倉喜八郎</strong>。渋沢栄一は翌年の会社設立時に参画。</li><li><strong>c) 生田秀の醸造所では近代ビールの三大発明が採用された</strong>: 正しい。生田秀の醸造所で三大発明が採用されたとされる。</li><li><strong>d) 桜田ビールと浅田ビールはイギリス流エールで内国勧業博覧会に入賞した</strong>: 正しい。両ビールはイギリス式エール製法で出品・入賞した。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>払下げ＝大倉、会社設立＝渋沢（も参加）</strong> と時系列で区別する</li></ul>  - 1886年：大倉喜八郎が払下げを受ける\n<p>  - 1887年：大倉＋渋沢らで「札幌麦酒会社」設立</p>\n<ul><li><strong>渋沢栄一のビール関与は2か所</strong>：JBC（キリン前身）と札幌麦酒会社の両方</li><li>「開拓使→廃止→払下げ」の流れは日本近代ビール史の頻出テーマ。官営（政府）→民営（実業家）への転換点</li><li>大倉喜八郎＝大倉財閥、渋沢栄一＝日本資本主義の父、と人物の背景とセットで覚えると混同しにくい</li></ul>"},{"id":"007","category":"歴史・文化","subcategory":"ビールの飲み方・サービス","difficulty":"基礎","topic":"レーシング","keywords":["レーシング","ビアレース","ベンジャミンレース","泡の輪","ビールグラス","泡","グラスの清潔さ"],"title":"飲み終えたグラスに残る泡の輪：レーシング","questionText":"下記の画像は、飲用後のグラスの様子である。画像のようにグラスの縁に泡の輪が出来ることをなんというか、次の選択肢より選べ。（2017年）","choices":[{"key":"a","text":"エンジェル・クラウン"},{"key":"b","text":"バブル・ライン"},{"key":"c","text":"ホワイト・サークル"},{"key":"d","text":"レーシング"}],"answer":"d) レーシング","answerKey":"d","explanationHtml":"<h3>なぜ正解か</h3>\n<p>ビールを飲み進めるたびにグラス内側の泡が液面の高さに残り、飲み終えると<strong>同心円状の泡の輪</strong>が層になって刻まれる。この模様を<strong>レーシング（Lacing）</strong>と呼ぶ。「ビアレース」「ベンジャミンレース」とも呼ばれる。レーシングが美しく残ることは、グラスが清潔で泡の状態が良かった証拠であり、ビールがおいしい状態で飲めたかどうかをグラスが事後に示してくれる現象とされる。</p>\n<h3>背景知識</h3>\n<h4>レーシングが生まれる仕組み</h4>\n<p>ビールの泡（泡沫）はタンパク質・ホップのイソアルファ酸・炭酸ガスが複合的に絡まって形成される。一口飲むたびに液面が下がり、直前まで液面があった高さのグラス内側に泡が薄く付着・乾燥して輪ができる。この繰り返しで同心円の縞模様が生まれる。</p>\n<h4>美しいレーシングの条件</h4>\n<table><tr><th>条件</th><th>理由</th></tr><tr><td>グラスが清潔</td><td>油分・洗剤残留・口紅などがあると泡が消え、輪が残らない</td></tr><tr><td>新鮮なビール</td><td>鮮度が落ちると泡持ちが悪くなりレーシングが薄くなる</td></tr><tr><td>適切な注ぎ方</td><td>泡を適量作ることで炭酸が保持され輪が鮮明になる</td></tr><tr><td>低温サービス</td><td>適切な温度管理で泡の持ちがよくなる</td></tr></table>\n<h4>ビールグラスの清潔さとビアクリーン</h4>\n<p>飲食店では<strong>ビアクリーン（Beer Clean）</strong>という概念があり、油分・洗剤・汚れが一切残っていない完璧に清潔なグラスを指す。ビアクリーンなグラスでは：</p>\n<ul><li>泡が細かく長持ちする</li><li>レーシングが鮮明に残る</li><li>グラス内側に気泡が付着しない（気泡が多いのは汚れのサイン）</li></ul>\n<h4>別名について</h4>\n<ul><li><strong>ビアレース</strong>：Beer Lace の直訳的な日本語呼称</li><li><strong>ベンジャミンレース</strong>：由来は諸説あるが、英国でこの現象を広めた人物名に由来するとされる</li></ul>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) エンジェル・クラウン</strong>: 実在しない造語。「エンジェル」「クラウン」は英語として自然に聞こえるが、ビール用語ではない。</li><li><strong>b) バブル・ライン</strong>: 実在しない造語。泡（バブル）の線（ライン）というイメージで紛らわしいが、正式な用語ではない。</li><li><strong>c) ホワイト・サークル</strong>: 実在しない造語。白い輪というイメージで直感的に選びやすいが、ビール用語ではない。</li><li><strong>d) レーシング</strong>: ✓ 正解。飲み進めるたびにグラス内側に残る泡の輪状模様。「ビアレース」「ベンジャミンレース」とも呼ぶ。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>レース（lace）</strong> = 「レース模様」のレース。グラスに繊細な縞が刻まれる様子をレース生地に見立てた呼び名</li><li>日本語で「レーシング」と聞くと自動車レースを連想しがちだが、ここでは<strong>ドイリーやレース編みの模様</strong>のイメージ</li><li>「グラスにビールのおいしさが刻まれる」とストーリーで覚えると忘れにくい</li><li>試験では「飲んだ後のグラス内側の泡の輪＝レーシング」と問われるパターンが頻出（2017年出題実績あり）</li><li>別名もセットで：<strong>レーシング ＝ ビアレース ＝ ベンジャミンレース</strong></li></ul>"},{"id":"007","category":"醸造工程","subcategory":"品質管理・香味","difficulty":"基礎","topic":"オフフレーバー","keywords":["オフフレーバー","香味欠陥","ジアセチル","DMS","アセトアルデヒド","光臭","酸化臭","品質管理"],"title":"オフフレーバー：ビール本来の香味を損ねる異臭","questionText":"ビールにおけるオフフレーバーとは何か、最も適切なものを次の選択肢より選べ。（2017）","choices":[{"key":"a","text":"甘いにおい"},{"key":"b","text":"ビール本来の香味を損ねるにおい"},{"key":"c","text":"容器を開栓した瞬間の香り"},{"key":"d","text":"副原料を投入した際の香り"}],"answer":"b) ビール本来の香味を損ねるにおい","answerKey":"b","explanationHtml":"<h3>なぜ正解か</h3>\n<p><strong>オフフレーバー（off-flavor）</strong> とは、英語の \"off\"（外れた・望ましくない）と \"flavor\"（香味）を組み合わせた語で、「<strong>そのビールにあるべきでない、本来の香味を損ねるにおいや味</strong>」の総称。醸造工程の問題・原料の品質・流通・保存環境など様々な要因で発生し、ビールの品質管理において最も重要な管理項目の一つ。</p>\n<h3>背景知識</h3>\n<h4>オフフレーバーの主な種類と原因</h4>\n<table><tr><th>オフフレーバー</th><th>感じる風味</th><th>原因物質</th><th>主な発生原因</th></tr><tr><td><strong>ジアセチル（Diacetyl）</strong></td><td>バタースコッチ・バター臭</td><td>ジアセチル</td><td>発酵不足、熟成不十分、雑菌汚染</td></tr><tr><td><strong>DMS（ジメチルスルフィド）</strong></td><td>缶詰コーン・野菜臭</td><td>ジメチルスルフィド</td><td>煮沸不足、麦芽品質の問題</td></tr><tr><td><strong>アセトアルデヒド</strong></td><td>青リンゴ・草臭</td><td>アセトアルデヒド</td><td>発酵不足、若ビールの未熟成</td></tr><tr><td><strong>酢酸（酸敗）</strong></td><td>酢のような酸味・刺激臭</td><td>酢酸、乳酸</td><td>雑菌（酢酸菌・乳酸菌）汚染</td></tr><tr><td><strong>光臭（スカンキー）</strong></td><td>日光臭・スカンク臭</td><td>3-メチル-2-ブテン-1-チオール</td><td>紫外線・可視光によるホップ成分の光分解</td></tr><tr><td><strong>酸化臭（オールドネス）</strong></td><td>紙・段ボール・ハチミツ臭</td><td>トランス-2-ノネナール等</td><td>酸素との接触、経時劣化</td></tr><tr><td><strong>フェノール臭</strong></td><td>薬品・絆創膏臭</td><td>クロロフェノール類</td><td>野生酵母汚染、水中残留塩素との反応</td></tr><tr><td><strong>硫黄臭</strong></td><td>卵・マッチ臭</td><td>硫化水素</td><td>酵母の種類・ストレス、発酵異常</td></tr></table>\n<h4>発生タイミングによる分類</h4>\n<p><strong>醸造工程由来</strong>：</p>\n<ul><li>仕込み段階：DMS（煮沸不足）、フェノール臭（水の問題）</li><li>発酵段階：ジアセチル・アセトアルデヒド（発酵・熟成不足）、酸敗（雑菌汚染）</li><li>貯酒・ろ過段階：酸化（酸素混入）</li></ul>\n<p><strong>流通・保存由来</strong>：</p>\n<ul><li>光臭：透明・緑瓶製品が蛍光灯や太陽光に当たることで発生。<strong>茶色瓶や缶は光を遮断するため光臭が出にくい</strong></li><li>酸化臭：流通温度が高い・保存期間が長い・キャップの密閉不良</li></ul>\n<h4>ジアセチルとアセトアルデヒド：試験頻出のオフフレーバー</h4>\n<ul><li><strong>ジアセチル（2,3-ブタンジオン）</strong>：</li></ul>  - 発酵中に酵母が前駆体（α-アセト乳酸）を分泌し、酸化されて生成\n<p>  - 熟成（貯酒）工程で酵母が再吸収して分解するため、熟成不十分だと残存する</p>\n<p>  - 閾値が非常に低く（0.1 mg/L 前後）、微量でも感知される</p>\n<p>  - 一部のスタイル（例：チェコのボヘミアンピルスナー）では若干の存在が許容される場合もある</p>\n<ul><li><strong>アセトアルデヒド</strong>：</li></ul>  - アルコール発酵の中間産物。正常な発酵では酵母がエタノールに変換して除去する\n<p>  - 若ビール（発酵直後）に多く、熟成とともに減少する</p>\n<p>  - 前問（002：若ビール）と関連する概念</p>\n<h4>光臭（スカンキー）の詳細</h4>\n<ul><li>ホップ中のイソフムロン（苦み成分）が光（特に波長350〜500nm）により分解</li><li>生成された「3-メチル-2-ブテン-1-チオール（MBT）」がスカンク腺の分泌物と同じ成分</li><li>対策：茶色瓶（ブラウンボトル）・缶・樽での流通、または光分解しない化学修飾ホップの使用</li></ul>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 甘いにおい</strong>: 誤り。甘い香りはビールの正常な香味成分（麦芽由来のキャラメル香など）であることが多く、それ自体はオフフレーバーではない。ただし過度の甘さ（ジアセチルのバタースコッチ臭など）はオフフレーバーになり得る。</li><li><strong>b) ビール本来の香味を損ねるにおい</strong>: ✓ 正解。「あるべきでない＝本来の香味を損ねる」というオフフレーバーの定義そのもの。</li><li><strong>c) 容器を開栓した瞬間の香り</strong>: 誤り。開栓直後の香り（フレッシュアロマやホップ香）は本来の望ましい香りであり、オフフレーバーとは無関係。</li><li><strong>d) 副原料を投入した際の香り</strong>: 誤り。副原料（果実・スパイス等）を使った際の香りは、そのビールのスタイルに意図された香りであり、オフフレーバーではない。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>off = 外れた・望ましくない</strong>：英語の語感で覚える。「オフサイド＝反則」のように「オフ＝ルール外・あるべきでない」</li><li><strong>主要オフフレーバー3点セット</strong>：</li></ul>  - バター臭 → **ジアセチル**（熟成不足）\n<p>  - コーン臭 → <strong>DMS</strong>（煮沸不足）</p>\n<p>  - 青リンゴ臭 → <strong>アセトアルデヒド</strong>（発酵不足）</p>\n<ul><li><strong>光臭対策は茶色瓶・缶</strong>：透明・緑瓶はUVを通すため光臭が発生しやすい。缶ビールは光臭が発生しない</li><li>「香味を損ねる」という定義を覚えれば、他の選択肢（甘い・開栓直後・副原料）はすべて「意図された・望ましい香り」の文脈であることがわかる</li><li>2017年出題問題。定義を問う基礎問題だが、個別のオフフレーバー名・原因を問う応用問題とセットで学習すると効果的</li></ul>"},{"id":"007","category":"歴史・文化","subcategory":"ビールと文化・芸術","difficulty":"応用","topic":"小津安二郎とビール映画","keywords":["小津安二郎","出来ごころ","秋日和","秋刀魚の味","日本映画","ビールと文化","戦前映画","日常描写"],"title":"小津安二郎：ビールを日常文化として描いた日本映画の巨匠","questionText":"ビール工場の工員を主人公にした戦前の作品「出来ごころ」のほか、「秋日和」「秋刀魚の味」などでビールの登場シーンを印象的に描いた日本映画の巨匠を選べ。","choices":[{"key":"a","text":"黒澤明"},{"key":"b","text":"小津安二郎"},{"key":"c","text":"マキノ雅弘"},{"key":"d","text":"大島渚"}],"answer":"b) 小津安二郎","answerKey":"b","explanationHtml":"<h3>なぜ正解か</h3>\n<p>小津安二郎（1903〜1963）は、日常の家族生活を静謐な映像で描いた日本映画の巨匠。ビールに関連する作品として特に重要なのが以下の2つ：</p>\n<ul><li><strong>「出来ごころ」（1933年）</strong>: ビール工場の工員・喜八を主人公にした無声映画。当時の大阪の庶民生活とビール製造現場を背景に、人情・喜劇を描いた。喜八シリーズの一作。</li><li><strong>「秋日和」（1960年）・「秋刀魚の味」（1962年）</strong>: カラー作品。食卓・居酒屋・料亭でビールを飲む場面が繰り返し登場し、戦後日本の中産階級の生活文化の一部としてビールを自然に描いている。</li></ul>\n<p>「秋刀魚の味」は小津の遺作であり、笠智衆・岩下志麻らが出演。ビールを傾けながら交わされる中年男性たちの会話が、時代の空気を映し出している。</p>\n<h3>背景知識</h3>\n<h4>小津安二郎の作風とビール</h4>\n<p>小津作品の特徴として、<strong>ローアングル（畳の目線）</strong>・<strong>固定カメラ</strong>・<strong>枕ショット</strong>（人物を映さない静物カット）が挙げられる。ビール瓶・グラス・栓抜きといった小道具も、この「枕ショット」的手法で丁寧に映し出され、単なる飲料を超えた文化的記号として機能している。</p>\n<h4>「出来ごころ」（1933年）について</h4>\n<ul><li><strong>監督</strong>: 小津安二郎</li><li><strong>製作</strong>: 松竹蒲田</li><li><strong>形式</strong>: サイレント（無声）映画</li><li><strong>主演</strong>: 坂本武（喜八役）</li><li><strong>舞台</strong>: 大阪のビール工場と下町</li><li>キネマ旬報ベスト・テン第1位を獲得した名作。ビール工場という近代産業の現場を舞台にしながら、人情と笑いを描いた。</li></ul>\n<h4>昭和前期のビールと庶民文化</h4>\n<p>1930年代、ビールは大手（大日本麦酒・麒麟麦酒）によって大量生産が始まり、都市部の工場労働者にも普及しつつあった時期。「出来ごころ」が描くビール工場は、当時の産業化・都市化の象徴でもある。</p>\n<h4>小津作品のビール描写一覧（主なもの）</h4>\n<table><tr><th>作品</th><th>年</th><th>ビールの役割</th></tr><tr><td>出来ごころ</td><td>1933</td><td>舞台そのものがビール工場、工員の日常</td></tr><tr><td>秋日和</td><td>1960</td><td>父親世代の男性たちが居酒屋でビールを飲む場面</td></tr><tr><td>秋刀魚の味</td><td>1962</td><td>老いた父と仲間たちがビールを飲みながら語らう（遺作）</td></tr></table>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 黒澤明</strong>: 誤り。黒澤明（1910〜1998）は「七人の侍」「羅生門」「生きる」などで知られる巨匠。ダイナミックな演出・チャンバラ・社会派ドラマが特徴で、ビール工場を舞台にした作品は代表作に含まれない。</li><li><strong>b) 小津安二郎</strong>: ✓ 正解。「出来ごころ」（ビール工場が舞台）・「秋日和」「秋刀魚の味」（ビール飲用シーン）で知られる。</li><li><strong>c) マキノ雅弘</strong>: 誤り。マキノ雅弘（1908〜1993）は「日本映画の父」牧野省三の息子で、任侠映画・時代劇を得意とした監督。ビール描写の巨匠としては知られていない。</li><li><strong>d) 大島渚</strong>: 誤り。大島渚（1932〜2013）は「愛のコリーダ」「戦場のメリークリスマス」などで知られる前衛的・社会批判的な作風の監督。小津とは対極的な作風で、ビールの日常描写とは結びつかない。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「出来ごころ＝ビール工場＝小津安二郎」</strong> のセットで覚える</li><li>小津の3作品キーワード：「<strong>出来</strong>（ごころ）」「<strong>秋</strong>日和」「<strong>秋</strong>刀魚の味」→「出来・秋・秋」</li><li>小津の遺作「秋刀魚の味」（1962年）はカラー作品で、ビールシーンが印象的な晩年の傑作</li><li>黒澤・小津・溝口健二は「日本映画の三大巨匠」として並び称される。試験では黒澤との混同に注意</li><li>小津作品はロウアングル固定カメラ＋静物ショットが特徴 → ビール瓶も「キャラクター」として映る</li></ul>"},{"id":"008","category":"醸造工程","subcategory":"パッケージング","difficulty":"基礎","topic":"びん詰め・炭酸ガス置換","keywords":["二酸化炭素","炭酸ガス","酸素","パッケージング","びん詰め","酸化防止","ガス置換","品質劣化"],"title":"びん詰め工程における炭酸ガス置換","questionText":"ビールのパッケージング工程では、品質劣化の原因となる酸素を追い出すため、びん内をある気体で置換する。その気体を次の選択肢より選べ。（2012年）","choices":[{"key":"a","text":"水素"},{"key":"b","text":"二酸化窒素"},{"key":"c","text":"二酸化炭素"},{"key":"d","text":"ヘリウム"}],"answer":"c) 二酸化炭素","answerKey":"c","explanationHtml":"<h3>なぜ正解か</h3>\n<p>ビールは酸素に触れると酸化が進み、風味が劣化する（紙臭・老化臭と呼ばれるオフフレーバーが発生する）。びん詰め前にびん内の空気（酸素を含む）を<strong>二酸化炭素（CO₂）</strong>で置換することで、この酸化を防ぐ。</p>\n<p>二酸化炭素を使う理由は酸化防止だけではない。充填前に加圧状態を作ることで、ビールを注ぎ込む際の炭酸ガスの過剰な発泡を抑え、液面上での酸素混入も最小化できる。ビール自体が炭酸ガスを溶解しているため、同じ気体で加圧することは相性がよく、ビールの品質に悪影響を与えない点でも優れている。</p>\n<h3>背景知識</h3>\n<h4>ビール酸化のメカニズム</h4>\n<p>酸素はビールに含まれるポリフェノールや不飽和脂肪酸と反応し、<strong>トランス-2-ノネナール</strong>（段ボール臭・紙臭の原因物質）などの酸化生成物を生み出す。この反応は温度が高いほど速く進むため、低温管理とともにパッケージング時の酸素除去が品質保持の両輪となっている。</p>\n<h4>パッケージングにおける酸素管理（DO管理）</h4>\n<p>業界では容器内に溶け込んだ酸素量を <strong>DO（Dissolved Oxygen）</strong> または <strong>TPO（Total Package Oxygen）</strong> と呼び、ppb（十億分の一）単位で管理する。目標値は数十ppb以下とされており、世界の主要ブルワリーは「50ppb以下」を目安にしているところが多い。</p>\n<h4>二酸化炭素置換の工程</h4>\n<p>1. <strong>空びん洗浄・殺菌</strong> — 洗瓶機で高温アルカリ洗浄</p>\n<p>2. <strong>CO₂パージ（置換）</strong> — びん内に炭酸ガスを吹き込み、空気（酸素）を追い出す</p>\n<p>3. <strong>充填（フィリング）</strong> — 等圧充填機（アイソバリック充填）でビールを注入</p>\n<p>4. <strong>打栓（クラウニング）</strong> — 王冠を打ち、気密を保持</p>\n<p>5. <strong>パストリゼーション</strong> — 瓶ごと加熱殺菌（トンネルパストライザーなど）</p>\n<p>等圧充填では、充填前にびん内を炭酸ガスで加圧してからビールを充填するため、炭酸の逃散と泡立ちを最小限に抑えられる。</p>\n<h4>窒素ガスとの使い分け</h4>\n<p>クラフトビールの生樽や缶（ウィジェット缶）では <strong>窒素（N₂）</strong> が使われることもある。窒素は炭酸ガスより水に溶けにくいため、細かく滑らかな泡（クリーミーヘッド）を生み出す特性がある。ただしびんのパージには一般に二酸化炭素が用いられる。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 水素</strong>: 可燃性・爆発性があり、食品工場での使用は危険で非現実的。不正解。</li><li><strong>b) 二酸化窒素（NO₂）</strong>: 大気汚染物質の一つ。毒性があり食品に使用できない。窒素（N₂）と混同しないこと。不正解。</li><li><strong>c) 二酸化炭素（CO₂）</strong>: ✓ 正解。炭酸飲料と相性がよく、酸素を排除し、加圧による発泡抑制効果もある。</li><li><strong>d) ヘリウム</strong>: 不活性ガスだが食品用途での使用実績はなく、コストも高い。ビールへの溶解度も低く実用的でない。不正解。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「炭酸ビールには炭酸ガスで守る」</strong> — ビール自体がCO₂を含むため、同じ気体で置換するのは自然な発想として覚える。</li><li><strong>酸素＝劣化の大敵</strong> — 製造工程全体（仕込み・発酵・濾過・パッケージング）を通じて低酸素管理（Low DO Brewing）が品質の鍵。</li><li><strong>等圧充填（アイソバリック充填）</strong> という用語とセットで覚えると、工程全体の理解が深まる。</li><li>2012年出題の基礎問題。パッケージング工程の「なぜ？」を問う典型問題のため、CO₂の役割を二つ（酸化防止・発泡抑制）で答えられるようにしておくとよい。</li></ul>"},{"id":"008","category":"歴史・文化","subcategory":"日本のビール史","difficulty":"基礎","topic":"昭和30年代のビール消費拡大","keywords":["昭和30年代","高度成長期","電気冷蔵庫","三種の神器","ビール消費量","家庭飲用","大阪万博"],"title":"昭和30年代にビール消費量が飛躍的に伸びた理由","questionText":"昭和30年代に日本のビール消費量は飛躍的に伸びるが、その理由の一つとして最も適しているものを、次の選択肢より選べ。（2019年）","choices":[{"key":"a","text":"大阪万博の開催"},{"key":"b","text":"電気冷蔵庫の普及"},{"key":"c","text":"ビール税の減税"},{"key":"d","text":"びん詰め生ビールの全国規模での発売"}],"answer":"b) 電気冷蔵庫の普及","answerKey":"b","explanationHtml":"<h3>なぜ正解か</h3>\n<p>昭和30年代（1955〜1964年）は日本の高度経済成長期にあたり、「<strong>三種の神器</strong>」と呼ばれた<strong>洗濯機・白黒テレビ・電気冷蔵庫</strong>が一般家庭に急速に普及した。それまでビールは料理屋・居酒屋など外飲みの飲み物だったが、電気冷蔵庫の普及により<strong>家庭で冷やして飲む</strong>スタイルが広まり、消費量が飛躍的に拡大した。</p>\n<h3>背景知識</h3>\n<h4>高度成長期と「三種の神器」</h4>\n<p>昭和30年代は神武景気（1954〜57年）・岩戸景気（1958〜61年）と呼ばれる好景気が続き、家電製品の普及が急加速した時代。「三種の神器」はかつての宮中の宝物（八咫鏡・草薙剣・八尺瓊勾玉）になぞらえた表現で、豊かさの象徴とされた。</p>\n<table><tr><th>三種の神器</th><th>普及時期（昭和）</th><th>ビールへの関連</th></tr><tr><td>白黒テレビ</td><td>30年代前半</td><td>直接の関係は薄い</td></tr><tr><td>洗濯機</td><td>30年代前半</td><td>直接の関係は薄い</td></tr><tr><td><strong>電気冷蔵庫</strong></td><td><strong>30年代後半</strong></td><td><strong>家庭でビールを冷蔵保存・飲用が可能に</strong></td></tr></table>\n<h4>ビール消費の場の変化</h4>\n<p>電気冷蔵庫普及前：</p>\n<ul><li>ビールの家庭保存は困難（氷の入った木製氷冷蔵庫が主流）</li><li>消費の場は飲食店・料亭・接待が中心</li></ul>\n<p>電気冷蔵庫普及後：</p>\n<ul><li>家庭でいつでも冷えたビールを飲める</li><li>「夕食時に一杯」「風呂上がりの一杯」という家庭内飲用文化が定着</li><li>大量購入・ストック消費が生まれ、消費量が急増</li></ul>\n<h4>各選択肢の年代確認</h4>\n<table><tr><th>選択肢</th><th>実際の時期</th></tr><tr><td>大阪万博</td><td>1970年（昭和45年）＝昭和40年代</td></tr><tr><td>電気冷蔵庫の普及</td><td>昭和30年代 ✓</td></tr><tr><td>ビール税の減税</td><td>昭和30年代に大規模減税の記録はない</td></tr><tr><td>びん詰め生ビールの全国発売</td><td>サントリーが1967年（昭和42年）に発売＝昭和40年代</td></tr></table>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 大阪万博の開催</strong>: 誤り。大阪万博は1970年（昭和45年）の出来事。昭和30年代ではない。万博がビール消費を一時的に押し上げたことはあっても、「昭和30年代の飛躍的な伸び」の主因ではない。</li><li><strong>b) 電気冷蔵庫の普及</strong>: ✓ 正解。高度成長期に三種の神器の一つとして家庭に普及し、ビールを冷蔵保存して家庭で飲む文化が定着した。</li><li><strong>c) ビール税の減税</strong>: 誤り。昭和30年代に家庭消費を促すような大幅なビール税減税の記録はなく、主因としては不適切。</li><li><strong>d) びん詰め生ビールの全国規模での発売</strong>: 誤り。サントリーが「純生」として初めてびん詰め生ビールを全国発売したのは1967年（昭和42年）であり、昭和40年代の出来事。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「冷蔵庫が来てビールが家に来た」</strong>：三種の神器（洗濯機・テレビ・冷蔵庫）の中でビールと直結するのは冷蔵庫</li><li>昭和30年代（1955〜1964）は<strong>高度成長期・三種の神器</strong>とセットで覚える</li><li>誤答の年代を整理：大阪万博・びん詰め生ビールはどちらも<strong>昭和40年代（1965〜）</strong></li><li>公式テキスト119ページ（2022年5月改訂版）出典。頻出の設問パターン（2019年出題実績あり）</li></ul>"},{"id":"008","category":"歴史・文化","subcategory":"日本ビール史・ブランド","difficulty":"発展","topic":"宝酒造の中びん参入","keywords":["宝酒造","タカラビール","中びん","500ml","昭和32年","1957年","日本ビール史","価格競争"],"title":"宝酒造の中びん参入：1957年の業界初500ml瓶","questionText":"1957（昭和32）年にビール業界に参入し、500mlの中びんを100円で販売した会社を次の選択肢より選べ。（2018）","choices":[{"key":"a","text":"サントリー"},{"key":"b","text":"宝酒造"},{"key":"c","text":"メルシャン"},{"key":"d","text":"小西酒造"}],"answer":"b) 宝酒造","answerKey":"b","explanationHtml":"<h3>なぜ正解か</h3>\n<p>1957（昭和32）年、焼酎販売首位の<strong>宝酒造</strong>が「<strong>タカラビール・中びん</strong>」を発売してビール業界に参入した。この中びん（500ml）は<strong>業界初のサイズ</strong>であり、当時の大びん（633ml・125円）より25円安い<strong>100円</strong>という価格設定で差別化を図った。しかし他社も中びんを相次いで発売し、価格面での優位性は失われ、差別化戦略は失敗に終わった。</p>\n<h3>背景知識</h3>\n<h4>1950〜60年代の日本ビール業界</h4>\n<p>戦後復興期、日本のビール市場は大手4社（キリン・サッポロ・アサヒ・ニッポン）が寡占状態にあり、参入障壁が高かった。この時期、ビールは高級品として位置づけられ、主流は大びん（633ml）での販売だった。</p>\n<ul><li><strong>大びん（633ml）</strong>：業界標準として長年使われてきた容量。当時の価格は約125円。</li><li><strong>中びん（500ml）</strong>：宝酒造が業界で初めて採用したサイズ。100円という価格で新しい消費層を取り込もうとした。</li></ul>\n<h4>宝酒造のビール参入</h4>\n<ul><li><strong>宝酒造（現：宝ホールディングス）</strong>：明治44年（1911年）創業。焼酎「純」などで知られ、1950年代には焼酎市場でトップシェアを誇っていた。</li><li><strong>ビール参入の動機</strong>：焼酎市場は価格競争が激しく、成長市場であるビールへの多角化を目指した。</li><li><strong>「タカラビール」の顛末</strong>：中びんによる差別化が失敗し、大手との競争に勝てず、ビール事業からは撤退。酒類メーカーとしてその後も焼酎・みりん・清酒等を主力として成長した。</li></ul>\n<h4>同時代のビール業界参入・撤退の流れ</h4>\n<p>戦後から高度成長期にかけて、日本のビール業界では大手寡占構造が強化されていく一方で、中小・異業種からの参入と撤退が繰り返された。</p>\n<ul><li><strong>サントリー</strong>：1963年（昭和38年）に「サントリービール」でビール市場に本格参入。長年の赤字を乗り越え、現在は国内4位のシェアを持つ。</li><li><strong>メルシャン</strong>（旧：川崎葡萄酒・旧：ジャパン・ワイナリー）：主にワイン事業で知られ、ビール参入の歴史は宝酒造とは異なる。</li><li><strong>小西酒造</strong>：兵庫の日本酒メーカーで、「白雪」ブランドで知られるが、ビール業界への大規模参入は行っていない。</li></ul>\n<h4>瓶ビールの容量規格</h4>\n<table><tr><th>容量</th><th>通称</th><th>特徴</th></tr><tr><td>633ml</td><td>大びん</td><td>業界標準・リターナブル瓶として長年使用</td></tr><tr><td><strong>500ml</strong></td><td><strong>中びん</strong></td><td><strong>宝酒造が1957年に業界初導入</strong></td></tr><tr><td>334ml</td><td>小びん</td><td>小容量ニーズに対応</td></tr><tr><td>250ml</td><td>ミニびん</td><td>少量飲酒・試飲用途</td></tr></table>\n<p>現在の缶・瓶市場では500ml缶が主流の一つとなっており、宝酒造が導入した中びん（500ml）という容量は現代に引き継がれている。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) サントリー</strong>: 誤り。サントリーがビール市場に本格参入したのは1963年（昭和38年）。1957年の中びん参入とは別の会社・別の年。ビール事業で長年赤字が続いた「やってみなはれ」精神の象徴としてビール史に刻まれている。</li><li><strong>b) 宝酒造</strong>: ✓ 正解。焼酎首位の酒類メーカーが業界初の500ml中びんを100円で発売。差別化失敗後にビール事業から撤退。</li><li><strong>c) メルシャン</strong>: 誤り。メルシャンはワイン事業で知られるメーカー（旧・マンズワイン等）。1957年のビール中びん参入との関連はない。</li><li><strong>d) 小西酒造</strong>: 誤り。「白雪」で知られる兵庫の日本酒メーカー。1957年のビール業界参入とは無関係。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「1957年・宝酒造・500ml・100円」の4点セット</strong>：出題はこのどれかの要素を問う形式が多い</li><li><strong>「焼酎首位→ビール参入→差別化失敗→撤退」という流れ</strong>で宝酒造のビール史を覚える</li><li><strong>中びん（500ml）は業界初</strong>：現在の500ml缶・瓶が主流になった起源とも言える歴史的な容量</li><li><strong>大びん125円・中びん100円（差額25円）</strong>：価格差の数値も問われることがある</li><li>サントリーの参入年（<strong>1963年</strong>）と混同しないよう注意。宝酒造は1957年、サントリーは1963年</li><li>出典：<strong>公式テキスト120ページ</strong>（2022年5月改訂版）。テキストの具体的なページを示す問題は、数値・固有名詞の正確な記憶が求められる「発展」レベルの問題</li></ul>"},{"id":"009","category":"歴史・文化","subcategory":"日本のビール史","difficulty":"応用","topic":"ビヤホールの日・日本初のビヤホール","keywords":["ビヤホールの日","8月4日","恵比寿ビールBeer Hall","馬越恭平","日本麦酒醸造会社","銀座","明治32年","1899年"],"title":"ビヤホールの日は何月何日か──日本初のビヤホール開業","questionText":"1899（明治32）年、現在の銀座8丁目に日本初のビヤホールがオープンしたことにちなんで、日本記念日協会に登録されている「ビヤホールの日」を次の選択肢より選べ。（2014年）","choices":[{"key":"a","text":"7月14日"},{"key":"b","text":"7月24日"},{"key":"c","text":"8月4日"},{"key":"d","text":"8月14日"}],"answer":"c) 8月4日","answerKey":"c","explanationHtml":"<h3>なぜ正解か</h3>\n<p>1899（明治32）年<strong>8月4日</strong>、日本麦酒醸造会社の<strong>馬越恭平（まごし きょうへい）</strong>が現在の銀座8丁目に「<strong>恵比寿ビール Beer Hall</strong>」を開業した。これが日本初のビヤホールである。この開業日にちなみ、<strong>8月4日</strong>が「ビヤホールの日」として日本記念日協会に登録されている。</p>\n<h3>背景知識</h3>\n<h4>馬越恭平と日本麦酒醸造会社</h4>\n<p>馬越恭平（1844〜1933）は明治時代の実業家。日本麦酒醸造会社（恵比寿ビールの製造元）の経営に携わり、日本のビール産業の発展を牽引した人物として知られる。恵比寿ビールは1890年（明治23年）に東京・目黒で製造開始され、品質の高さで評判を得ていた。</p>\n<h4>日本初のビヤホール「恵比寿ビール Beer Hall」</h4>\n<table><tr><th>項目</th><th>内容</th></tr><tr><td>開業日</td><td>1899年（明治32年）8月4日</td></tr><tr><td>場所</td><td>現在の東京・銀座8丁目</td></tr><tr><td>運営</td><td>日本麦酒醸造会社（馬越恭平）</td></tr><tr><td>ブランド</td><td>恵比寿ビール</td></tr><tr><td>意義</td><td>日本初のビヤホール／西洋式ビール飲用文化の定着に貢献</td></tr></table>\n<h4>ビヤホールという文化</h4>\n<p>ビヤホールはドイツのビアホール（Bierhaus）文化を源流とし、大きなホールでビールを注文し、多くの人と賑やかに飲む西洋の社交スタイルを取り入れた施設。明治時代の文明開化の象徴の一つとして、銀座という立地で多くの市民・文化人に親しまれた。現在も「銀座ライオン」（サッポロライオン運営）が同地区で営業を続けており、日本のビヤホール文化の系譜を継いでいる。</p>\n<h4>日本記念日協会登録の「ビール関連記念日」</h4>\n<table><tr><th>記念日</th><th>日付</th><th>内容</th></tr><tr><td>ビヤホールの日</td><td>8月4日</td><td>1899年・日本初ビヤホール開業日</td></tr><tr><td>ビールの日</td><td>6月29日</td><td>ビール酒造組合が制定</td></tr></table>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 7月14日</strong>: 誤り。ビール・ビヤホールに関連する記念日ではない。7月14日はフランス革命記念日（バスティーユの日）。</li><li><strong>b) 7月24日</strong>: 誤り。日付として実在しないビール記念日。選択肢の中で紛らわしいが根拠なし。</li><li><strong>c) 8月4日</strong>: ✓ 正解。1899年（明治32年）8月4日、恵比寿ビール Beer Hall が銀座8丁目に開業。日本記念日協会登録「ビヤホールの日」。</li><li><strong>d) 8月14日</strong>: 誤り。正解の8月4日と混同しやすい誤答。「8月」は正しいが「14日」は誤り。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「8（ビール）の4日」</strong>：8月4日 → 「ハチ（蜂）のビール」「8＝ビアホール」と語呂で覚える</li><li>正解の数字を確実に：<strong>8月4日・銀座8丁目・1899（明治32）年</strong>と「8」が続くのが特徴</li><li>キーパーソン：<strong>馬越恭平</strong>（まごし きょうへい）＝日本麦酒醸造会社・恵比寿ビール</li><li>公式テキスト112ページ（2022年5月改訂版）出典。2014年出題実績あり</li><li>現在の銀座ライオンへの系譜もセットで把握しておくと周辺知識として有効</li></ul>"},{"id":"009","category":"ビアスタイル","subcategory":"ドイツビール・ラガー","difficulty":"基礎","topic":"メルツェン・オクトーバーフェスト","keywords":["メルツェン","オクトーバーフェスト","ミュンヘン","3月仕込み","ケルシュ","クリーク","テレジエンヴィーゼ","ラガー"],"title":"メルツェン：オクトーバーフェストのために仕込まれるビール","questionText":"ドイツ・バイエルンの州都ミュンヘンで行われ、世界中から毎年600万人以上が来場するオクトーバーフェスト。この祭典のために仕込まれるビールを次の選択肢より選べ。（2013）","choices":[{"key":"a","text":"クリーク"},{"key":"b","text":"ケルシュ"},{"key":"c","text":"スリースレッド"},{"key":"d","text":"メルツェン"}],"answer":"d) メルツェン","answerKey":"d","explanationHtml":"<h3>なぜ正解か</h3>\n<p>オクトーバーフェストで提供される伝統的なビールは<strong>メルツェン（Märzen）</strong>。ドイツ語で「3月（März）のビール」を意味し、<strong>冷蔵技術が普及する以前の時代に3月に仕込んで夏を越え、秋のオクトーバーフェストに合わせて飲み頃を迎える</strong>という醸造サイクルから生まれたスタイル。色がやや濃く（琥珀〜銅色）、アルコール度数もやや高め（5.8〜6.3%程度）、モルトの甘みが豊かな飲み応えのあるラガービール。</p>\n<h3>背景知識</h3>\n<h4>オクトーバーフェストの歴史</h4>\n<ul><li><strong>1810年10月12日</strong>：バイエルン王国のルートヴィヒ王太子（後のルートヴィヒ1世）とザクセン＝ヒルトブルクハウゼン公国の公女<strong>テレジア</strong>の結婚式を祝う祭典が開催された</li><li>会場はミュンヘン郊外の城壁前の緑地。以来この地は<strong>テレジエンヴィーゼ（Theresienwiese＝テレジアの緑地）</strong>と呼ばれ、現在も開催地となっている</li><li>翌年以降も競馬を軸とした祭典を継続すると発表し、毎年恒例の祭りとして定着</li><li>やがて農業品評会やビール提供が加わり、現在の形に発展した</li></ul>\n<h4>メルツェン（Märzen）の特徴</h4>\n<table><tr><th>項目</th><th>内容</th></tr><tr><td>仕込み時期</td><td><strong>3月</strong>（ドイツ語でMärz）</td></tr><tr><td>色</td><td>琥珀〜銅色（アンバー系）</td></tr><tr><td>アルコール度数</td><td>5.8〜6.3%程度</td></tr><tr><td>特徴</td><td>モルトの甘みが豊か、しっかりした飲み応え</td></tr><tr><td>熟成期間</td><td>仕込みから秋まで低温で長期熟成（ラガリング）</td></tr><tr><td>スタイル分類</td><td>ドイツ式ラガー</td></tr></table>\n<p><strong>なぜ3月に仕込むのか</strong>：冷蔵技術がなかった時代、夏の高温ではビール醸造ができなかった。そこで春の訪れる前の3月に仕込み、氷室（アイスケラー）で夏の間貯蔵・熟成させ、秋の収穫祭シーズンに飲み頃を迎えるという年間サイクルが確立された。</p>\n<h4>オクトーバーフェストビールの現代的変化</h4>\n<p>現代のオクトーバーフェストでは、伝統的なメルツェンに加えて、より淡色の<strong>ヘルスビール（Helles）</strong>も広く提供されるようになっている。ミュンヘンの6大醸造所（ホフブロイ・レーベンブロイ・パウラーナー・アウグスティナー・シュパーテン・ハッカー＝プショール）が専用テントを設け、それぞれの「フェストビール」を提供する。</p>\n<h4>選択肢のビアスタイル解説</h4>\n<p><strong>ケルシュ（Kölsch）</strong>：</p>\n<ul><li>ドイツ・ケルン（Köln）の地ビール</li><li><strong>エールとラガーの中間的な製法</strong>：上面発酵後に低温熟成するハイブリッドスタイル</li><li>淡色・軽快・やや苦みがある</li><li>ケルン市内の特定醸造所のみが名乗れる地理的保護スタイル</li><li>専用グラス「シュタンゲ」（細長い円筒形200ml）で提供される（問004と関連）</li></ul>\n<p><strong>クリーク（Kriek）</strong>：</p>\n<ul><li><strong>ベルギー産のランビック（自然発酵）ビール</strong>にサクランボ（クリーク）を加えて再発酵させたフルーツビール</li><li>強い酸味とチェリーの風味が特徴</li><li>ランビックはブリュッセル近郊のゼンヌ川流域に固有の野生酵母・乳酸菌による自然発酵で醸造される</li></ul>\n<p><strong>スリースレッド（Three Threads）</strong>：</p>\n<ul><li>18世紀のイギリスで飲まれていた<strong>複数のビールを混ぜた飲み物</strong></li><li>異なる樽のビールを3種類（三つのスレッド＝糸口）混ぜて提供したことが名前の由来</li><li>これがポーターの前身となったとする説がある（醸造家が一つの樽でこの味を再現しようとしてポーターが誕生）</li></ul>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) クリーク</strong>: 誤り。ベルギー産のサクランボ使用フルーツランビック。オクトーバーフェストとは全く関係のないベルギーの伝統スタイル。</li><li><strong>b) ケルシュ</strong>: 誤り。ケルン地方のハイブリッドビール。バイエルン・ミュンヘンではなくケルンの地ビールであり、オクトーバーフェストでは提供されない。</li><li><strong>c) スリースレッド</strong>: 誤り。18世紀イギリスの混合飲料で、ポーター誕生との関連で知られる歴史的な概念。ドイツのビール祭りとは無関係。</li><li><strong>d) メルツェン</strong>: ✓ 正解。「3月仕込み・秋に飲み頃」のドイツ伝統ラガー。オクトーバーフェストの象徴的なビール。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>メルツェン＝März（3月）＋en</strong>：語源から「3月のビール」と直結して覚える</li><li><strong>「3月仕込み→夏に貯蔵→10月のオクトーバーフェストで飲む」</strong>：製造サイクルの流れを時系列で覚える</li><li><strong>テレジエンヴィーゼ</strong>：「テレジア（花嫁）の緑地」。人名＋緑地の組み合わせで会場名を覚える</li><li>問004（マース＝1Lジョッキ）と本問（メルツェン＝ビールの種類）はオクトーバーフェスト関連の2大頻出テーマ。セットで学習する</li><li><strong>ケルシュとメルツェンの混同注意</strong>：どちらもドイツのビールだが、ケルシュはケルン・上面発酵系、メルツェンはミュンヘン・ラガー系で産地・製法・スタイルがすべて異なる</li><li>出典：<strong>公式テキスト138〜139ページ</strong>（2022年5月改訂版）</li></ul>"},{"id":"009","category":"ブランド・銘柄","subcategory":"日本のビールメーカー","difficulty":"基礎","topic":"オリオンビール創業","keywords":["オリオンビール","沖縄","1957年","昭和32年","沖縄ビール","地ビール","ブランド公募","琉球"],"title":"オリオンビール：沖縄で生まれた地域ビールの歴史","questionText":"1957年（昭和32年）に沖縄で創業し、2年後に現在の企業名となる商品を発売したビールメーカーを次の選択肢より選べ。（2014年）","choices":[{"key":"a","text":"オリオンビール"},{"key":"b","text":"サザンビール"},{"key":"c","text":"ヘリオスビール"},{"key":"d","text":"ニヘデビール"}],"answer":"a) オリオンビール","answerKey":"a","explanationHtml":"<h3>なぜ正解か</h3>\n<p>オリオンビール株式会社の前身「沖縄ビール株式会社」は1957年（昭和32年）に沖縄の地元実業家たちによって設立された。創業年にブランド名を一般公募し、「オリオンビール」が採用された。その2年後の1959年に社名も「オリオンビール株式会社」に変更し、現在の企業名・ブランド名が確立した。</p>\n<h3>背景知識</h3>\n<h4>オリオンビール創業の経緯</h4>\n<table><tr><th>年</th><th>出来事</th></tr><tr><td>1957年</td><td>沖縄ビール株式会社として設立。ブランド名「オリオンビール」を一般公募で採用</td></tr><tr><td>1959年</td><td>社名を「オリオンビール株式会社」に変更</td></tr><tr><td>1972年</td><td>沖縄の本土復帰。課税制度が変わりシェア争いが激化</td></tr><tr><td>2002年</td><td>アサヒビールと業務提携（資本提携は後に解消）</td></tr><tr><td>2019年</td><td>野村キャピタル・パートナーズとカーライル・グループが買収</td></tr></table>\n<h4>創業当時の沖縄の状況</h4>\n<p>1957年当時、沖縄はアメリカ統治下（琉球政府時代）にあった。日本本土のビール税・酒税法の規制が及ばないという特殊な条件のもとで醸造が可能であり、地元資本によるビールメーカーの設立が実現した。本土復帰（1972年）後は大手4社（キリン・アサヒ・サッポロ・サントリー）との競争にさらされたが、沖縄県内での強固な地域シェアを維持している。</p>\n<h4>オリオンビールの特徴</h4>\n<ul><li><strong>本社</strong>: 沖縄県豊見城市</li><li><strong>主力製品</strong>: オリオン ザ・ドラフト（旧ドラフトビール）</li><li><strong>味わい</strong>: 南国の気候に合わせた軽くスッキリした飲み口。苦味が穏やかでキレが良い</li><li><strong>沖縄でのシェア</strong>: 長年にわたり沖縄県内で約50%前後のシェアを維持</li><li><strong>ブランド名の由来</strong>: 「オリオン」は星座のオリオン座。公募で選ばれた名称</li></ul>\n<h4>沖縄の他のビール・酒造メーカー</h4>\n<p>沖縄にはオリオンビール以外にも酒類メーカーが存在する：</p>\n<ul><li><strong>ヘリオスビール（ヘリオス酒造）</strong>: 名護市に本拠。泡盛・クラフトビールも製造（選択肢cは実在する企業）</li><li><strong>石垣島ビール</strong>: 石垣島のクラフトビールメーカー</li></ul>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) オリオンビール</strong>: ✓ 正解。1957年設立（沖縄ビール）→1959年に現社名。ブランド名は公募で採用。</li><li><strong>b) サザンビール</strong>: 誤り。「サザンビール」という沖縄の企業は一般に知られておらず、架空の選択肢と考えられる。</li><li><strong>c) ヘリオスビール</strong>: 誤り。ヘリオス酒造（名護市）は実在する沖縄の酒造メーカーで、泡盛「くら」やクラフトビールでも知られるが、1957年創業・2年後に社名変更という経緯はオリオンビールのものであり、この問題の正解ではない。</li><li><strong>d) ニヘデビール</strong>: 誤り。「ニヘデ（にふぇーでーびる）」は沖縄方言で「ありがとうございます」を意味する言葉。架空の選択肢。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「1957年・沖縄ビール設立→公募でオリオン→1959年に社名もオリオン」</strong> の3ステップで覚える</li><li>沖縄の本土復帰は<strong>1972年</strong>。それ以前の設立のため、日本の酒税法外で創業できた点が特殊</li><li>「オリオン」は公募で決まった名前。命名の由来は星座。ブランドの親しみやすさの源泉</li><li><strong>ヘリオスビールは実在する</strong> 沖縄のメーカーで混同しやすい。「1957年・社名変更」はオリオンの話</li><li>近年の資本変遷：アサヒ提携（2002年）→野村・カーライルに買収（2019年）も覚えておくと発展問題に対応できる</li></ul>"},{"id":"010","category":"ブランド・銘柄","subcategory":"アメリカのクラフトビール","difficulty":"応用","topic":"スチームビール・アンカー","keywords":["スチームビール","アンカー","Anchor Brewing","クラフトビール","カリフォルニア","フリッツ・メイタグ","アメリカンラガー酵母"],"title":"スチームビールの代表ブランド──アンカーとクラフトビールの原点","questionText":"現代のクラフトビールの始まりと言われるアメリカのスチームビールの代表的ブランドは何か、次の選択肢より選べ。（2019年）","choices":[{"key":"a","text":"グリーンフラッシュ"},{"key":"b","text":"アンカー"},{"key":"c","text":"シエラネバダ"},{"key":"d","text":"ラグニタス"}],"answer":"b) アンカー","answerKey":"b","explanationHtml":"<h3>なぜ正解か</h3>\n<p>スチームビールの代表ブランドは<strong>アンカー（Anchor Brewing Company）</strong>の「<strong>アンカースチーム</strong>」である。1965年にフリッツ・メイタグが経営を引き継いで再建し、アメリカのクラフトビール運動の先駆けとして広く知られる。「スチームビール」の名称は、樽を開栓する際に蒸気機関車のような「プシュー」という音が出たことに由来するとされる。</p>\n<h3>背景知識</h3>\n<h4>スチームビールとはどんなスタイルか</h4>\n<p>スチームビールはアメリカ・カリフォルニア州発祥のビアスタイルで、<strong>エール酵母（上面発酵酵母）をラガー（低温）発酵の温度帯に近い条件で使用</strong>するという独特の醸造法が特徴。19世紀のゴールドラッシュ期、冷蔵設備がなかったカリフォルニアで生まれた苦肉の醸造法が起源とされる。</p>\n<table><tr><th>特徴</th><th>内容</th></tr><tr><td>酵母</td><td>ラガー酵母（低温でも活発に働く株）</td></tr><tr><td>発酵温度</td><td>14〜21℃（通常ラガーより高め）</td></tr><tr><td>発酵方式</td><td>底面発酵（ラガー）に近いが温度はエール寄り</td></tr><tr><td>色</td><td>琥珀色</td></tr><tr><td>風味</td><td>フルーティー＋モルトの甘み、ホップの程よい苦味</td></tr></table>\n<h4>アンカー・ブルーイングの歴史</h4>\n<ul><li><strong>1896年</strong>: サンフランシスコでAnchro Brewing Company設立</li><li><strong>1965年</strong>: フリッツ・メイタグ（Fritz Maytag）が経営破綻寸前の醸造所を買収・再建</li><li><strong>1970年代〜</strong>: 品質向上に取り組み、アメリカのクラフトビール運動の先駆けとなる</li><li><strong>「アンカースチーム」</strong>は\"California Common\"スタイルの商標として登録されており、Anchor以外がこの名称を使えない（他社は\"California Common\"と表記）</li></ul>\n<h4>「スチーム」の名前の由来（諸説あり）</h4>\n<p>1. 樽を開栓した際の蒸気音（最も有力）</p>\n<p>2. 冷蔵設備がない時代、屋上の浅い発酵槽で夜風にさらして冷やす際に湯気（スチーム）が立ったから</p>\n<p>3. 発酵中の高炭酸圧から生じる蒸気に由来</p>\n<h4>アメリカのクラフトビール主要ブランド比較</h4>\n<table><tr><th>ブランド</th><th>本拠地</th><th>代表スタイル</th></tr><tr><td><strong>アンカー（Anchor）</strong></td><td>サンフランシスコ、CA</td><td>スチームビール（California Common）</td></tr><tr><td>シエラネバダ（Sierra Nevada）</td><td>チコ、CA</td><td>ペールエール</td></tr><tr><td>グリーンフラッシュ（Green Flash）</td><td>サンディエゴ、CA</td><td>ウェストコーストIPA</td></tr><tr><td>ラグニタス（Lagunitas）</td><td>ペタルマ、CA</td><td>IPA</td></tr></table>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) グリーンフラッシュ</strong>: 誤り。カリフォルニア州サンディエゴのクラフトビールブランド。IPAで知られる。スチームビールとは無関係。</li><li><strong>b) アンカー</strong>: ✓ 正解。Anchor Brewing Companyの「アンカースチーム」はスチームビールの代名詞であり、アメリカクラフトビール運動の先駆け。</li><li><strong>c) シエラネバダ</strong>: 誤り。1980年創業のカリフォルニアのクラフトビール先駆者だが、代表作は「ペールエール」。スチームビールブランドではない。</li><li><strong>d) ラグニタス</strong>: 誤り。カリフォルニア州のIPAで知られるブランド。スチームビールとは関係ない。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「アンカー＝スチーム＝クラフトの原点」</strong>：この三点セットで覚える</li><li>「スチーム」の由来：<strong>開栓時の蒸気音</strong>が最も試験に出やすい説明</li><li><strong>カリフォルニア・コモン（California Common）</strong>はスチームビールの別名・スタイル名。Anchor以外のメーカーはこちらを使う</li><li>フリッツ・メイタグの名前も頻出：1965年に経営再建しクラフトビール運動を牽引</li><li>公式テキスト75・103ページ（2022年5月改訂版）出典。2019年出題実績あり</li></ul>"},{"id":"010","category":"歴史・文化","subcategory":"ビール提供・サービス文化","difficulty":"発展","topic":"日本の著名な注ぎ手","keywords":["注ぎ手","灘コロンビア","ビアライゼ98","銀座ライオン","キリンシティ","ビールスタンド重富","ビアバー","サービス文化"],"title":"日本のビール文化を支える著名な注ぎ手とビアスタンド","questionText":"「灘コロンビア」「ビアライゼ'98」「銀座ライオン」「キリンシティ」「ビールスタンド重富」。各店に共通する特徴として最も適しているものを、次の選択肢より選べ。（2017年）","choices":[{"key":"a","text":"有名な注ぎ手が輩出もしくは在籍している"},{"key":"b","text":"常時20種類以上のビールを提供している"},{"key":"c","text":"マイクロブルワリーを併設している"},{"key":"d","text":"大手ビール会社の子会社である"}],"answer":"a) 有名な注ぎ手が輩出もしくは在籍している","answerKey":"a","explanationHtml":"<h3>なぜ正解か</h3>\n<p>5店舗はいずれも、ビール好きのあいだで名の知られた「注ぎ手（ビールをサーブする職人）」と強く結びついている。</p>\n<table><tr><th>店名</th><th>注ぎ手</th></tr><tr><td>灘コロンビア（兵庫・灘）</td><td>新井徳司 氏</td></tr><tr><td>ビアライゼ'98（東京・神保町）</td><td>松尾光平 氏</td></tr><tr><td>銀座ライオン（東京・銀座）</td><td>海老原清 氏</td></tr><tr><td>キリンシティ（各地）</td><td>松本宏 氏</td></tr><tr><td>ビールスタンド重富（広島）</td><td>重富寛 氏</td></tr></table>\n<p>これらの注ぎ手はビールの泡立て・注ぎ方・温度管理などに独自の技術・哲学を持ち、「その人の注ぐビールを飲みに行く」という文化を生み出している。5店舗に共通する最大の特徴は種類の多さでも設備でもなく、この「人」の存在である。</p>\n<h3>背景知識</h3>\n<h4>日本における「注ぎ手」文化の意義</h4>\n<p>欧米では醸造所・ブランドそのものへの注目が強いが、日本では「どう注ぐか」「誰が注ぐか」というサービス側の技術も重視される独自の文化がある。同じビールでもグラスの種類・角度・泡の比率・温度によって風味が大きく変わるため、熟練した注ぎ手の存在は付加価値として機能する。</p>\n<h4>各店・注ぎ手のプロフィール（概要）</h4>\n<ul><li><strong>新井徳司氏（灘コロンビア）</strong>: 1949年、東京駅近くで開業した老舗。注いだ生ビールの泡がきめ細かく「楊枝が立つ」と絶賛された伝説的注ぎ手。その技術は弟子の松尾光平氏に継承されており、師弟関係が有名。</li></ul>\n<ul><li><strong>松尾光平氏（ビアライゼ'98）</strong>: 東京・神保町の書店街に位置するビアバー。新井徳司氏の弟子として注ぎ方を継承。ドイツ流の泡立てにこだわり、ビール文化の啓発にも積極的。</li></ul>\n<ul><li><strong>海老原清氏（銀座ライオン）</strong>: サッポロビールが運営する銀座の老舗ビアホール。「海老原清が注ぐ日を目指して来店するファンが多い」と言われるほどの人気注ぎ手。</li></ul>\n<ul><li><strong>松本宏氏（キリンシティ）</strong>: キリンビールが展開するビアレストランチェーン「キリンシティ」在籍。「松本ラガーが飲みたい」とファンが集まる存在。「3度注ぎ」の技法で有名。</li></ul>\n<ul><li><strong>重富寛氏（ビールスタンド重富）</strong>: 広島のビールスタンドを経営。何種類もの注ぎ方が選べるスタイルで知られ、「二度注ぎ」など独自の注ぎ技術を体系化。YouTubeなどでの発信でも知られる。</li></ul>\n<h4>ビールの注ぎ方と泡の役割</h4>\n<p>ビールにおける泡（ヘッド）は単なる見た目ではなく、以下の機能を持つ：</p>\n<ul><li><strong>酸化防止</strong>: 泡がビール表面を覆い、空気（酸素）との接触を遮断する</li><li><strong>炭酸ガス保持</strong>: 炭酸が逃げるのを抑え、爽快感を維持する</li><li><strong>香り閉じ込め</strong>: 泡層がアロマを保持し、飲むたびに香りが広がる</li><li><strong>見た目・食欲</strong>: 白い泡はビールの新鮮さと品質の視覚的シグナル</li></ul>\n<p>理想的な泡の量は全体の約2〜3割とされるが、店や注ぎ手によって哲学が異なる。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 有名な注ぎ手が輩出もしくは在籍している</strong>: ✓ 正解。5店舗はいずれも著名な注ぎ手と結びついており、ビール好きのあいだでその名が知られている。</li><li><strong>b) 常時20種類以上のビールを提供している</strong>: 誤り。多品種提供はクラフトビアバーの特徴として語られるが、これら5店の「共通する最大の特徴」ではない。特にビールスタンド重富のような店は品種よりも注ぎ方に特化している。</li><li><strong>c) マイクロブルワリーを併設している</strong>: 誤り。5店のいずれも自家醸造（ブルーパブ）を主な特徴としていない。銀座ライオン・キリンシティは大手ビール会社の運営であり、自社醸造とは異なる。</li><li><strong>d) 大手ビール会社の子会社である</strong>: 誤り。銀座ライオン（サッポロ）・キリンシティ（キリン）は大手系列だが、灘コロンビア・ビアライゼ'98・ビールスタンド重富は独立系であり、全店に共通する特徴ではない。</li></ul>\n<h3>覚え方・関連事項</h3>\n<p><strong>店名→注ぎ手の対応表（公式テキスト128ページ掲載）を丸ごと覚える</strong>のが最短：</p>\n<table><tr><th>店名</th><th>地域</th><th>注ぎ手</th></tr><tr><td>灘コロンビア</td><td>兵庫</td><td><strong>新井</strong>徳司</td></tr><tr><td>ビアライゼ'98</td><td>東京（神保町）</td><td><strong>松尾</strong>光平</td></tr><tr><td>銀座ライオン</td><td>東京（銀座）</td><td><strong>海老原</strong>清</td></tr><tr><td>キリンシティ</td><td>全国</td><td><strong>松本</strong>宏</td></tr><tr><td>ビールスタンド重富</td><td>広島</td><td><strong>重富</strong>寛</td></tr></table>\n<ul><li>語呂：「<strong>新松海松重</strong>（しんまつかいまつしげ）」— 新井・松尾・海老原・松本・重富の苗字の頭文字</li><li>公式テキスト（2022年5月改訂版）128ページが出典。出題年は2017年で、近年の改訂版にも引き続き掲載されている重要事項</li><li>「注ぎ手」という概念はビール文化・サービス技術の観点から検定で頻出のトピック</li></ul>"},{"id":"010","category":"歴史・文化","subcategory":"日本ビール史・容器","difficulty":"基礎","topic":"日本初の缶ビール","keywords":["アサヒビール","缶ビール","1958年","昭和33年","3ピース缶","缶切り","日本ビール史","容器"],"title":"日本初の缶ビール：1958年アサヒビールの3ピース缶","questionText":"今や家庭で飲まれているビールの大半は缶ビールとなった。日本で最初に缶ビールを発売したメーカーを次の選択肢より選べ。（2012）","choices":[{"key":"a","text":"アサヒビール"},{"key":"b","text":"キリンビール"},{"key":"c","text":"サッポロビール"},{"key":"d","text":"サントリー"}],"answer":"a) アサヒビール","answerKey":"a","explanationHtml":"<h3>なぜ正解か</h3>\n<p>日本で最初の缶ビールは<strong>1958（昭和33）年にアサヒビール</strong>から発売された。当時の缶は「<strong>3ピース缶</strong>」と呼ばれる構造で、上蓋・胴・底蓋の3パーツで構成されており、上蓋に<strong>缶切りで2か所穴を開けて飲む</strong>方式だった（現代のプルタブ式とは全く異なる）。</p>\n<h3>背景知識</h3>\n<h4>日本の缶ビール開発の背景</h4>\n<ul><li>缶ビールはアメリカで1935年に初めて登場（クルーガー・ブルーイング社）</li><li>日本への缶ビール導入は戦後の技術発展と生活様式の変化を受け、1950年代後半に実現</li><li>アサヒビールは「缶という新容器で市場を開拓する」先行者利益を狙い、1958年に国内初の缶ビールを発売</li></ul>\n<h4>缶ビールの容器進化の歴史</h4>\n<table><tr><th>時代</th><th>缶の種類</th><th>開け方</th><th>特徴</th></tr><tr><td><strong>1958年〜</strong></td><td><strong>3ピース缶</strong></td><td><strong>缶切りで2穴</strong></td><td>上蓋・胴・底蓋の3部品。飲むには缶切りが必要</td></tr><tr><td>1960年代〜</td><td>3ピース缶（プルタブ）</td><td>プルタブを引く</td><td>タブを引いてリングごと切り取る方式。タブのポイ捨て問題が発生</td></tr><tr><td>1980年代〜</td><td>ステイオンタブ缶</td><td>タブを折り込む</td><td>タブが缶から離れない設計。現在の主流</td></tr><tr><td>現在</td><td>2ピース缶（DI缶）</td><td>ステイオンタブ</td><td>胴と底が一体成形。より軽量・製造効率が高い</td></tr></table>\n<p><strong>3ピース缶の構造</strong>：</p>\n<ul><li>上蓋（エンド）・胴（ボディ）・底蓋（エンド）を巻き締めて接合</li><li>縦方向に溶接シーム（継ぎ目）がある</li><li>現代の主流「2ピース缶（DI缶：Draw and Iron）」は胴と底が一体成形で縦の継ぎ目がない</li></ul>\n<h4>日本の大手ビールメーカーの「日本初」一覧</h4>\n<p>試験では各社の「日本初・業界初」の出来事が問われやすい。</p>\n<table><tr><th>出来事</th><th>メーカー</th><th>年</th></tr><tr><td>日本初の缶ビール</td><td><strong>アサヒビール</strong></td><td><strong>1958年</strong></td></tr><tr><td>業界初の中びん（500ml）</td><td>宝酒造</td><td>1957年（問008参照）</td></tr><tr><td>日本初のドライビール</td><td>アサヒビール（スーパードライ）</td><td>1987年</td></tr><tr><td>国内初の発泡酒（大規模商業）</td><td>サントリー（ホップス）</td><td>1994年</td></tr></table>\n<h4>缶ビールが普及した背景</h4>\n<ul><li><strong>軽量・持ち運び便利</strong>：瓶に比べて軽く、割れない</li><li><strong>光遮断性</strong>：茶色瓶と同等以上の光遮断効果で光臭が発生しない（問007参照）</li><li><strong>冷却効率</strong>：金属缶は熱伝導率が高く素早く冷える</li><li><strong>リサイクル性</strong>：アルミ缶は高いリサイクル率（日本は世界トップレベルの約95%）</li><li><strong>家庭用需要の拡大</strong>：高度経済成長期に冷蔵庫が普及し、自宅でのビール保存が一般化</li></ul>\n<h4>アサヒビールの主な「日本初」</h4>\n<ul><li><strong>1958年</strong>：日本初の缶ビール発売</li><li><strong>1987年</strong>：「アサヒスーパードライ」発売。辛口ドライビールブームを牽引し、それまでキリンが持っていた業界首位をのちに奪取する転換点となった</li></ul>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) アサヒビール</strong>: ✓ 正解。1958（昭和33）年に日本初の缶ビールを3ピース缶で発売。</li><li><strong>b) キリンビール</strong>: 誤り。1888年に「キリンビール」を発売した老舗で、長年業界シェア首位を誇ったが、缶ビールの「日本初」はアサヒ。</li><li><strong>c) サッポロビール</strong>: 誤り。1876年創業の国内最古級の醸造所を持つが、日本初の缶ビールとは無関係。</li><li><strong>d) サントリー</strong>: 誤り。ビール参入は1963年（問008参照）。日本初の缶ビール発売（1958年）より後に参入しており、そもそもビール事業開始前。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「1958年・アサヒ・3ピース缶・缶切り2穴」の4点セット</strong>で覚える</li><li><strong>昭和33年</strong>：「33（サンサン）」と「缶（カン）」で語呂を作る（サンサン→缶ビール）</li><li>問008（宝酒造の中びん：1957年）と本問（アサヒの缶ビール：1958年）は<strong>1年違い</strong>で出題しやすい。「中びんが先（57年）、缶が後（58年）」と順番を整理する</li><li><strong>「3ピース缶＝缶切りが必要」</strong>：現代の常識と逆転した事実として記憶に残りやすい</li><li>缶ビールが光臭を防ぐ理由（問007）、現代の缶の容量（350ml・500mlが主流）など周辺知識とセットで学習すると理解が深まる</li><li>出典：<strong>公式テキスト126ページ</strong>（2022年5月改訂版）</li></ul>"},{"id":"011","category":"法規制","subcategory":"酒税法・添加物","difficulty":"基礎","topic":"ビールの着色料・カラメル","keywords":["カラメル","着色料","酒税法","カラメル麦芽","ウコン色素","クチナシ色素","食品添加物","ビール原料"],"title":"ビールの着色料：酒税法で認められるカラメル","questionText":"日本の酒税法でビールの着色料として使用が認められているものを次の選択肢より選べ。（2012）","choices":[{"key":"a","text":"食用黄色5号"},{"key":"b","text":"ウコン色素"},{"key":"c","text":"カラメル"},{"key":"d","text":"クチナシ色素"}],"answer":"c) カラメル","answerKey":"c","explanationHtml":"<h3>なぜ正解か</h3>\n<p>日本の酒税法上、ビールの製造に使用できる<strong>着色料はカラメルのみ</strong>と規定されている。カラメルはデンプン由来の糖を加熱・褐変させた加工食品であり、ビールに色・味・香りを付与する天然由来の着色料として長年使用が認められている。食用合成色素（食用黄色5号など）や他の天然色素（ウコン・クチナシ）はビールへの使用が許可されていない。</p>\n<h3>背景知識</h3>\n<h4>カラメルとは</h4>\n<ul><li><strong>製造方法</strong>：デンプン（トウモロコシ・サトウキビ等）から得た糖（ブドウ糖・ショ糖等）を高温加熱して褐変（カラメル化）させた物質</li><li><strong>外観</strong>：濃い茶褐色の液体または固体</li><li><strong>付与する特性</strong>：</li></ul>  - 色（琥珀〜黒褐色）\n<p>  - 焦げたような甘い香り（カラメル香）</p>\n<p>  - わずかな苦みと甘みのある風味</p>\n<ul><li><strong>食品添加物としての分類</strong>：天然由来の着色料（食品添加物として認可）</li></ul>\n<h4>カラメル麦芽との関係</h4>\n<p>ビールには「<strong>カラメル麦芽</strong>（クリスタル麦芽）」という原料がある。これは発芽した大麦を特殊な方法で乾燥・焙煎する際に、麦粒内部でデンプンが糖化・カラメル化されたもの。</p>\n<table><tr><th>比較項目</th><th>カラメル（着色料）</th><th>カラメル麦芽</th></tr><tr><td>位置づけ</td><td>酒税法上の添加物（着色料）</td><td>ビールの原料（麦芽の一種）</td></tr><tr><td>製造方法</td><td>糖を高温加熱・褐変</td><td>発芽大麦を特殊焙煎</td></tr><tr><td>含まれる成分</td><td>カラメル色素</td><td>カラメル色素＋デキストリン等</td></tr><tr><td>ビールへの効果</td><td>色・風味の調整</td><td>色・甘み・ボディ感・泡持ちの向上</td></tr><tr><td>主な使用スタイル</td><td>黒ビール・スタウトの補助</td><td>レッドエール・スコティッシュエール等</td></tr></table>\n<h4>日本の酒税法におけるビールの原料規定</h4>\n<p>日本の酒税法（旧法・2018年改正後含む）ではビールに使用できる原料・添加物が厳格に規定されている。</p>\n<p><strong>主な許可原料（2018年改正後）</strong>：</p>\n<ul><li>麦芽・大麦・小麦・米・とうもろこし・こうりゃん・ばれいしょ・でん粉・糖類（麦芽比率規制あり）</li><li>ホップ</li><li>水</li><li>果実・果汁・野菜・香辛料・ハーブ・花・茶・コーヒー等（2018年改正で追加）</li></ul>\n<p><strong>許可されている添加物（着色料）</strong>：</p>\n<ul><li><strong>カラメルのみ</strong>（着色を目的とした添加物として）</li></ul>\n<p>食用合成色素・天然色素（ウコン・クチナシ等）はビールへの使用が許可されていない。これはビールの品質・透明性・伝統的製法を守るための規制である。</p>\n<h4>各選択肢の色素について</h4>\n<p><strong>食用黄色5号（タートラジン）</strong>：</p>\n<ul><li>合成着色料（アゾ系色素）</li><li>清涼飲料・菓子等に使用</li><li>ビールへの使用は不可</li></ul>\n<p><strong>ウコン色素（クルクミン）</strong>：</p>\n<ul><li>ショウガ科ウコン（ターメリック）の根茎から抽出した天然色素</li><li>カレー・マスタード等に使用。鮮やかな黄色</li><li>ビールへの使用は不可（酒税法上の着色料として未認可）</li></ul>\n<p><strong>クチナシ色素</strong>：</p>\n<ul><li>アカネ科クチナシの果実から抽出した天然色素</li><li>栗きんとん・たくあん等の着色に使用</li><li>黄色・赤色・青色など複数の色素が含まれる</li><li>ビールへの使用は不可</li></ul>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 食用黄色5号</strong>: 誤り。合成着色料であり、酒税法上ビールへの使用は認められていない。飲料・菓子類への使用例はあるが、ビールには不可。</li><li><strong>b) ウコン色素</strong>: 誤り。天然由来の色素だが、酒税法上ビールへの着色料としての使用は認められていない。</li><li><strong>c) カラメル</strong>: ✓ 正解。酒税法上、ビールに使用できる唯一の着色料。デンプン由来の糖を加熱した天然由来の加工食品。</li><li><strong>d) クチナシ色素</strong>: 誤り。天然由来の色素だが、ウコン色素と同様にビールへの使用は認められていない。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「カラメル＝唯一の選択肢」</strong>：ビールの着色料として許可されているのはカラメルだけ、と一点突破で覚える</li><li><strong>合成vs天然に関係なくカラメル以外はNG</strong>：食用黄色5号（合成）も、ウコン・クチナシ（天然）も不可。「天然だから大丈夫」という思い込みに注意</li><li><strong>カラメル色素とカラメル麦芽の違い</strong>：前者は「添加物」、後者は「原料（麦芽）」であり試験で混同しやすい。「添加物としてのカラメル」と「原料としてのカラメル麦芽」を区別する</li><li><strong>コーヒーや果実は2018年改正で追加</strong>：改正前後でビールの定義・許可原料が変わっており、出題年（2012年）と現行法の違いに注意が必要な場合がある</li><li>出典：<strong>公式テキスト30ページ</strong>（2022年5月改訂版）</li></ul>"},{"id":"011","category":"ビアスタイル","subcategory":"ラガー","difficulty":"基礎","topic":"ラガーの語源","keywords":["ラガー","Lagern","貯蔵","下面発酵","ドイツ語語源","熟成","低温発酵"],"title":"「ラガー」はドイツ語で何を意味するか","questionText":"ラガービールの「ラガー」はドイツ語の「Lagern」を語源とするが、どのような意味があるか、適切なものを次の選択肢より選べ。（2019年）","choices":[{"key":"a","text":"熱処理"},{"key":"b","text":"濾過"},{"key":"c","text":"貯蔵"},{"key":"d","text":"ラグビー選手"}],"answer":"c) 貯蔵","answerKey":"c","explanationHtml":"<h3>なぜ正解か</h3>\n<p>「<strong>Lagern（ラーゲルン）</strong>」はドイツ語で「<strong>貯蔵する・蓄える</strong>」を意味する動詞である。ラガービールは発酵後に低温（0〜4℃程度）で数週間〜数ヶ月にわたって<strong>貯蔵・熟成（ラグリング）</strong>させることで、雑味が取れてクリアですっきりとした味わいになる。この貯蔵工程こそがラガーの名前の由来であり、醸造上の最大の特徴でもある。</p>\n<h3>背景知識</h3>\n<h4>ラガーの醸造工程</h4>\n<table><tr><th>工程</th><th>内容</th></tr><tr><td>発酵</td><td>下面発酵酵母を使用、低温（5〜12℃）でゆっくり発酵</td></tr><tr><td><strong>ラグリング（貯蔵・熟成）</strong></td><td><strong>0〜4℃で数週間〜数ヶ月保管。Lagern（貯蔵）がここに由来</strong></td></tr><tr><td>効果</td><td>ダイアセチル（バター臭）などの副産物が減少、味がまろやかになる</td></tr></table>\n<h4>エールとラガーの比較</h4>\n<table><tr><th>項目</th><th>エール（上面発酵）</th><th>ラガー（下面発酵）</th></tr><tr><td>酵母の位置</td><td>発酵液の上部に集まる</td><td>発酵タンクの底に沈む</td></tr><tr><td>発酵温度</td><td>15〜25℃（高め）</td><td>5〜12℃（低め）</td></tr><tr><td>貯蔵期間</td><td>比較的短い</td><td>長期低温熟成（Lagern）</td></tr><tr><td>風味</td><td>フルーティー・複雑</td><td>すっきり・クリア</td></tr><tr><td>代表スタイル</td><td>ペールエール、スタウト</td><td>ピルスナー、ヘレス、ボック</td></tr></table>\n<h4>ドイツ語のビール関連用語</h4>\n<table><tr><th>ドイツ語</th><th>読み</th><th>意味</th></tr><tr><td><strong>Lagern</strong></td><td>ラーゲルン</td><td>貯蔵する</td></tr><tr><td>Bier</td><td>ビア</td><td>ビール</td></tr><tr><td>Hefe</td><td>ヘーフェ</td><td>酵母</td></tr><tr><td>Malz</td><td>マルツ</td><td>麦芽</td></tr><tr><td>Hopfen</td><td>ホップフェン</td><td>ホップ</td></tr><tr><td>Weizen</td><td>ヴァイツェン</td><td>小麦</td></tr></table>\n<h4>「ラガー」という語の英語への定着</h4>\n<p>ドイツ移民がアメリカに持ち込んだラガー醸造技術により、19世紀後半から「Lager」という語が英語圏でも定着。現在では世界で最も消費されるビアスタイルであり、日本の大手ビールメーカーが製造するビールもほぼすべてラガー（厳密にはピルスナータイプ）に分類される。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 熱処理</strong>: 誤り。熱処理（パストゥリゼーション）はビールの殺菌工程を指す別の概念。日本では「熱処理ビール」と「生ビール（非熱処理）」の区分で使われる用語。</li><li><strong>b) 濾過</strong>: 誤り。濾過はビールから酵母・タンパク質を除去する工程。Lagernとは無関係。</li><li><strong>c) 貯蔵</strong>: ✓ 正解。Lagern＝貯蔵する。低温での長期熟成工程がラガーの名の由来。</li><li><strong>d) ラグビー選手</strong>: 誤り。英語の「rugger（ラガー）」は確かにラグビー選手を意味するが、ビールのLager（ラガー）とは語源が全く異なる。引っかけとして設定された誤答。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「ラガー＝貯蔵」</strong>：ドイツ語Lagern→貯蔵→低温熟成→すっきりした味、という流れで覚える</li><li>「倉庫（storage）」を意味するドイツ語<strong>Lager（ラーガー）</strong>も同じ語根。軍事用語「弾薬庫（Munitionslager）」にも同じ語が使われる</li><li>選択肢dの「ラグビー選手」は英語の綴りが\"rugger\"で、ビールの\"lager\"とは別物</li><li>公式テキスト95ページ（2022年5月改訂版）出典。2019年出題実績あり</li><li>関連問題：エール vs ラガーの発酵温度・酵母位置の違いもセットで押さえておく</li></ul>"},{"id":"011","category":"歴史・文化","subcategory":"日本ビール史","difficulty":"発展","topic":"大阪麦酒会社の創業","keywords":["大阪麦酒会社","鳥井駒吉","明治22年","1889年","春駒","アサヒビール","大日本麦酒","明治ビール史"],"title":"大阪麦酒会社の創業者：鳥井駒吉と明治の大阪ビール産業","questionText":"1889（明治22）年、大阪で設立された大阪麦酒会社の創業者は誰か、次の選択肢より選べ。（2019年）","choices":[{"key":"a","text":"岩崎弥太郎"},{"key":"b","text":"新渡戸稲造"},{"key":"c","text":"鳥井駒吉"},{"key":"d","text":"村橋久成"}],"answer":"c) 鳥井駒吉","answerKey":"c","explanationHtml":"<h3>なぜ正解か</h3>\n<p>大阪
