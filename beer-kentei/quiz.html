・堺で清酒「春駒」を醸造していた蔵元の鳥井駒吉（とりい こまきち）が中心となり、1889年（明治22年）に大阪麦酒会社を創業した。清酒醸造で培った発酵技術と経営基盤を活かしてビール事業に参入した事例である。大阪麦酒会社はその後「アサヒビール」ブランドの源流となる重要な企業である。</p>\n<h3>背景知識</h3>\n<h4>大阪麦酒会社の沿革</h4>\n<table><tr><th>年</th><th>出来事</th></tr><tr><td>1889年（明治22）</td><td>鳥井駒吉らにより大阪麦酒会社設立</td></tr><tr><td>1892年</td><td>「アサヒビール」ブランドを発売</td></tr><tr><td>1906年</td><td>日本麦酒・札幌麦酒と合併し「大日本麦酒」設立</td></tr><tr><td>1949年</td><td>GHQの財閥解体・集中排除により大日本麦酒が分割 → 朝日麦酒（現アサヒビール）と日本麦酒（後のサッポロビール）に分離</td></tr></table>\n<h4>鳥井駒吉とは</h4>\n<p>鳥井駒吉は大阪・堺の清酒蔵元。清酒「春駒」で知られる酒造家であり、明治期の産業発展の機運の中でビール醸造に乗り出した。清酒とビールは発酵という共通点を持ちながら原料・製法が異なるが、発酵管理のノウハウが参入の背景にある。</p>\n<p>なお、同じ「鳥井」姓の<strong>鳥井信治郎</strong>（サントリー創業者）は全くの別人である。試験では混同注意。</p>\n<h4>明治期の主要ビール会社と創業者</h4>\n<table><tr><th>会社</th><th>創業年</th><th>創業者・主要人物</th><th>現在の系譜</th></tr><tr><td>開拓使麦酒醸造所</td><td>1876年</td><td>村橋久成・中川清兵衛</td><td>サッポロビール</td></tr><tr><td>ジャパン・ブルワリー（横浜）</td><td>1885年</td><td>外国資本</td><td>キリンビール</td></tr><tr><td>大阪麦酒会社</td><td>1889年</td><td><strong>鳥井駒吉</strong></td><td>アサヒビール</td></tr><tr><td>日本麦酒醸造会社</td><td>1890年</td><td>馬越恭平ら</td><td>サッポロビール（大日本麦酒経由）</td></tr></table>\n<h4>大日本麦酒とその解体</h4>\n<p>1906年に大阪麦酒・日本麦酒・札幌麦酒が合併して「大日本麦酒」が誕生し、国内シェアの約7割を占める巨大企業となった。しかしGHQ占領期の1949年に独占禁止法の観点から朝日麦酒と日本麦酒（後のサッポロ）に分割された。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 岩崎弥太郎</strong>: 誤り。岩崎弥太郎（1835〜1885）は三菱財閥の創始者。海運・金融・鉱山事業で知られる明治の実業家だが、ビール産業への直接的な関与は知られていない。また1889年より前の1885年に没している。</li><li><strong>b) 新渡戸稲造</strong>: 誤り。新渡戸稲造（1862〜1933）は「武士道」の著者・農業経済学者・教育者で、札幌農学校（現北海道大学）出身。北海道のビール産業（開拓使）と地域的なつながりはあるが、大阪麦酒会社の創業者ではない。</li><li><strong>c) 鳥井駒吉</strong>: ✓ 正解。大阪・堺の清酒「春駒」蔵元。1889年に大阪麦酒会社を設立し、アサヒビールの源流を作った。</li><li><strong>d) 村橋久成</strong>: 誤り。村橋久成（むらはし ひさなり）は開拓使麦酒醸造所（現サッポロビール前身）の創設に関わった人物（1876年・札幌）。大阪麦酒ではなく北海道・サッポロ系統の人物。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>大阪麦酒＝鳥井駒吉＝清酒「春駒」</strong> の3点セットで覚える</li><li><strong>鳥井信治郎（サントリー）と混同しない</strong>：同じ「鳥井」でも全くの別人・別会社</li><li>村橋久成は「札幌（開拓使）」、鳥井駒吉は「大阪」と地域で区別する</li><li>大阪麦酒 → アサヒビール → 大日本麦酒（合併）→ 朝日麦酒（分割）という流れをつかんでおくと関連問題に対応しやすい</li><li>公式テキスト（2022年5月改訂版）111ページに記載</li></ul>"},{"id":"012","category":"醸造工程","subcategory":"ホップ","difficulty":"応用","topic":"イソアルファ酸・ホップの苦味","keywords":["イソアルファ酸","アルファ酸","異性化","煮沸","ホップ","苦味物質","IBU"],"title":"煮沸で生成されるホップ由来の苦味物質","questionText":"麦汁煮沸での熱変化により生成されるホップ由来の苦味物質を、次の選択肢より選べ。（2017年）","choices":[{"key":"a","text":"α‐アミラーゼ"},{"key":"b","text":"イソアルファ酸"},{"key":"c","text":"酢酸イソアミル"},{"key":"d","text":"ペプチド"}],"answer":"b) イソアルファ酸","answerKey":"b","explanationHtml":"<h3>なぜ正解か</h3>\n<p>ホップをそのまま麦汁に添加しただけでは苦味はほとんど生まれない。ホップに含まれる<strong>アルファ酸（フムロン類）</strong>が麦汁の煮沸（通常60〜90分）によって熱変化を受け、<strong>イソアルファ酸（イソフムロン類）</strong>へと<strong>異性化</strong>されることで初めて苦味を持つ。このイソアルファ酸がビールの苦味の主成分であり、IBU（国際苦味単位）もイソアルファ酸の濃度を基準に算出される。</p>\n<h3>背景知識</h3>\n<h4>アルファ酸からイソアルファ酸への変化</h4>\n<pre><code>ホップのアルファ酸（フムロン）\n<p>        ↓ 煮沸（熱による異性化）</p>\n<p>    イソアルファ酸（イソフムロン）</p>\n<p>        → ビールの主要苦味成分&lt;/code&gt;&lt;/pre&gt;</p>\n<table><tr><th>物質</th><th>状態</th><th>苦味</th></tr><tr><td>アルファ酸</td><td>煮沸前</td><td>ほぼなし</td></tr><tr><td><strong>イソアルファ酸</strong></td><td><strong>煮沸後</strong></td><td><strong>あり（ビールの苦味の主成分）</strong></td></tr></table>\n<p>異性化率（アルファ酸がイソアルファ酸に変換される割合）は<strong>20〜35%程度</strong>にとどまる。煮沸時間が長いほど、またホップの添加タイミングが早いほど異性化率は上がり、苦味が増す。</p>\n<h4>ホップの主な成分と役割</h4>\n<table><tr><th>成分</th><th>役割</th></tr><tr><td><strong>アルファ酸（フムロン類）</strong></td><td>煮沸でイソアルファ酸に変化→苦味の源</td></tr><tr><td>ベータ酸</td><td>抗菌作用あり、苦味への貢献は少ない</td></tr><tr><td>精油成分（テルペン類等）</td><td>ホップアロマ（香り）の源。煮沸で揮発するためアロマホップは後添加</td></tr><tr><td>タンニン</td><td>タンパク質と結合し清澄化に貢献</td></tr></table>\n<h4>ビタリングホップとアロマホップ</h4>\n<p>ホップの添加タイミングにより目的が変わる：</p>\n<ul><li><strong>ビタリングホップ</strong>：煮沸開始直後〜60分前に添加。十分に異性化させ苦味を引き出す</li><li><strong>アロマホップ</strong>：煮沸終了直前〜終了後に添加（ドライホッピング含む）。香り成分を揮発させずに残す</li></ul>\n<h4>各選択肢の物質の正体</h4>\n<table><tr><th>物質</th><th>本来の役割</th></tr><tr><td>α‐アミラーゼ</td><td>デンプンを分解する酵素。糖化工程で活躍（ホップ由来ではない）</td></tr><tr><td><strong>イソアルファ酸</strong></td><td>ホップ由来の苦味物質（正解）</td></tr><tr><td>酢酸イソアミル</td><td>酵母が発酵時に生成する香り物質（バナナ様の香り）。ヴァイツェンに多い</td></tr><tr><td>ペプチド</td><td>タンパク質の断片。泡の安定性に関係するが苦味物質ではない</td></tr></table>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) α‐アミラーゼ</strong>: 誤り。糖化工程（マッシング）で麦芽デンプンをマルトースに分解する酵素。ホップ由来でも苦味物質でもない。</li><li><strong>b) イソアルファ酸</strong>: ✓ 正解。アルファ酸が煮沸により異性化して生成。ビールの苦味の主成分でIBUの算出基準。</li><li><strong>c) 酢酸イソアミル</strong>: 誤り。酵母が発酵中に生成するエステル系香気物質。バナナ・洋ナシに似た香りでヴァイツェンの特徴的な香り成分。ホップ由来でも苦味物質でもない。</li><li><strong>d) ペプチド</strong>: 誤り。タンパク質が分解されたアミノ酸の短鎖。麦芽由来で泡の持続性に貢献するが、苦味物質ではない。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「アルファ酸→煮沸→イソアルファ酸→苦味」</strong>：この変換の流れを一直線で覚える</li><li><strong>「イソ」は「異性化」のイソ</strong>：同じ分子式で構造が変わる「異性体（isomer）」から名付けられた</li><li>IBU問題（問題004）と連動：IBUはイソアルファ酸の量で決まる苦さの指標</li><li>α‐アミラーゼは「糖化」、酢酸イソアミルは「発酵香（バナナ）」、ペプチドは「泡」と対応させて整理すると誤答を確実に消せる</li><li>2017年出題実績あり</li></ul>"},{"id":"012","category":"ビアスタイル","subcategory":"ラガー","difficulty":"基礎","topic":"ラガーの語源","keywords":["ラガー","Lagern","貯蔵","下面発酵","ラガー酵母","低温熟成","ドイツ語","ラガリング"],"title":"ラガーの語源：「Lagern（ラーゲルン）」の意味","questionText":"ラガービールの「ラガー」はドイツ語の「Lagern」を語源とするが、どのような意味があるが、適切なものを次の選択肢より選べ。（2019年）","choices":[{"key":"a","text":"熱処理"},{"key":"b","text":"濾過"},{"key":"c","text":"貯蔵"},{"key":"d","text":"ラグビー選手"}],"answer":"c) 貯蔵","answerKey":"c","explanationHtml":"<h3>なぜ正解か</h3>\n<p>ドイツ語の <strong>「Lagern（ラーゲルン）」</strong> は「貯蔵する・蓄える」を意味する動詞で、英語の \"to store\" に相当する。ラガービールはこの「低温での長期貯蔵（熟成）工程」に由来して名付けられた。製造工程において、発酵後に0℃前後の低温で数週間〜数ヶ月間貯蔵・熟成させることを <strong>ラガリング（Lagering）</strong> と呼び、これがスタイル名の直接の起源である。</p>\n<h3>背景知識</h3>\n<h4>ラガーとエールの二大分類</h4>\n<p>ビールは発酵方式によって大きく二つに分類される。</p>\n<table><tr><th>種別</th><th>発酵酵母</th><th>発酵温度</th><th>代表スタイル</th></tr><tr><td><strong>ラガー（下面発酵）</strong></td><td><em>Saccharomyces pastorianus</em></td><td>5〜15℃</td><td>ピルスナー、ヘレス、ボック</td></tr><tr><td><strong>エール（上面発酵）</strong></td><td><em>Saccharomyces cerevisiae</em></td><td>15〜25℃</td><td>IPA、スタウト、ヴァイツェン</td></tr></table>\n<p>ラガー酵母は発酵後に容器の底に沈降する（下面発酵）という特性を持つ。</p>\n<h4>ラガーの歴史的背景</h4>\n<p>ラガービールの誕生は19世紀のバイエルン（南ドイツ）にさかのぼる。当時の醸造業者は、夏の醸造中に雑菌や野生酵母によるビールの腐敗に悩まされていた。そこでバイエルンの醸造家たちは、冬季にアルプスの洞窟や地下貯蔵庫（Lagerkeller）に雪や氷を蓄え、低温環境で発酵・熟成させる技術を発展させた。</p>\n<p>1842年にはボヘミア（現チェコ）のピルゼンで世界初のペールラガー＝<strong>ピルスナー・ウルケル</strong>が誕生し、その黄金色と澄んだ外観が世界中に広まった。19世紀後半に冷凍機が普及すると、低温環境を季節・地域に関わらず実現できるようになり、ラガービールは世界的に主流のスタイルへと成長した。</p>\n<h4>ラガリング工程の役割</h4>\n<p>低温貯蔵（ラガリング）には以下の効果がある。</p>\n<ul><li><strong>風味の洗練</strong>: 発酵中に生成されるジアセチル（バター臭）やアセトアルデヒドなどのオフフレーバーを酵母が再吸収し、クリーンな味わいになる</li><li><strong>炭酸ガスの自然飽和</strong>: 低温でCO₂がビールに溶け込み、きめ細かい炭酸感が生まれる</li><li><strong>タンパク・酵母の沈降</strong>: 濁りの原因物質が沈殿し、澄んだ外観になる</li></ul>\n<h4>現代のラガー</h4>\n<p>現在、世界で消費されるビールの約9割がラガー系スタイルとされる。日本の大手メーカー（アサヒ、キリン、サッポロ、サントリー）の主力製品もすべてラガー（下面発酵）であり、「ビール＝ラガー」という認識が一般的になっている。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 熱処理</strong>: パストリゼーション（低温殺菌）の工程を指す言葉であり、「Lagern」の意味ではない。熱処理ビールと生ビールの区別とは別の話。</li><li><strong>b) 濾過</strong>: 濾過はドイツ語で「Filtration（フィルトラツィオン）」。ラガーの語源とは無関係。</li><li><strong>c) 貯蔵</strong>: ✓ 正解。「Lagern」はドイツ語で「貯蔵する」を意味する。</li><li><strong>d) ラグビー選手</strong>: 英語の \"rugger\"（ラガー）と音が似ているが全くの誤り。ユーモアある選択肢として記憶の助けにはなる。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「ラガー＝ラーゲルン＝貯蔵」</strong> の三点セットで覚える。</li><li><strong>「ラガー酵母は下に沈む→下面発酵→低温・長期熟成→貯蔵（Lagern）」</strong> という一連の流れで理解すると定着しやすい。</li><li>「ラガー」はスタイル名であり、熱処理の有無（生ビール/熱処理ビール）とは独立した概念。試験では混同させる問題が出やすいので注意。</li><li>公式テキスト95ページ（2022年5月改訂版）に記載のある基礎知識。出題頻度が高く確実に取りたい。</li></ul>"},{"id":"012","category":"歴史・文化","subcategory":"ヨーロッパビール史","difficulty":"基礎","topic":"液体のパンと修道院醸造","keywords":["液体のパン","中世ヨーロッパ","修道院ビール","キリスト教","断食","栄養","修道士","ビール文化"],"title":"「液体のパン」：中世ヨーロッパにおけるビールの宗教的・栄養的位置づけ","questionText":"中世ヨーロッパでは、ワインは「キリストの血」とされていたが、ビールは何とされていたか、次の選択肢より選べ。（2019年）","choices":[{"key":"a","text":"キリストの汗"},{"key":"b","text":"液体のパン"},{"key":"c","text":"キリストの肉"},{"key":"d","text":"天使の輪（エンジェルリング）"}],"answer":"b) 液体のパン","answerKey":"b","explanationHtml":"<h3>なぜ正解か</h3>\n<p>中世ヨーロッパのキリスト教世界では、聖餐（ミサ）においてワインは「キリストの血」、パンは「キリストの肉」を象徴するものとされていた。ビールはパンと同じ穀物（大麦）を原料とし、栄養価が高いことから「液体のパン（flüssiges Brot）」と呼ばれるようになった。修道院における断食期間中も、「飲み物は断食の妨げにならない」という解釈のもとビールの飲用が許可され、修道士たちにとって重要な栄養補給源となっていた。</p>\n<h3>背景知識</h3>\n<h4>中世の修道院とビール醸造</h4>\n<p>中世ヨーロッパにおいてビール醸造を担ったのは主にキリスト教の修道院だった。その背景には以下の要因がある：</p>\n<ul><li><strong>断食との両立</strong>: カトリックの断食規則では固形食を禁じるが、液体は許可されていた。ビールは「液体のパン」として、断食中の修道士に必要なカロリー・栄養を供給した</li><li><strong>水の安全性</strong>: 中世の水は汚染リスクが高く、醸造過程で加熱されるビールは安全な飲料として重宝された</li><li><strong>経済的基盤</strong>: 修道院は巡礼者・旅人に宿と食事を提供する義務があり、ビールはその収入源にもなった</li></ul>\n<h4>修道院ビールの代表的な流れ</h4>\n<p>修道院醸造の伝統は現代にも引き継がれており、ベルギーの<strong>トラピスト修道院</strong>が特に有名：</p>\n<table><tr><th>修道院</th><th>国</th><th>代表ブランド</th></tr><tr><td>ウェストフレテレン修道院</td><td>ベルギー</td><td>Westvleteren</td></tr><tr><td>シメイ修道院</td><td>ベルギー</td><td>Chimay</td></tr><tr><td>オルヴァル修道院</td><td>ベルギー</td><td>Orval</td></tr><tr><td>ロシュフォール修道院</td><td>ベルギー</td><td>Rochefort</td></tr></table>\n<p>現在も修道士が醸造に携わる<strong>真正トラピストビール（Authentic Trappist Product）</strong>は国際トラピスト修道院連盟が認定する。</p>\n<h4>ビールの栄養価と「液体のパン」の根拠</h4>\n<p>ビールには以下の栄養素が含まれており、「液体のパン」の呼称には根拠がある：</p>\n<ul><li><strong>B群ビタミン</strong>（B1・B2・B6・葉酸）: 酵母由来</li><li><strong>ミネラル</strong>（カリウム・マグネシウム・リン）: 麦芽・酵母由来</li><li><strong>食物繊維</strong>: 麦芽由来のβグルカン</li><li><strong>タンパク質</strong>: 少量含有</li></ul>\n<p>ただし現代の一般的なビールはアルコールを含み、栄養補給目的には不適切な面もある。中世のビールはアルコール度数が低めで（水代わりに子供も飲む文化があった）、より食料に近い位置づけだった。</p>\n<h4>「液体のパン」という概念の広がり</h4>\n<p>ドイツ語では「flüssiges Brot」（フリュッシゲス・ブロート）と表現される。この概念は現代でも：</p>\n<ul><li>ドイツの<strong>マイボック</strong>や<strong>ドッペルボック</strong>など栄養豊富な強いビールに引き継がれている</li><li>特にドッペルボックの語尾「-ator」（パウラナーのSalvator等）は修道院系強ビールの伝統名称</li></ul>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) キリストの汗</strong>: 誤り。キリスト教の典礼・象徴体系にこのような表現は存在しない架空の選択肢。</li><li><strong>b) 液体のパン</strong>: ✓ 正解。穀物原料・高栄養価のビールを「飲めるパン」として捉えた中世の表現。修道院醸造文化と深く結びついている。</li><li><strong>c) キリストの肉</strong>: 誤り。「キリストの肉」は<strong>パン（ホスチア）</strong>を指す聖餐の象徴。ビールではなく固形食のパンに用いられる表現。問題文にも「パンは『キリストの肉』」と説明がある通り、これはビールの表現ではない。</li><li><strong>d) 天使の輪（エンジェルリング）</strong>: 誤り。「エンジェルリング」はビールを飲み干したグラスの内側に残る泡の跡（レーシング）を指す用語。中世の宗教的な位置づけとは別の、現代的なビールの品質・注ぎ方に関連する表現。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>三点セット</strong>：ワイン＝「キリストの血」／パン＝「キリストの肉」／ビール＝「<strong>液体のパン</strong>」</li><li>ビールとパンは同じ穀物（大麦）が原料 → 「液体のパン」は見た目だけでなく素材としても納得感がある</li><li>断食中に飲めた理由：「液体は断食の妨げにならない」というカトリック解釈</li><li><strong>エンジェルリング（天使の輪）</strong> はグラスに残る泡の輪のことで全く別の文脈。選択肢dはビール知識の混同を狙ったひっかけ</li><li>公式テキスト（2022年5月改訂版）91ページに記載</li></ul>"},{"id":"012","category":"原材料","subcategory":"水","difficulty":"基礎","topic":"水の硬度とビールの色","keywords":["軟水","硬水","硬度","カルシウム","マグネシウム","淡色ビール","濃色ビール","醸造用水"],"title":"水の硬度とビール：淡色には軟水、濃色には硬水","questionText":"日本で主流の淡色ビールには、どのような水が適しているか、次の選択肢より選べ。（2018）","choices":[{"key":"a","text":"硬度の低い硬水"},{"key":"b","text":"硬度の低い軟水"},{"key":"c","text":"硬度の高い硬水"},{"key":"d","text":"硬度の高い軟水"}],"answer":"b) 硬度の低い軟水","answerKey":"b","explanationHtml":"<h3>なぜ正解か</h3>\n<p>水の<strong>硬度</strong>とは、水に溶け込んでいる<strong>カルシウムイオン（Ca²⁺）とマグネシウムイオン（Mg²⁺）の総濃度</strong>を示す指標。硬度が低い水を「軟水」、高い水を「硬水」と呼ぶ。</p>\n<ul><li><strong>淡色ビール → 軟水</strong>（硬度の低い水）が適している</li><li><strong>濃色ビール → 硬水</strong>（硬度の高い水）が適している</li></ul>\n<p>「硬度の低い軟水」は「硬度が低い＝軟水」という同義の組み合わせで正しい記述。選択肢 a・d は「硬度の低い硬水」「硬度の高い軟水」という矛盾した記述で意味をなさない。</p>\n<h3>背景知識</h3>\n<h4>水の硬度とは</h4>\n<p>WHO（世界保健機関）の基準では、炭酸カルシウム（CaCO₃）換算で以下のように分類する：</p>\n<table><tr><th>区分</th><th>硬度（mg/L）</th></tr><tr><td>軟水</td><td>0〜60未満</td></tr><tr><td>中程度の軟水</td><td>60〜120未満</td></tr><tr><td>硬水</td><td>120〜180未満</td></tr><tr><td>非常な硬水</td><td>180以上</td></tr></table>\n<p>日本の水道水の平均硬度は約50mg/L前後と軟水寄りで、ヨーロッパの水（100〜300mg/L以上が多い）と比べて大幅に低い。</p>\n<h4>軟水が淡色ビールに適している理由</h4>\n<p>1. <strong>pH・酵素活性への影響</strong>：カルシウムイオンが少ないと糖化時のpHが上がりやすいが、淡色麦芽（酸性度が低い）を使う場合、軟水の方がpH調整しやすいケースがある</p>\n<p>2. <strong>ホップの苦みのクリアさ</strong>：硬水中のミネラルは苦みを荒くする傾向があり、軟水は苦みがまろやかでクリアな味わいになりやすい</p>\n<p>3. <strong>色の透明感</strong>：軟水はビールの色素成分に影響しにくく、澄んだ淡色を維持しやすい</p>\n<p>4. <strong>日本の軟水環境</strong>：日本は花崗岩地帯が多く、自然水が軟水になりやすい。この環境が日本の淡色ラガービール文化の基盤となった</p>\n<h4>硬水が濃色ビールに適している理由</h4>\n<ul><li>硫酸イオン（SO₄²⁻）や炭酸イオン（CO₃²⁻）が多い硬水は、濃色麦芽のロースト感・苦みと相性がよく、ギネスのようなスタウトの力強い風味を引き立てる</li><li>炭酸水素カルシウムが多い硬水は糖化時にpHを上げる傾向があり、濃色麦芽（酸性度が高い）とのバランスが取れやすい</li></ul>\n<h4>世界の醸造用水と代表ビアスタイルの対応</h4>\n<table><tr><th>産地</th><th>水質</th><th>代表スタイル</th></tr><tr><td>チェコ・ピルゼン</td><td>超軟水（硬度約7mg/L）</td><td>ボヘミアンピルスナー（極めて淡色・まろやか）</td></tr><tr><td>ドイツ・ミュンヘン</td><td>中程度の硬水</td><td>ダンケル・メルツェン</td></tr><tr><td>イギリス・バートン</td><td>超硬水（硬度500mg/L以上）</td><td>ペールエール・IPA（硫酸塩豊富でホップの苦みが際立つ）</td></tr><tr><td>アイルランド・ダブリン</td><td>炭酸硬水</td><td>スタウト（ギネス）</td></tr><tr><td><strong>日本各地</strong></td><td><strong>軟水</strong></td><td><strong>淡色ラガー（主流）</strong></td></tr></table>\n<p><strong>ピルゼンの軟水</strong>が世界初の淡色ラガー「ピルスナー」誕生の重要因子となった歴史は特に有名で、試験でも問われやすい。</p>\n<h4>選択肢の論理的な誤り</h4>\n<ul><li><strong>「硬度の低い硬水」</strong>：硬度が低ければそれは「軟水」であり、「低い硬水」は矛盾</li><li><strong>「硬度の高い軟水」</strong>：硬度が高ければそれは「硬水」であり、「高い軟水」は矛盾</li></ul>\n<p>→ 実質的にこの問題は「淡色ビールに軟水か硬水か」を問う二択問題と見なせる。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 硬度の低い硬水</strong>: 誤り。「硬度が低い＝軟水」であり「低い硬水」は定義矛盾。また淡色ビールには硬水は不向き。</li><li><strong>b) 硬度の低い軟水</strong>: ✓ 正解。「硬度が低い軟水」は同義反復的に正しい表現。淡色ビールには軟水が適している。</li><li><strong>c) 硬度の高い硬水</strong>: 誤り。「硬度が高い＝硬水」であり表現自体は正しいが、淡色ビールではなく<strong>濃色ビール</strong>に適している。</li><li><strong>d) 硬度の高い軟水</strong>: 誤り。「硬度が高い＝硬水」であり「高い軟水」は定義矛盾。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「淡（薄い）色→軟（柔らかい）水」</strong>：「淡」と「軟」を対応させて覚える。濃い色→硬い水も同様に対応</li><li><strong>「ピルゼンの軟水→世界初の淡色ピルスナー」</strong>：歴史的事実とセットで理解すると定着しやすい</li><li><strong>硬度＝カルシウム＋マグネシウムの濃度</strong>：鉄分・ナトリウムは硬度に含まれないことも覚えておく</li><li>選択肢 a・d は「矛盾した記述」なので論理的に即排除できる。消去法でも b に絞り込める</li><li>日本の水が軟水寄りである背景（花崗岩地帯・急流の河川）と、日本のビールが淡色ラガー主体になった理由が連動していることを意識すると理解が深まる</li></ul>"},{"id":"013","category":"醸造工程","subcategory":"発酵","difficulty":"基礎","topic":"上面発酵と下面発酵の比較","keywords":["上面発酵","下面発酵","エール","ラガー","発酵温度","発酵期間","酵母"],"title":"上面発酵ビールの特徴──誤っているものを選べ","questionText":"上面発酵ビールに関する説明として誤っているものを、次の選択肢より選べ。（2017年）","choices":[{"key":"a","text":"下面発酵より発酵温度が低い"},{"key":"b","text":"下面発酵より発酵期間が短い"},{"key":"c","text":"下面発酵より歴史が古い"},{"key":"d","text":"豊かな味わいと香りが特徴"}],"answer":"a) 下面発酵より発酵温度が低い","answerKey":"a","explanationHtml":"<h3>なぜ正解か</h3>\n<p>これは<strong>「誤っているもの」を選ぶ問題</strong>である。上面発酵（エール）の発酵温度は<strong>15〜25℃</strong>で、下面発酵（ラガー）の<strong>10℃前後</strong>より<strong>高い</strong>。したがって「下面発酵より発酵温度が低い」は<strong>誤り</strong>。</p>\n<h3>背景知識</h3>\n<h4>上面発酵と下面発酵の数値比較</h4>\n<table><tr><th>項目</th><th>上面発酵（エール）</th><th>下面発酵（ラガー）</th></tr><tr><td><strong>発酵温度</strong></td><td><strong>15〜25℃（高い）</strong></td><td><strong>10℃前後（低い）</strong></td></tr><tr><td><strong>発酵期間</strong></td><td><strong>3〜5日（短い）</strong></td><td><strong>1週間〜10日（長い）</strong></td></tr><tr><td>酵母の位置</td><td>液面上部に浮く</td><td>タンク底部に沈む</td></tr><tr><td>貯蔵熟成</td><td>比較的短期間</td><td>長期低温熟成（ラグリング）</td></tr><tr><td>歴史</td><td><strong>古い</strong>（人類が最初に醸造）</td><td>比較的新しい（19世紀以降）</td></tr><tr><td>風味</td><td>フルーティー・複雑・豊か</td><td>すっきり・クリア</td></tr></table>\n<h4>選択肢の正誤まとめ</h4>\n<table><tr><th>選択肢</th><th>内容</th><th>正誤</th></tr><tr><td>a</td><td>下面発酵より発酵温度が低い</td><td><strong>誤り</strong>（上面の方が高い）← 正解</td></tr><tr><td>b</td><td>下面発酵より発酵期間が短い</td><td>正しい（3〜5日 &lt; 1〜2週間）</td></tr><tr><td>c</td><td>下面発酵より歴史が古い</td><td>正しい（エールが先・ラガーは19世紀）</td></tr><tr><td>d</td><td>豊かな味わいと香りが特徴</td><td>正しい（エールの特徴）</td></tr></table>\n<h4>上面発酵の歴史的背景</h4>\n<p>上面発酵（エール）は人類が最初に醸造したビールの製法で、常温近くでも発酵できるため特別な冷蔵設備が不要だった。一方、下面発酵（ラガー）は冷涼な環境が必要であり、冷蔵技術の発展した<strong>19世紀以降</strong>に普及した比較的新しい製法である。現在では世界のビール消費量の大半をラガーが占めるが、歴史的な先行者はエールである。</p>\n<h4>上面発酵酵母の特性</h4>\n<p><strong>Saccharomyces cerevisiae</strong>（サッカロマイセス・セレビシエ）が上面発酵に使われる酵母で、高温活性・短期発酵・香気物質（エステル類）を多く産生することが特徴。これが「豊かな味わいと香り」（選択肢d）の科学的な背景である。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 下面発酵より発酵温度が低い</strong>: ✓ これが誤りの選択肢（正解）。上面発酵は15〜25℃で、下面発酵の10℃前後より<strong>高い</strong>。逆の説明である。</li><li><strong>b) 下面発酵より発酵期間が短い</strong>: 正しい記述。上面（3〜5日）は下面（1〜2週間）より短い。誤答に見えるが正しい。</li><li><strong>c) 下面発酵より歴史が古い</strong>: 正しい記述。常温で醸造できるエールが先、低温が必要なラガーは19世紀以降。</li><li><strong>d) 豊かな味わいと香りが特徴</strong>: 正しい記述。エール酵母が高温発酵でエステル類を多産するため、フルーティーで複雑な香りが生まれる。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「エール（上面）は高温・短期」「ラガー（下面）は低温・長期」</strong>：対になる数値をセットで覚える</li></ul>  - 上面：**15〜25℃、3〜5日**\n<p>  - 下面：<strong>10℃前後、1〜2週間</strong></p>\n<ul><li>「誤りを選ぶ」問題形式に注意。選択肢を素直に読むと「温度が低い方がラガーっぽい」と正しいように感じてしまう引っかけ</li><li>歴史の古さ：<strong>エール（上面）→ ラガー（下面）</strong>の順序は問題011（ラガーの語源）とも連動</li><li>公式テキスト30ページ・58ページ（2022年5月改訂版）出典。2017年出題実績あり</li></ul>"},{"id":"013","category":"醸造工程","subcategory":"容器・包装","difficulty":"基礎","topic":"缶ビールの構造","keywords":["2ピース缶","3ピース缶","缶ビール","巻き締め","炭酸ガスパージ","缶構造","昭和30年代","充填工程"],"title":"缶ビールの構造：3ピース缶から2ピース缶への変遷","questionText":"昭和30年代にはじまった日本の缶ビールの缶は、上蓋、胴、底蓋からなる3ピース缶であった。現在の日本で最も一般的なビールの缶のタイプを次の選択肢より選べ。（2012年）","choices":[{"key":"a","text":"1ピース缶"},{"key":"b","text":"2ピース缶"},{"key":"c","text":"3ピース缶"},{"key":"d","text":"4ピース缶"}],"answer":"b) 2ピース缶","answerKey":"b","explanationHtml":"<h3>なぜ正解か</h3>\n<p>現在の日本で最も一般的なビール缶は<strong>2ピース缶</strong>である。「上蓋」と「胴＋底が一体になった部分」の2パーツで構成される。製造工程では、胴部分（カップ状）にビールを充填した後、炭酸ガスを吹きかけて缶内の空気を追い出し（ガスパージ）、瞬間的に上蓋を巻き締めて密封する。</p>\n<p>昭和30年代（1950年代後半〜）に登場した初期の缶ビールは「上蓋・胴・底蓋」が別々の3ピース缶だったが、製造技術の進歩により底と胴を一体成形できる2ピース缶が主流になった。</p>\n<h3>背景知識</h3>\n<h4>缶のピース構造の比較</h4>\n<table><tr><th>タイプ</th><th>構成</th><th>特徴</th></tr><tr><td>3ピース缶</td><td>上蓋＋胴（筒）＋底蓋</td><td>初期の缶ビール。胴は板を曲げて溶接するため継ぎ目（シーム）がある</td></tr><tr><td>2ピース缶</td><td>上蓋＋胴底一体</td><td>現在の主流。アルミ板を絞り加工して胴と底を一体成形。継ぎ目がなく軽量</td></tr><tr><td>1ピース缶</td><td>全体一体</td><td>上蓋まで含めて一体成形は現実的でないため、ビール缶としては存在しない</td></tr></table>\n<h4>2ピース缶の製造工程（DI缶）</h4>\n<p>現代の2ピース缶は「<strong>DI缶（Draw &amp; Iron缶）</strong>」とも呼ばれ、以下の工程で作られる：</p>\n<p>1. <strong>ブランキング</strong>: アルミコイルから円形に打ち抜く</p>\n<p>2. <strong>絞り（Drawing）</strong>: カップ状に成形</p>\n<p>3. <strong>しごき（Ironing）</strong>: 胴壁を薄く引き伸ばして高さを出す</p>\n<p>4. <strong>トリミング</strong>: 口元を切り揃える</p>\n<p>5. <strong>印刷・塗装</strong>: 外面印刷、内面コーティング</p>\n<p>6. <strong>ネッキング</strong>: 上部を細く絞り込んでフランジを形成</p>\n<h4>充填と密封の工程</h4>\n<p>ビールを缶に充填する際の工程：</p>\n<p>1. 缶胴にビールを充填</p>\n<p>2. <strong>炭酸ガスパージ（CO₂スニフティング）</strong>: 充填後に炭酸ガスを吹き付け、缶内の酸素（ヘッドスペースの空気）を追い出す</p>\n<p>3. <strong>巻き締め（シーミング）</strong>: 上蓋を胴フランジにかぶせ、専用機で巻き込んで密封</p>\n<p>ガスパージの目的は<strong>酸化防止</strong>。ヘッドスペースに酸素が残るとビールが酸化して風味が劣化するため、不活性な炭酸ガスで置換することが品質維持に不可欠。</p>\n<h4>日本の缶ビール史</h4>\n<ul><li><strong>1958年（昭和33年）</strong>: 朝日麦酒（現アサヒビール）が日本初の缶ビールを発売（スチール製3ピース缶）</li><li>その後、アルミ缶への移行・2ピース缶化が進む</li><li><strong>1965年頃〜</strong>: ステイオンタブ（プルタブが缶に残るタイプ）の普及</li><li>現在は軽量・リサイクル性に優れたアルミ製2ピース缶が標準</li></ul>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 1ピース缶</strong>: 誤り。上蓋を含めた全体を一体成形する技術は実用化されておらず、ビール缶として存在しない選択肢。</li><li><strong>b) 2ピース缶</strong>: ✓ 正解。上蓋と胴底一体部分の2パーツ構成。軽量・密封性が高く現在の主流。</li><li><strong>c) 3ピース缶</strong>: 誤り。昭和30年代の初期缶ビールに使われた旧来の形式。上蓋・胴（筒状）・底蓋の3パーツ構成で、胴に溶接の継ぎ目がある。現在は主流ではない。</li><li><strong>d) 4ピース缶</strong>: 誤り。ビール缶として4ピース構成は存在しない架空の選択肢。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「昔は3ピース、今は2ピース」</strong> — 部品が減った＝製造技術の進歩（一体成形化）</li><li>2ピース缶は「胴と底が一体」。缶の底を見ると継ぎ目がないことで確認できる</li><li><strong>炭酸ガスパージ（ガスフラッシュ）</strong> は充填の必須工程。酸化防止が目的</li><li>「巻き締め（シーミング）」は缶詰・缶ビール共通の密封技術</li><li>缶ビール発売年「<strong>1958年（昭和33年）</strong>」と「最初は3ピース缶」はセットで覚えておくと沿革問題に対応できる</li></ul>"},{"id":"013","category":"ビアスタイル","subcategory":"ドイツビール","difficulty":"応用","topic":"ラオホビール・燻製麦芽","keywords":["ラオホ","スモークビール","バンベルク","燻製麦芽","世界遺産","ラオホマルツ","シュレンケルラ","メルツェン"],"title":"ラオホビール：バンベルク名物の燻製麦芽ビール","questionText":"歴史的な市街地があり、町全体が世界遺産に登録されているバンベルグの名物で、燻製した麦芽でつくられるビールを次の選択肢より選べ。（2019年）","choices":[{"key":"a","text":"ヴァイツェン"},{"key":"b","text":"ラオホ"},{"key":"c","text":"アルト"},{"key":"d","text":"シュバルツ"}],"answer":"b) ラオホ","answerKey":"b","explanationHtml":"<h3>なぜ正解か</h3>\n<p><strong>「ラオホ（Rauch）」</strong> はドイツ語で「煙」を意味する。ラオホビールはビーチ（ブナ）の木などの薪で直火燻煙した麦芽（ラオホマルツ）を使って醸造するスモークビールで、バイエルン州バンベルクが発祥の地として知られる。スモーキーな香りとマイルドな甘味が特徴で、現地では今も数軒の醸造所が伝統製法を守り続けている。</p>\n<h3>背景知識</h3>\n<h4>バンベルクとは</h4>\n<p>バンベルクはドイツ・バイエルン州北部フランケン地方に位置する都市。中世からほぼ戦禍を受けずに残った旧市街は1993年にユネスコ世界文化遺産に登録されており、「フランケンのローマ」とも呼ばれる。人口約8万人ながら市内に9軒以上の醸造所が存在し、人口比でのビール醸造所密度が世界有数とも言われるビールの聖地である。</p>\n<h4>ラオホビールの製造</h4>\n<p>ラオホビールの最大の特徴は原料麦芽の乾燥方法にある。</p>\n<ul><li><strong>通常の麦芽</strong>: 熱風（間接加熱）で乾燥 → 燻煙なし</li><li><strong>ラオホマルツ</strong>: ブナ（ビーチ）材などの薪を燃やした<strong>直火・燻煙</strong>で乾燥 → スモーク香が麦芽に移る</li></ul>\n<p>燻煙乾燥させた麦芽を使うことで、ウイスキーのピート香に似た独特のスモーキーフレーバーがビールに生まれる。現代では燻煙専用の麦芽を仕込みに混合する割合（10〜100%）によって風味の強度を調整できる。</p>\n<h4>ベーススタイルとのかけあわせ</h4>\n<p>ラオホは独立したビアスタイルではなく、燻製麦芽を使った「製法の呼称」でもある。代表的な組み合わせは以下の通り。</p>\n<table><tr><th>ベーススタイル</th><th>呼称</th><th>特徴</th></tr><tr><td>メルツェン</td><td>ラオホビア・メルツェン</td><td>最もオーソドックス。琥珀色で甘みとスモークの調和</td></tr><tr><td>ヘレス</td><td>ラオホビア・ヘレス</td><td>ペールでライトなスモークビール</td></tr><tr><td>ボック</td><td>ラオホビア・ボック</td><td>アルコール高め、濃厚なスモーク</td></tr><tr><td>ヴァイツェン</td><td>ラオホヴァイツェン</td><td>小麦由来のフルーティさとスモークの融合</td></tr></table>\n<h4>代表的な醸造所</h4>\n<p>バンベルクで特に有名なのが <strong>「シュレンケルラ（Schlenkerla）」</strong> 醸造所。1678年創業とも伝わる老舗で、ラオホビールの代名詞的存在。同名のガストハウス（居酒屋）も旧市街に構え、観光名所にもなっている。もう一軒の <strong>「スペツィアル（Spezial）」</strong> もラオホビールの名店として知られる。</p>\n<h4>歴史的背景</h4>\n<p>近代以前は麦芽の乾燥に直火を使うのが一般的であり、燻煙香はすべてのビールに多かれ少なかれ存在した。18〜19世紀に間接加熱（熱風乾燥）技術が普及し、一般的なビールからスモーク香が消えた後も、バンベルクでは伝統製法を守り続けたため、現代では希少なスタイルとして評価されるようになった。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) ヴァイツェン</strong>: 小麦麦芽50%以上を使う南ドイツの白ビール（上面発酵）。バナナ・クローブ様の香りが特徴。燻製とは無関係。バイエルン州のビールだが、バンベルクの名物ではない。</li><li><strong>b) ラオホ</strong>: ✓ 正解。ドイツ語で「煙」の意味。バンベルク発祥の燻製麦芽ビール。</li><li><strong>c) アルト</strong>: デュッセルドルフを中心とするライン川沿い地方の上面発酵ビール。「Alt」はドイツ語で「古い」の意味で、上面発酵の古い製法を守ることに由来する。燻製とは無関係。</li><li><strong>d) シュバルツ</strong>: 「黒」を意味するドイツ語で、ローストした麦芽を使う黒ビール（下面発酵）。コーヒー・チョコレート様の風味が特徴。燻製ではなくロースト麦芽の使用によって黒くなる。テューリンゲン州やザクセン州が産地として知られる。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「ラオホ＝煙（Rauch）＝バンベルク＝スモークビール」</strong> の四点セットで覚える。</li><li><strong>アルトとシュバルツの区別</strong>: どちらもドイツの伝統スタイルだが、アルト（上面発酵・デュッセルドルフ）とシュバルツ（下面発酵・黒ビール）は別物。混同しやすいので注意。</li><li><strong>ラオホとシュバルツの混同注意</strong>: どちらも色が濃く「黒っぽいビール」のイメージがあるが、シュバルツはロースト麦芽由来の苦味・焦げ感、ラオホは燻煙由来のスモーク感が特徴。製法が根本的に異なる。</li><li>バンベルクは<strong>世界遺産</strong>登録都市という文脈でも出題される。「旧市街全体が世界遺産」という記述がセットで問われることが多い。</li><li>公式テキスト63ページ（2022年5月改訂版）掲載。出題頻度は中程度だが、「バンベルク」「燻製」「ラオホ＝煙」のキーワードが確認できれば確実に正解できる。</li></ul>"},{"id":"013","category":"歴史・文化","subcategory":"日本ビール史・ブランド","difficulty":"応用","topic":"ヱビスビールと万博受賞","keywords":["ヱビスビール","馬越恭平","パリ万博","1900年","明治33年","金牌賞","セントルイス万博","東洋のビール王"],"title":"ヱビスビールと万博：1900年パリ万博の金牌賞","questionText":"「東洋のビール王」とも呼ばれた馬越恭平は、ヱビスビールの販売のみならず、品質向上にも努めた。1900年（明治33年）にヱビスビールが金牌賞を受賞した万博を次の選択肢より選べ。","choices":[{"key":"a","text":"ブリュッセル万博"},{"key":"b","text":"パリ万博"},{"key":"c","text":"バルセロナ万博"},{"key":"d","text":"ロンドン万博"}],"answer":"b) パリ万博","answerKey":"b","explanationHtml":"<h3>なぜ正解か</h3>\n<p>1900年（明治33年）に開催された<strong>パリ万博</strong>（パリ万国博覧会）において、ヱビスビールが<strong>金牌賞</strong>を受賞した。これはヱビスビールが国際舞台で品質を認められた歴史的な出来事であり、「東洋のビール王」と呼ばれた<strong>馬越恭平</strong>の積極的な品質向上・海外進出戦略の成果として知られる。</p>\n<h3>背景知識</h3>\n<h4>馬越恭平（まごし きょうへい）</h4>\n<ul><li><strong>1844（弘化元）年〜1933（昭和8）年</strong>：明治〜昭和初期の実業家</li><li>三菱財閥の岩崎弥太郎の支援を受けてビール事業に参入</li><li><strong>日本麦酒醸造会社</strong>（後のヱビスビール製造元）の経営を担い、ヱビスブランドを発展させた</li><li>積極的な販売戦略・品質管理・海外展開で「東洋のビール王」の異名を持つ</li><li>後に大日本麦酒（現在のサッポロビール・アサヒビールの前身）の設立にも関与</li></ul>\n<h4>ヱビスビールの万博受賞歴</h4>\n<table><tr><th>年</th><th>万博</th><th>賞</th></tr><tr><td><strong>1900年（明治33年）</strong></td><td><strong>パリ万博（フランス）</strong></td><td><strong>金牌賞</strong></td></tr><tr><td><strong>1904年（明治37年）</strong></td><td><strong>セントルイス万博（アメリカ）</strong></td><td><strong>グランプリ</strong></td></tr></table>\n<p>パリ万博（1900年）での金牌賞受賞後、さらに1904年のセントルイス万博でもグランプリを獲得しており、明治期の日本ビールが国際的に高い評価を得ていたことを示している。</p>\n<h4>ヱビスビールの歴史</h4>\n<ul><li><strong>1887（明治20）年</strong>：日本麦酒醸造会社が東京・目黒に「恵比寿ビール」醸造所を設立</li><li><strong>1890年</strong>：「ヱビスビール」として販売開始</li><li><strong>1906年</strong>：大日本麦酒（Dainippon Brewery）に合併</li><li><strong>1949年</strong>：企業分割によりサッポロビールとアサヒビールに分割</li><li><strong>1971年</strong>：サッポロビールが「ヱビスビール」ブランドを復活・再発売</li><li>現在：サッポロビールのプレミアムブランドとして継続</li></ul>\n<h4>1900年パリ万博について</h4>\n<ul><li><strong>正式名称</strong>：Exposition Universelle de 1900（1900年パリ万国博覧会）</li><li><strong>開催期間</strong>：1900年4月〜11月</li><li><strong>来場者数</strong>：約5000万人（当時世界最大規模）</li><li><strong>主なシンボル</strong>：エッフェル塔（1889年万博で建設、この万博でも活用）</li><li><strong>19世紀の集大成</strong>として位置づけられた大規模な博覧会</li><li>ヱビスビール以外にも日本の工芸品・美術品が多数出品され、ジャポニスム（日本趣味）ブームを背景に好評を博した</li></ul>\n<h4>セントルイス万博（1904年）</h4>\n<ul><li><strong>正式名称</strong>：Louisiana Purchase Exposition</li><li>ルイジアナ買収100周年を記念してアメリカ・セントルイスで開催</li><li>ヱビスビールはここでもグランプリを受賞し、国際的な品質の高さを再確認した</li></ul>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) ブリュッセル万博</strong>: 誤り。ブリュッセル（ベルギー）で万博は複数回開催されているが（1910年・1935年・1958年等）、1900年にヱビスビールが金牌賞を受賞した万博ではない。</li><li><strong>b) パリ万博</strong>: ✓ 正解。1900年（明治33年）のパリ万国博覧会でヱビスビールが金牌賞を受賞。</li><li><strong>c) バルセロナ万博</strong>: 誤り。バルセロナでは1888年・1929年に万博が開催されたが、1900年のヱビスの受賞とは無関係。</li><li><strong>d) ロンドン万博</strong>: 誤り。ロンドンでは1851年の第1回万博（水晶宮博覧会）が有名だが、1900年には万博は開催されていない。1900年の金牌賞受賞はパリ万博での出来事。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「1900年・パリ・金牌賞」「1904年・セントルイス・グランプリ」</strong>：年号・都市・賞のセットで覚える</li><li><strong>「明治33年＝1900年」</strong>：明治は1868年始まりなので、33年後＝1900年と計算できる</li><li><strong>馬越恭平＝「東洋のビール王」</strong>：人物名と異名の対応は試験の定番。「馬越（まごし）」という珍しい苗字と「東洋のビール王」をセットで覚える</li><li><strong>ヱビスの「ヱ」（旧仮名）</strong>：「エビス」ではなく「ヱビス」という旧仮名遣いも現代のブランドロゴに残る特徴</li><li>パリ万博は「1900年＝世紀末・19世紀の締めくくり」という歴史的文脈で位置づけると記憶しやすい</li><li>ヱビスビールはサッポロビールの前身系列のブランドであり、現在もサッポロビールが製造・販売していることも関連知識として把握しておく</li></ul>"},{"id":"014","category":"原材料","subcategory":"ホップ","difficulty":"基礎","topic":"ホップ産地・ザーツ","keywords":["ザーツ","ホップ","チェコ","ファインアロマホップ","ハラタウ","ピルゼン","アロマホップ","産地"],"title":"ホップの名産地：チェコのザーツとファインアロマホップ","questionText":"ホップは独特の香りと苦味をビールに与える大事な原料である。世界的なホップの名産地とされているチェコの地方を次の選択肢より選べ。","choices":[{"key":"a","text":"ザーツ"},{"key":"b","text":"ハラタウ"},{"key":"c","text":"モーゼル"},{"key":"d","text":"ピルゼン"}],"answer":"a) ザーツ","answerKey":"a","explanationHtml":"<h3>なぜ正解か</h3>\n<p>チェコ（ボヘミア地方）の<strong>ザーツ（Žatec）</strong>は、世界最高峰の<strong>ファインアロマホップ</strong>の産地として世界的に知られている。ザーツ産ホップは「ザーツホップ（Saaz Hops）」と呼ばれ、繊細な花香・スパイシーな香り・マイルドな苦みを持ち、特にボヘミアンピルスナー（例：ピルスナー・ウルケル）の特徴的な香味を形成する不可欠な原料となっている。</p>\n<h3>背景知識</h3>\n<h4>ホップの役割</h4>\n<p>ホップ（Humulus lupulus）はアサ科のつる性植物で、雌花（毬花）を醸造に使用する。主な役割：</p>\n<p>1. <strong>苦み付与</strong>：α酸（フムロン等）が煮沸によりイソフムロンに変換され苦みを与える</p>\n<p>2. <strong>香り付与</strong>：精油成分（ミルセン・リナロール・ゲラニオール等）が複雑な香りを生む</p>\n<p>3. <strong>防腐作用</strong>：ホップの抗菌成分がビールの保存性を高める</p>\n<p>4. <strong>泡立ち向上・泡持ちの安定</strong>：イソフムロンが泡の安定に寄与</p>\n<h4>ホップの種類分類</h4>\n<table><tr><th>種類</th><th>特徴</th><th>代表品種・産地</th></tr><tr><td><strong>ファインアロマホップ</strong></td><td>α酸含量低め・精油豊富・繊細な香り</td><td>ザーツ（チェコ）、ハラタウ伝統品種（ドイツ）</td></tr><tr><td><strong>アロマホップ</strong></td><td>香り重視・苦み控えめ</td><td>ハラタウ（ドイツ）、フグル（イギリス）</td></tr><tr><td><strong>ビターホップ（高α酸）</strong></td><td>α酸含量高め・苦み付与主体</td><td>チヌーク・マグナム</td></tr><tr><td><strong>デュアルパーパス</strong></td><td>香り・苦みの両立</td><td>シムコー・センテニアル（アメリカ）</td></tr></table>\n<h4>世界の主要ホップ産地</h4>\n<table><tr><th>産地</th><th>国</th><th>特徴</th></tr><tr><td><strong>ザーツ（Žatec / Saaz）</strong></td><td><strong>チェコ</strong></td><td><strong>ファインアロマの聖地。繊細な花香・スパイシー</strong></td></tr><tr><td><strong>ハラタウ（Hallertau）</strong></td><td><strong>ドイツ</strong></td><td>世界最大のホップ産地。多様なアロマ品種</td></tr><tr><td>ヘレフォード・ウースター</td><td>イギリス</td><td>フグル・ゴールディングス等の伝統品種</td></tr><tr><td>ヤキマ・バレー</td><td>アメリカ（ワシントン州）</td><td>アメリカン・ホップの一大産地。シトラス系品種が豊富</td></tr><tr><td>ウィラメット・バレー</td><td>アメリカ（オレゴン州）</td><td>カスケード等のアメリカンアロマホップ</td></tr><tr><td>ネルソン・ソーヴィン</td><td>ニュージーランド</td><td>ソーヴィニヨン・ブランに似た白ワイン系香り</td></tr></table>\n<h4>ザーツホップの特徴</h4>\n<ul><li><strong>チェコ語表記</strong>：Žatec（ジャテツ）</li><li><strong>ドイツ語・英語表記</strong>：Saaz（ザーツ）</li><li><strong>α酸含量</strong>：低め（約2〜5%）</li><li><strong>香り成分</strong>：花のような香り、スパイシー、ハーブ的なニュアンス</li><li><strong>主な使用スタイル</strong>：ボヘミアンピルスナー、チェコラガー、一部のジャーマンラガー</li><li><strong>地理的表示</strong>：「Žatec」はEUで地理的表示（Protected Geographical Indication）として保護されている</li></ul>\n<h4>ハラタウ（Hallertau）について</h4>\n<p>ドイツ・バイエルン州にあるヨーロッパ最大・世界屈指のホップ産地。多様なアロマホップ品種（ハラタウ・ミッテルフリューh・スパルト・テトナング等）を産出し、ドイツビール全般に使われる。ザーツと並ぶヨーロッパ2大アロマホップ産地として試験頻出。</p>\n<h4>ピルゼン（Pilsen）との関係</h4>\n<p>同じチェコにある都市だが役割が異なる：</p>\n<ul><li><strong>ザーツ</strong>：ホップの産地</li><li><strong>ピルゼン（Plzeň）</strong>：世界初の淡色ラガー「ピルスナー」誕生の地（1842年、ピルスナー・ウルケル創業）。超軟水の水質がボヘミアンピルスナーの淡色・まろやかな風味を生んだ（問012参照）</li></ul>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) ザーツ</strong>: ✓ 正解。チェコ・ボヘミア地方のファインアロマホップ産地。「Saaz」の名でも知られる。</li><li><strong>b) ハラタウ</strong>: 誤り。<strong>ドイツ</strong>・バイエルン州のアロマホップ産地。チェコではなくドイツの産地。世界最大のホップ産地として有名。</li><li><strong>c) モーゼル</strong>: 誤り。ドイツの<strong>ワイン</strong>銘醸地（モーゼル川流域）。ビール・ホップとは無関係。リースリングで知られる白ワインの産地。</li><li><strong>d) ピルゼン</strong>: 誤り。チェコの都市だが、ホップ産地ではなく<strong>ピルスナービール誕生の地</strong>（ビールの産地）。ホップの産地はザーツ。同じチェコという引っかけに注意。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「ザーツ＝チェコ＝ホップ」「ハラタウ＝ドイツ＝ホップ」「ピルゼン＝チェコ＝ビール（ピルスナー）」</strong>：3つをセットで整理する</li><li><strong>ピルゼンとザーツの混同注意</strong>：どちらもチェコだが、ザーツはホップ、ピルゼンはビール（水と酵母の街）</li><li><strong>モーゼルはワイン</strong>：「モーゼル＝ドイツワイン」は別ジャンルの知識。ビール産地と混同しないよう注意</li><li><strong>ファインアロマ＝ザーツの代名詞</strong>：「ファインアロマホップの産地は？」という問いにもザーツと答えられるようにする</li><li>ザーツホップを使ったピルスナー・ウルケルは「世界初の淡色ラガー」として問009（メルツェン・オクトーバーフェスト）と並ぶ重要な歴史的ビール。ザーツ（ホップ）＋ピルゼン（水・ビール）の組み合わせでボヘミアンピルスナーが誕生したという流れで覚えると関連知識が有機的につながる</li></ul>"},{"id":"014","category":"歴史・文化","subcategory":"日本のビール史","difficulty":"応用","topic":"日本初のビール醸造者","keywords":["川本幸民","化学新書","蘭学","日本初","ビール醸造","上面発酵","下面発酵","幕末"],"title":"日本で最初にビールを醸造した人物：川本幸民","questionText":"「化学新書」の中でビール醸造を紹介し、上面発酵と下面発酵の違いなどを詳しく解説した、日本人で最初にビールを醸造したといわれている人物を次の選択肢より選べ。","choices":[{"key":"a","text":"徳川 吉宗"},{"key":"b","text":"坂本 龍馬"},{"key":"c","text":"川本 幸民"},{"key":"d","text":"黒田 清隆"}],"answer":"c) 川本 幸民","answerKey":"c","explanationHtml":"<h3>なぜ正解か</h3>\n<p><strong>川本幸民（かわもと こうみん、1810〜1871）</strong> は江戸時代後期の蘭学者・化学者で、オランダ語文献を訳した著作『化学新書』（1861年刊）の中でビールの醸造法を紹介し、上面発酵と下面発酵の違いを詳述した。マッチや銀板写真（ダゲレオタイプ）など西洋の最新技術を旺盛に試作した探求心から、ビールも自ら醸造したであろうと推測されており、「日本人で最初にビールを醸造した人物」として語られる。</p>\n<h3>背景知識</h3>\n<h4>川本幸民とはどんな人物か</h4>\n<p>川本幸民は摂津三田藩（現・兵庫県三田市）の藩医の家に生まれ、江戸で蘭方医学・蘭学を修めた。1840年代から50年代にかけて蘭書の翻訳・研究に没頭し、化学・物理・鉱山学などを幅広く紹介した。代表的な業績は以下の通り。</p>\n<table><tr><th>業績</th><th>内容</th></tr><tr><td><strong>マッチの試作</strong></td><td>日本で初めてマッチを自作したとされる</td></tr><tr><td><strong>銀板写真（ダゲレオタイプ）の試作</strong></td><td>日本初の写真撮影に挑んだ人物の一人</td></tr><tr><td><strong>『化学新書』（1861年）</strong></td><td>オランダ語化学書を訳した著作。ビール醸造の解説を含む</td></tr><tr><td><strong>ビール醸造</strong></td><td>上記著作への理解と探求心から醸造を試みたと推測される</td></tr></table>\n<h4>『化学新書』とビール醸造の記述</h4>\n<p>『化学新書』はオランダ人化学者が著した教科書の翻訳・解説書で、醸造・発酵・化学反応など当時の最新知識を収録している。この中で川本はビールの製造工程を解説し、<strong>上面発酵（エール）と下面発酵（ラガー）の違い</strong>にも言及した。幕末の日本にこれほど体系的なビール醸造の記述が存在したことは、蘭学の水準の高さを示している。</p>\n<h4>日本のビール史における位置づけ</h4>\n<table><tr><th>時期</th><th>出来事</th></tr><tr><td>1853年頃</td><td>川本幸民がビールを醸造したと推測される時期</td></tr><tr><td>1869年</td><td>ノルウェー人ウィリアム・コープランドが横浜に「スプリング・バレー・ブルワリー」を設立（日本初の商業醸造所）</td></tr><tr><td>1870年</td><td>開拓使麦酒醸造所設立（札幌）→後のサッポロビール</td></tr><tr><td>1872年</td><td>渋谷醸造所（→後のキリンビール）創業</td></tr></table>\n<p>川本の試醸は商業的な醸造所設立より十数年前の出来事であり、「個人が学術的好奇心から行った日本初の試み」として位置づけられる。</p>\n<h4>幕末〜明治の蘭学者とビール</h4>\n<p>黒船来航（1853年）前後の日本では、西洋文化への関心が急速に高まっていた。川本のような蘭学者は単なる翻訳者にとどまらず、自ら実験・試作することで西洋の技術を体得しようとした。ビール醸造もその一環であり、「書いたなら作る」という実学の精神を体現している。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 徳川 吉宗</strong>: 江戸幕府8代将軍（1684〜1751）。享保の改革で知られる。川本幸民より約1世紀前の人物で、ビール醸造との関係はない。</li><li><strong>b) 坂本 龍馬</strong>: 幕末の志士（1836〜1867）。ビールを飲んだという逸話は残るが、醸造した記録はない。同時代の人物として混同しやすいので注意。</li><li><strong>c) 川本 幸民</strong>: ✓ 正解。蘭学者・化学者。『化学新書』でビール醸造を解説し、自ら試醸したとされる日本初のビール醸造者。</li><li><strong>d) 黒田 清隆</strong>: 明治の政治家・軍人（1840〜1900）。開拓使長官として北海道開拓に貢献し、1876年の開拓使麦酒醸造所（札幌）設立に深く関与した人物。ビール史への貢献はあるが、「最初に醸造した人物」ではない。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「川本幸民＝化学新書＝日本初醸造」</strong> の三点セットで覚える。</li><li><strong>「マッチも写真もビールも作った蘭学者」</strong> というイメージで川本幸民の人物像を固める。</li><li><strong>黒田清隆との混同に注意</strong>: 黒田は「札幌（開拓使）のビール」の父的存在。川本は「日本初の個人醸造者」。役割が全く異なる。</li><li>問題文の「推測されています」という表現が重要。史料に醸造の直接記録が残っているわけではなく、著作の内容と彼の性格・行動パターンから推測されている点を押さえておく。</li><li>日本のビール史の人物問題は頻出。川本幸民・コープランド（スプリング・バレー）・渋沢栄一（ジャパン・ブルワリー）・黒田清隆（開拓使）の4名の役割を整理しておくと対応できる。</li></ul>"},{"id":"014","category":"醸造工程","subcategory":"糖化・マッシング","difficulty":"応用","topic":"タンパク休止・マイシェ温度管理","keywords":["マイシェ","タンパク休止","糖化","マッシング","プロテアーゼ","アミラーゼ","酵素","仕込み工程"],"title":"マイシェ50℃保持の意義──タンパク休止","questionText":"ビールの仕込み工程では、マイシェの温度を50℃、65℃、75℃と段階的に上げていくが、この内、50℃を保持する意義について適切なものを、次の選択肢から選べ。（2019年）","choices":[{"key":"a","text":"糖化"},{"key":"b","text":"タンパク休止"},{"key":"c","text":"タンパク休止の防止"},{"key":"d","text":"酵素の失活"}],"answer":"b) タンパク休止","answerKey":"b","explanationHtml":"<h3>なぜ正解か</h3>\n<p>マイシェ（麦芽と温水を混合した醪）を<strong>50℃に保持する</strong>のは、この温度帯でタンパク質分解酵素（プロテアーゼ・ペプチダーゼ）が最もよく働くためである。この工程を<strong>「タンパク休止（Protein Rest）」</strong>と呼ぶ。タンパク質を適切に分解することで、ビールの濁り防止・酵母の栄養確保・泡持ちの向上が図られる。</p>\n<h3>背景知識</h3>\n<h4>マッシング（糖化工程）の段階的温度管理</h4>\n<table><tr><th>温度</th><th>名称</th><th>主な酵素</th><th>効果</th></tr><tr><td><strong>50℃</strong></td><td><strong>タンパク休止</strong></td><td><strong>プロテアーゼ・ペプチダーゼ</strong></td><td><strong>タンパク質をペプチド・アミノ酸に分解</strong></td></tr><tr><td>65℃</td><td>糖化休止</td><td>β‐アミラーゼ（主）</td><td>デンプンを発酵性の糖（マルトース）に分解</td></tr><tr><td>75℃</td><td>糖化終了・マッシュアウト</td><td>α‐アミラーゼ（主）</td><td>デンプンを液化・酵素を失活させ糖化を停止</td></tr></table>\n<h4>タンパク休止の目的</h4>\n<p>1. <strong>清澄化</strong>：過剰なタンパク質が残ると低温でビールが濁る（チルヘイズ）原因になる</p>\n<p>2. <strong>泡持ちの調整</strong>：ペプチドはビール泡の安定に必要だが、過多は泡の消えにくさや口当たりに影響する</p>\n<p>3. <strong>酵母の栄養源確保</strong>：アミノ酸は酵母の発酵を助けるFAN（遊離アミノ態窒素）として機能する</p>\n<h4>マイシェとは</h4>\n<p>マイシェ（Maische、ドイツ語）は麦芽を温水に浸して混合した状態の醪（もろみ）を指す。英語では<strong>mash（マッシュ）</strong>に相当する。マイシェの工程全体を<strong>マッシング（糖化）</strong>と呼ぶ。</p>\n<h4>現代的な糖化工程との違い</h4>\n<p>現代のよく溶解した（well-modified）麦芽を使う場合、タンパク休止（50℃）を省略し65℃からスタートするワンステップ糖化が主流になりつつある。ただし小麦麦芽などタンパク質が多い原料を使う場合は50℃のタンパク休止が有効とされる。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 糖化</strong>: 誤り。糖化（デンプン→糖への分解）が主に行われるのは<strong>65℃</strong>帯。β‐アミラーゼがマルトースを、α‐アミラーゼがデキストリンを生成する。50℃では糖化はほとんど進まない。</li><li><strong>b) タンパク休止</strong>: ✓ 正解。50℃でタンパク質分解酵素が活性化し、タンパク質をペプチド・アミノ酸へ分解する工程。</li><li><strong>c) タンパク休止の防止</strong>: 誤り。「防止」という言葉が誘惑的だが全くの逆。50℃保持はタンパク休止を<strong>行うため</strong>の操作。</li><li><strong>d) 酵素の失活</strong>: 誤り。酵素の失活（不活性化）は<strong>75℃以上</strong>で起こる。50℃は酵素活性の最適帯であり失活とは反対。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「50℃でタンパク、65℃で糖、75℃で終了」</strong>：三段階を数字と目的のセットで暗記する</li><li>「タンパク休止」という名称は「タンパク質分解のための一時停止（休止）ポイント」という意味ではなく、「タンパク質を分解する酵素が活性化する休止温度帯」という意味</li><li>問題012（アルファアミラーゼとイソアルファ酸）と連動：α‐アミラーゼは75℃帯、糖化に関係</li><li>公式テキスト42ページ（2022年5月改訂版）出典。2019年出題実績あり</li></ul>"},{"id":"014","category":"醸造工程","subcategory":"糖化・仕込み","difficulty":"基礎","topic":"糖化の目的","keywords":["糖化","マッシング","デンプン","アミラーゼ","麦汁","酵素","マルトース","仕込み工程"],"title":"糖化（マッシング）：デンプンを酵母が使える糖に変える工程","questionText":"糖化の目的として最も適切なものを次の選択肢より選べ。（2017年）","choices":[{"key":"a","text":"麦汁を殺菌するため"},{"key":"b","text":"ビールの甘味を引き出すため"},{"key":"c","text":"麦芽内にタンパク質分解酵素を生成するため"},{"key":"d","text":"デンプンをビール酵母が取り込める大きさの糖に分解するため"}],"answer":"d) デンプンをビール酵母が取り込める大きさの糖に分解するため","answerKey":"d","explanationHtml":"<h3>なぜ正解か</h3>\n<p>ビール酵母はデンプン（多糖類）を直接取り込んでアルコール発酵に使うことができない。酵母が利用できるのは単糖（グルコース）や二糖（マルトース）などの小さな糖分子である。糖化（マッシング）は、麦芽（モルト）中の<strong>アミラーゼ酵素</strong>を温水中で活性化させ、デンプンをこれらの発酵性糖に分解する工程である。糖化によって生じた糖分を含む液体が<strong>麦汁（ワート）</strong>となり、後の発酵工程で酵母のエサになる。</p>\n<h3>背景知識</h3>\n<h4>ビール醸造の主要工程と糖化の位置づけ</h4>\n<pre><code>麦芽粉砕 → 糖化（マッシング） → ろ過（麦汁分離） → 煮沸（ホップ添加）\n<p>→ 冷却 → 発酵 → 熟成 → ろ過 → 充填&lt;/code&gt;&lt;/pre&gt;</p>\n<p>糖化は仕込みの中核工程で、最終的なビールの甘味・コク・アルコール度数を左右する。</p>\n<h4>糖化で働く主な酵素</h4>\n<table><tr><th>酵素</th><th>別名</th><th>主な働き</th><th>至適温度</th></tr><tr><td>α-アミラーゼ</td><td>液化酵素</td><td>デンプン鎖をランダムに切断し液化</td><td>70〜75℃</td></tr><tr><td>β-アミラーゼ</td><td>糖化酵素</td><td>デンプン末端からマルトースを切り出す</td><td>60〜65℃</td></tr><tr><td>プロテアーゼ</td><td>タンパク質分解酵素</td><td>タンパク質をアミノ酸・ペプチドに分解</td><td>45〜55℃</td></tr></table>\n<p><strong>β-アミラーゼ</strong>が主に<strong>マルトース（麦芽糖）</strong>を生成する。マルトースはビール酵母が最も好んで利用する発酵性糖であり、アルコールと炭酸ガス（CO₂）に変換される。</p>\n<h4>糖化温度とビールの味わいの関係</h4>\n<p>糖化温度によって、α-アミラーゼとβ-アミラーゼの活性比率が変わり、生成される糖の種類が変化する：</p>\n<ul><li><strong>低温糖化（62〜65℃）</strong>: β-アミラーゼが優勢 → 発酵性糖（マルトース）が多い → ドライでキレのあるビール</li><li><strong>高温糖化（68〜72℃）</strong>: α-アミラーゼが優勢 → デキストリン（非発酵性糖）が多い → ボディがある甘みのあるビール</li></ul>\n<p>クラフトビール醸造では、この温度を意図的に操作してビールのキャラクターを設計する。</p>\n<h4>麦芽製造（モルティング）との関係</h4>\n<p>糖化で働く酵素は醸造所で加えるのではなく、<strong>製麦（モルティング）工程で大麦の中に生成される</strong>。大麦を水に浸けて発芽させる過程でアミラーゼなどの酵素が活性化・生成される。これが「大麦をそのまま使わず麦芽（モルト）にする」理由の一つである。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 麦汁を殺菌するため</strong>: 誤り。殺菌（パスチャリゼーション）は<strong>煮沸工程</strong>（ホップを加えて麦汁を沸騰させる工程）や充填後の加熱処理で行われる。糖化は60〜75℃程度の温水で行われ、完全な殺菌温度には達しない。</li><li><strong>b) ビールの甘味を引き出すため</strong>: 誤りではないが不正確。糖化で生じるデキストリン（非発酵性糖）はビールにボディと甘みを与えるが、それは糖化の<strong>副次的な結果</strong>であり「目的」として最も適切ではない。主目的は酵母が利用できる発酵性糖の生成。</li><li><strong>c) 麦芽内にタンパク質分解酵素を生成するため</strong>: 誤り。タンパク質分解酵素（プロテアーゼ）は<strong>製麦（発芽）工程</strong>で生成される。糖化工程ではすでに存在する酵素を活性化・利用するのであり、新たに生成するわけではない。</li><li><strong>d) デンプンをビール酵母が取り込める大きさの糖に分解するため</strong>: ✓ 正解。糖化の本質的な目的。アミラーゼがデンプン→マルトース・グルコース等に分解し、酵母が発酵に使える糖を生成する。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>糖化＝デンプン→糖（酵母のエサ作り）</strong> の一言で本質を押さえる</li><li>酵素は麦芽製造時に生成済み。糖化は「酵素を働かせる」工程</li><li><strong>β-アミラーゼ→マルトース生成→酵母が発酵</strong> のつながりで覚える</li><li>温度と味わいの関係：「低温→ドライ（発酵性糖↑）」「高温→ボディ（デキストリン↑）」</li><li>殺菌は糖化ではなく<strong>煮沸工程</strong>。混同しないこと</li><li>公式テキスト（2022年5月改訂版）40ページに記載</li></ul>"},{"id":"015","category":"醸造工程","subcategory":"発酵","difficulty":"基礎","topic":"上面発酵の発酵期間","keywords":["上面発酵","下面発酵","発酵期間","エール酵母","ラガー酵母","発酵温度","一次発酵","醸造工程"],"title":"上面発酵と下面発酵：発酵温度と期間の違い","questionText":"上面発酵酵母でビールを製造する場合の発酵期間として最も一般的なものを次の選択肢より選べ。（2013年）","choices":[{"key":"a","text":"3〜5日"},{"key":"b","text":"7〜10日"},{"key":"c","text":"15〜20日"},{"key":"d","text":"20〜25日"}],"answer":"a) 3〜5日","answerKey":"a","explanationHtml":"<h3>なぜ正解か</h3>\n<p>上面発酵（エール発酵）では<strong>15℃〜25℃</strong>という比較的高い温度で発酵が行われるため、酵母の活性が高く、発酵が速やかに進む。一般的な主発酵期間は<strong>3〜5日</strong>程度である。一方、下面発酵（ラガー発酵）は<strong>10℃前後</strong>の低温で行われるため代謝が遅く、主発酵に<strong>1週間〜10日</strong>ほどかかる。</p>\n<h3>背景知識</h3>\n<h4>上面発酵と下面発酵の比較</h4>\n<table><tr><th>項目</th><th>上面発酵（エール）</th><th>下面発酵（ラガー）</th></tr><tr><td>酵母の学名</td><td><em>Saccharomyces cerevisiae</em></td><td><em>Saccharomyces pastorianus</em></td></tr><tr><td>発酵温度</td><td>15〜25℃</td><td>10℃前後</td></tr><tr><td>主発酵期間</td><td><strong>3〜5日</strong></td><td><strong>1週間〜10日</strong></td></tr><tr><td>熟成（ラグリング）期間</td><td>数日〜数週間</td><td>数週間〜数か月</td></tr><tr><td>酵母の挙動</td><td>発酵中に液面上部に浮かぶ</td><td>発酵後に底に沈殿する</td></tr><tr><td>代表スタイル</td><td>エール・スタウト・IPA・ヴァイツェン</td><td>ピルスナー・マルツェン・ボック</td></tr></table>\n<h4>発酵温度と速度の関係</h4>\n<p>酵母は生き物であり、温度が高いほど代謝が活発になる。</p>\n<ul><li><strong>上面発酵（高温）</strong>: 酵母が活発にマルトースをアルコール＋CO₂に分解 → 発酵が短期間で完了。エステル（フルーティな香り）など副産物も多く生成されやすい</li><li><strong>下面発酵（低温）</strong>: 酵母の代謝がゆっくり進む → 発酵期間が長い。副産物が少なくクリーンな風味になりやすい</li></ul>\n<h4>総製造期間（一次発酵＋熟成）</h4>\n<p>主発酵（一次発酵）後にも「熟成」工程がある：</p>\n<ul><li><strong>エール系</strong>: 主発酵3〜5日 ＋ 熟成数日〜数週間 → 総計2〜4週間程度</li><li><strong>ラガー系</strong>: 主発酵1〜10日 ＋ ラグリング（冷温熟成）数週間〜数か月 → 総計1〜3か月以上になることも</li></ul>\n<p>ラガーの語源はドイツ語の「lagern（貯蔵する）」で、長期熟成がその本質。</p>\n<h4>上面発酵の名前の由来</h4>\n<p>発酵中に酵母が液面上部（泡の層）に浮かんで活動することから「上面発酵」と呼ばれる。実際には発酵全体で酵母は液中全体にいるが、特に上部に集まる性質が強い。収穫も液面上部からすくい取る方法が伝統的に用いられた。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 3〜5日</strong>: ✓ 正解。上面発酵（エール）の典型的な主発酵期間。15〜25℃の高温で酵母が活発に働くため短期間で完了する。</li><li><strong>b) 7〜10日</strong>: 誤り。これは<strong>下面発酵（ラガー）</strong>の主発酵期間（1週間〜10日）に相当する。問題は上面発酵を問うており、この選択肢は発酵タイプを誤解させるひっかけ。</li><li><strong>c) 15〜20日</strong>: 誤り。エールの主発酵としては長すぎる。ラガーの長期熟成（ラグリング）期間に近いが、それも通常は週単位〜月単位で表現される。</li><li><strong>d) 20〜25日</strong>: 誤り。主発酵期間としては大幅に長すぎる。自然発酵（ランビック等）や特殊な高アルコールビールの発酵期間に近いが、一般的な上面発酵の回答ではない。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>上面発酵：高温（15〜25℃）・短期（3〜5日）</strong></li><li><strong>下面発酵：低温（10℃前後）・長期（7〜10日）</strong></li><li>「高温＝速い＝エール（上面）」「低温＝遅い＝ラガー（下面）」と温度・速度・種類をセットで覚える</li><li>選択肢bの「7〜10日」は下面発酵の数字。上面・下面を問われたときに混同しないよう注意</li><li>熟成まで含めるとラガーは総期間が非常に長くなる。「ラグリング＝長期冷温熟成」も関連知識として押さえておく</li></ul>"},{"id":"015","category":"法規制","subcategory":"適正飲酒・健康","difficulty":"応用","topic":"適正飲酒の10か条","keywords":["適正飲酒の10か条","アルコール健康医学協会","休肝日","適正飲酒","飲酒マナー","未成年者飲酒禁止法","イッキ飲み"],"title":"適正飲酒の10か条：含まれない標語を選ぶ","questionText":"おいしいビールを楽しく飲んで健康に過ごすには「適正飲酒」の実践が重要である。アルコール健康医学協会のまとめた「適正飲酒の10か条」に含まれない標語を次の選択肢より選べ。（2012年）","choices":[{"key":"a","text":"強い酒 薄めて飲むのがオススメです"},{"key":"b","text":"少しなら 毎日飲んでも 大丈夫"},{"key":"c","text":"許さない 他人への無理強い・イッキ飲み"},{"key":"d","text":"飲まないで 妊娠中と授乳期は"}],"answer":"b) 少しなら 毎日飲んでも 大丈夫","answerKey":"b","explanationHtml":"<h3>なぜ正解か</h3>\n<p>「少しなら 毎日飲んでも 大丈夫」という標語は<strong>「適正飲酒の10か条」には存在しない</strong>。むしろこれは誤ったメッセージであり、10か条では「週に2日は休肝日をつくる」ことを推奨している。毎日飲み続けることは肝臓への負担が蓄積されるため、たとえ少量でも毎日の飲酒を「大丈夫」と断言する表現は10か条の精神に反する。</p>\n<h3>背景知識</h3>\n<h4>アルコール健康医学協会とは</h4>\n<p><strong>公益社団法人アルコール健康医学協会</strong>（アル健協）は、アルコールに関する医学的・社会的問題の解決を目的として設立された団体。お酒の正しい知識の普及啓発、適正飲酒の促進、アルコール関連問題の予防・研究などを行っている。「適正飲酒の10か条」はその代表的な啓発ツールである。</p>\n<h4>適正飲酒の10か条（全文）</h4>\n<p>1. <strong>談笑し 楽しく飲むのが基本です</strong></p>\n<p>2. <strong>食べながら 適量範囲でゆっくりと</strong></p>\n<p>3. <strong>強い酒 薄めて飲むのがオススメです</strong></p>\n<p>4. <strong>つくろう 週に二日は休肝日</strong></p>\n<p>5. <strong>やめようよ 他人への無理強い・イッキ飲み</strong>（※選択肢cはこれに対応）</p>\n<p>6. <strong>アルコール 薬との相互作用に気をつけて</strong></p>\n<p>7. <strong>飲まないで 妊娠中と授乳期は</strong></p>\n<p>8. <strong>飲酒後の運動・入浴 要注意</strong></p>\n<p>9. <strong>お酒を飲んで 運転は絶対しない</strong></p>\n<p>10. <strong>肝臓など 定期検査を忘れずに</strong></p>\n<h4>「休肝日」の考え方</h4>\n<p>10か条第4条「週に二日は休肝日」は、アルコール健康医学協会の啓発において特に重要な内容のひとつ。肝臓がアルコールを処理するには時間が必要であり、休肝日を設けることで肝機能の回復・維持を促す。毎日飲酒を続けると依存症リスクも高まるため、「少量でも毎日は問題ない」という考え方は推奨されない。</p>\n<h4>関連法規制</h4>\n<p>飲酒に関する主な法律も試験頻出事項。</p>\n<table><tr><th>法律</th><th>主な内容</th></tr><tr><td><strong>未成年者飲酒禁止法</strong>（1922年制定）</td><td>20歳未満の飲酒を禁止。販売・提供も禁止</td></tr><tr><td><strong>道路交通法</strong></td><td>酒気帯び運転・酒酔い運転を禁止。罰則あり</td></tr><tr><td><strong>健康増進法</strong></td><td>国民の健康増進を目的とした総合的な法律</td></tr></table>\n<p>※2022年施行の<strong>改正民法</strong>で成年年齢が18歳に引き下げられたが、飲酒・喫煙の年齢制限は<strong>引き続き20歳以上</strong>を維持している点に注意。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 強い酒 薄めて飲むのがオススメです</strong>: 10か条第3条として実際に含まれる標語。アルコール度数の高い酒を水や炭酸で割って飲むことで、体へのアルコール吸収速度を緩やかにできる。</li><li><strong>b) 少しなら 毎日飲んでも 大丈夫</strong>: ✓ 正解（含まれない標語）。10か条は「週に2日は休肝日」を推奨しており、毎日飲酒を「大丈夫」とするメッセージは存在しない。</li><li><strong>c) 許さない 他人への無理強い・イッキ飲み</strong>: 10か条第5条「やめようよ 他人への無理強い・イッキ飲み」に対応。文言は多少異なるが、趣旨は10か条に含まれる。</li><li><strong>d) 飲まないで 妊娠中と授乳期は</strong>: 10か条第7条として含まれる標語。アルコールは胎盤を通過して胎児に影響を与えるため、妊娠中・授乳期の飲酒は禁忌とされる。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>問われ方のパターン</strong>: 「含まれる標語」ではなく「含まれない標語」を選ぶ<strong>否定型</strong>の問題。ひっかけとして機能しやすいので注意。</li><li><strong>一番覚えるべきポイント</strong>: 10か条は「毎日少量でもOK」とは言っていない。<strong>「週2日の休肝日」</strong>が核心的なメッセージ。</li><li><strong>選択肢bのなぜ紛らわしいか</strong>: 「適量なら健康に良い」というイメージがビール文化にはあるが、「毎日飲んでも大丈夫」は一線を越えた表現として10か条には採用されていない。</li><li>適正飲酒・法規制カテゴリは、知識の暗記で確実に点が取れる分野。10か条の標語を5〜6個程度覚えておけば、この種の問題に対応できる。</li></ul>"},{"id":"015","category":"醸造工程","subcategory":"製造工程全体","difficulty":"基礎","topic":"液体変化の順番","keywords":["マイシェ","麦汁","若ビール","製造工程","発酵","糖化","仕込み"],"title":"ビール製造工程における液体の変化順序","questionText":"ビールの製造工程における液体の変化の順番として正しいものを、次の選択肢より選べ。（2017年）","choices":[{"key":"a","text":"若ビール→マイシェ→麦汁→ビール"},{"key":"b","text":"麦汁→マイシェ→若ビール→ビール"},{"key":"c","text":"マイシェ→若ビール→麦汁→ビール"},{"key":"d","text":"マイシェ→麦汁→若ビール→ビール"}],"answer":"d) マイシェ→麦汁→若ビール→ビール","answerKey":"d","explanationHtml":"<h3>なぜ正解か</h3>\n<p>ビール製造における液体の変化は以下の順序で進む：</p>\n<p>1. <strong>マイシェ</strong>：粉砕した麦芽を温水に加えた「おかゆ状」の醪</p>\n<p>2. <strong>麦汁</strong>：マイシェを濾過して得た清澄な液体（ホップを加えて煮沸する）</p>\n<p>3. <strong>若ビール</strong>：麦汁を発酵・熟成させた段階の液体（まだ粗さや雑味が残る）</p>\n<p>4. <strong>ビール</strong>：若ビールをろ過・仕上げして完成した製品</p>\n<h3>背景知識</h3>\n<h4>各液体の詳細と製造工程</h4>\n<pre><code>麦芽（粉砕）＋温水\n<p>        ↓ 糖化（マッシング）</p>\n<p>    【マイシェ】──おかゆ状の醪</p>\n<p>        ↓ 濾過（ロイタリング）</p>\n<p>    【麦汁】──清澄な糖液</p>\n<p>        ↓ ホップ添加・煮沸（殺菌・酵素失活・タンパク凝集除去）</p>\n<p>        ↓ 清澄化（ワールプール等）</p>\n<p>        ↓ 冷却</p>\n<p>        ↓ 酵母添加・主発酵</p>\n<p>        ↓ 熟成（副発酵・ラグリング）</p>\n<p>        ↓ 濾過</p>\n<p>    【若ビール】──粗さ・雑味が残る段階</p>\n<p>        ↓ 仕上げ（炭酸調整・品質検査）</p>\n<p>    【ビール】──完成品&lt;/code&gt;&lt;/pre&gt;</p>\n<h4>各段階の特徴</h4>\n<table><tr><th>液体名</th><th>状態</th><th>主な工程</th></tr><tr><td><strong>マイシェ</strong></td><td>おかゆ状・不透明</td><td>糖化（デンプン→糖）、タンパク休止</td></tr><tr><td><strong>麦汁</strong></td><td>清澄な黄金色の液体</td><td>ホップ煮沸・殺菌・酵素失活</td></tr><tr><td><strong>若ビール</strong></td><td>アルコールあり・粗さ残る</td><td>主発酵終了〜熟成後</td></tr><tr><td><strong>ビール</strong></td><td>製品として完成</td><td>仕上げろ過・炭酸調整</td></tr></table>\n<h4>「麦汁」と「マイシェ」の違い</h4>\n<p>両者とも麦芽由来の液体だが：</p>\n<ul><li><strong>マイシェ</strong>：麦芽の固形分（麦殻など）が混在したおかゆ状。濾過前。</li><li><strong>麦汁（ウォート）</strong>：マイシェを濾過した後の清澄な液体。麦殻などを除去済み。ここからホップを加えて煮沸する。</li></ul>\n<h4>「若ビール」とは</h4>\n<p>英語では <strong>Green Beer（グリーンビール）</strong> または <strong>Young Beer</strong> と呼ばれる。主発酵で糖がアルコールに変換された段階だが、ダイアセチル（バター臭）・アセトアルデヒドなどの不快な副産物がまだ残っており、熟成によってこれらを減少させることで初めて飲み頃のビールになる。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 若ビール→マイシェ→麦汁→ビール</strong>: 誤り。若ビールは発酵後の産物であり、最初に現れることはありえない。完全に逆の流れ。</li><li><strong>b) 麦汁→マイシェ→若ビール→ビール</strong>: 誤り。麦汁はマイシェを濾過して得るもので、マイシェより先には来ない。</li><li><strong>c) マイシェ→若ビール→麦汁→ビール</strong>: 誤り。若ビールは発酵後の産物であり、麦汁より先には来ない。麦汁を発酵させて初めて若ビールが生まれる。</li><li><strong>d) マイシェ→麦汁→若ビール→ビール</strong>: ✓ 正解。糖化→濾過→煮沸・発酵→熟成・仕上げという正しい順序。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「マイ→麦→若→ビ」</strong>：頭文字で「マムワビ」と語呂合わせ</li><li>각 液体の「なりかた」をストーリーで覚える：</li></ul>  1. お粥（マイシェ）を\n<p>  2. 濾して澄んだスープ（麦汁）にして</p>\n<p>  3. 発酵させてお酒（若ビール）にして</p>\n<p>  4. 磨いて完成品（ビール）にする</p>\n<ul><li>問題014（マイシェの温度管理）と連動：マイシェ段階の50℃・65℃・75℃の温度管理がここに位置する</li><li>2017年出題実績あり</li></ul>"},{"id":"015","category":"歴史・文化","subcategory":"日本ビール史・企業","difficulty":"応用","topic":"大日本麦酒の分割","keywords":["大日本麦酒","日本麦酒","朝日麦酒","過度経済力集中排除法","1949年","昭和24年","サッポロビール","アサヒビール"],"title":"大日本麦酒の分割：1949年に生まれた日本麦酒と朝日麦酒","questionText":"1949年（昭和24年）、過度経済力集中排除法に基づき、大日本麦酒は2社に分割されたが、その2社の組み合わせとして正しいものを次の選択肢より選べ。","choices":[{"key":"a","text":"日本麦酒、恵比寿麦酒"},{"key":"b","text":"日本麦酒、朝日麦酒"},{"key":"c","text":"日本麦酒、大阪麦酒"},{"key":"d","text":"朝日麦酒、ユニオンビール"}],"answer":"b) 日本麦酒、朝日麦酒","answerKey":"b","explanationHtml":"<h3>なぜ正解か</h3>\n<p>1949年（昭和24年）、GHQ占領下の日本で施行された<strong>過度経済力集中排除法</strong>に基づき、当時国内シェアの約7割を占めていた<strong>大日本麦酒</strong>が2社に分割された。</p>\n<ul><li><strong>日本麦酒</strong>→ 現在の<strong>サッポロビール</strong></li><li><strong>朝日麦酒</strong>→ 現在の<strong>アサヒビール</strong></li></ul>\n<h3>背景知識</h3>\n<h4>大日本麦酒の成立と解体</h4>\n<p><strong>大日本麦酒（Dainippon Brewery）の誕生（1906年）</strong>：</p>\n<ul><li>1906年（明治39年）、日本の主要ビールメーカーが合併して誕生</li><li>合併した主要企業：</li></ul>  - **日本麦酒醸造会社**（ヱビスビール製造元）\n<p>  - <strong>大阪麦酒会社</strong>（アサヒビール製造元）</p>\n<p>  - <strong>サッポロ麦酒会社</strong>（サッポロビール製造元）</p>\n<ul><li>合併後、国内シェアの大半を占める巨大ビール企業となった</li></ul>\n<p><strong>戦時統制と寡占の拡大</strong>：</p>\n<ul><li>戦時中、ビール生産は国家統制下に置かれ、大日本麦酒と麒麟麦酒の2社体制が強化された</li><li>1940年代には大日本麦酒が国内シェアの約70%を占めた</li></ul>\n<p><strong>1949年の分割</strong>：</p>\n<ul><li>戦後GHQ（連合国軍最高司令官総司令部）の占領政策として、財閥解体・独占禁止が推進された</li><li><strong>過度経済力集中排除法</strong>（1947年制定）に基づき、大日本麦酒を2社に分割</li></ul>  - **日本麦酒株式会社**（東日本を中心：ヱビス・サッポロ系統）→ 後のサッポロビール\n<p>  - <strong>朝日麦酒株式会社</strong>（西日本を中心：アサヒ系統）→ 後のアサヒビール</p>\n<h4>分割後の日本ビール業界の変遷</h4>\n<table><tr><th>時代</th><th>出来事</th></tr><tr><td>1949年</td><td>大日本麦酒が日本麦酒・朝日麦酒に分割</td></tr><tr><td>1950年代</td><td>分割後の両社がシェアを落とす一方、麒麟麦酒がシェア拡大</td></tr><tr><td>昭和40年代（1965〜74年）</td><td><strong>麒麟麦酒が60%超のシェア</strong>を獲得し業界首位を独走</td></tr><tr><td>1987年</td><td>アサヒが「スーパードライ」発売でドライビールブーム牽引</td></tr><tr><td>2001年頃</td><td>アサヒが初めて麒麟（キリン）を抜いて業界首位に</td></tr><tr><td>現在</td><td>キリン・アサヒ・サントリー・サッポロの4大メーカー体制</td></tr></table>\n<h4>各社の現在の名称と系譜</h4>\n<table><tr><th>1949年の社名</th><th>現在の社名</th><th>主なブランド</th></tr><tr><td><strong>日本麦酒</strong></td><td><strong>サッポロビール</strong></td><td>サッポロ黒ラベル、ヱビス、北海道生搾り</td></tr><tr><td><strong>朝日麦酒</strong></td><td><strong>アサヒビール</strong></td><td>スーパードライ、アサヒ生ビール（マルエフ）</td></tr><tr><td>（分割前から独立）麒麟麦酒</td><td><strong>キリンビール</strong></td><td>一番搾り、ラガービール</td></tr></table>\n<p>&gt; サントリーは1963年にビール参入（問008参照）した後発メーカーで、分割とは無関係。</p>\n<h4>過度経済力集中排除法とは</h4>\n<ul><li>1947年（昭和22年）にGHQの指示で制定</li><li>戦時中に肥大化した財閥・独占企業を解体し、自由競争市場を育成することが目的</li><li>ビール業界のほか、電力・製鉄・化学等の多くの分野で企業分割が行われた</li><li>この法律により大日本麦酒が解体され、現在のサッポロ・アサヒ2社体制の起点となった</li></ul>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 日本麦酒、恵比寿麦酒</strong>: 誤り。「恵比寿麦酒」は大日本麦酒設立前（1890年代）のヱビスビールの製造元の名称であり、1949年の分割で生まれた社名ではない。ヱビスブランドは日本麦酒（サッポロ系）に引き継がれた。</li><li><strong>b) 日本麦酒、朝日麦酒</strong>: ✓ 正解。日本麦酒→サッポロビール、朝日麦酒→アサヒビールの前身2社。</li><li><strong>c) 日本麦酒、大阪麦酒</strong>: 誤り。「大阪麦酒会社」は1906年の大日本麦酒設立時に合併した構成企業の一つであり、1949年の分割で生まれた社名ではない。</li><li><strong>d) 朝日麦酒、ユニオンビール</strong>: 誤り。「ユニオンビール」は1949年分割とは無関係の架空・別会社の名称。朝日麦酒は実在するが、もう一方の組み合わせが誤り。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「大日本麦酒→日本麦酒＋朝日麦酒」→「サッポロ＋アサヒ」</strong>：分割前後の社名と現在の社名を3段階でセットで覚える</li><li><strong>「昭和24年（1949年）＝GHQの財閥解体」</strong>：過度経済力集中排除法は財閥解体政策の一環と覚える</li><li><strong>「分割後に麒麟が60%超」</strong>：分割で弱体化した2社を尻目にキリンが伸びた歴史の流れが試験頻出</li><li>選択肢の「恵比寿麦酒」「大阪麦酒」は<strong>1906年合併前の企業名</strong>（1949年分割後の名前ではない）として引っかけに使われている。「何年時点の話か」を意識する</li><li>問013（ヱビスビールのパリ万博受賞）で登場した「日本麦酒醸造会社（ヱビスの製造元）」が大日本麦酒に合併し、さらに分割されて「日本麦酒→サッポロ」に引き継がれるという系譜が一連でつながる</li></ul>"},{"id":"016","category":"原材料","subcategory":"ホップ","difficulty":"応用","topic":"ホップの品種分類","keywords":["ファインアロマホップ","ビターホップ","アロマホップ","テトナング","ザーツ","カスケード","マグナム","ノーブルホップ"],"title":"ホップの品種分類：ファインアロマ・ビター・アロマの違い","questionText":"ホップには様々なタイプがある。次の選択肢より「ファインアロマホップ」に該当するものを選べ。","choices":[{"key":"a","text":"カスケード"},{"key":"b","text":"テトナング"},{"key":"c","text":"マグナム"},{"key":"d","text":"ヘラクレス"}],"answer":"b) テトナング","answerKey":"b","explanationHtml":"<h3>なぜ正解か</h3>\n<p>テトナング（Tettnang）はドイツ南西部・バーデン＝ヴュルテンベルク州原産のホップで、<strong>ファインアロマホップ（Fine Aroma Hop）</strong> に分類される。α酸含量が低く苦味は穏やかだが、上品でスパイシー・フローラルな香りを持つ。同じファインアロマホップにはチェコ産の<strong>ザーツ（Saaz）</strong>がある。</p>\n<h3>背景知識</h3>\n<h4>ホップの機能別分類</h4>\n<p>ホップは主にα酸含量（苦味の強さ）と香りの特性によって分類される：</p>\n<table><tr><th>分類</th><th>特徴</th><th>α酸含量</th><th>代表品種</th></tr><tr><td><strong>ファインアロマホップ</strong></td><td>上品で繊細な香り、苦味は控えめ</td><td>低（3〜5%程度）</td><td>テトナング、ザーツ、ハラタウアー、シュパルター</td></tr><tr><td><strong>アロマホップ</strong></td><td>豊かな香り、苦味もある程度あり</td><td>中（5〜8%程度）</td><td>カスケード、センテニアル、アマリロ</td></tr><tr><td><strong>ビターホップ</strong></td><td>苦味付けに特化、香りは控えめ</td><td>高（10〜20%以上）</td><td>マグナム、ヘラクレス、チヌーク</td></tr><tr><td><strong>デュアルパーパスホップ</strong></td><td>苦味・香り両用</td><td>中〜高</td><td>シムコー、コロンバス</td></tr></table>\n<h4>ファインアロマホップとノーブルホップの関係</h4>\n<p>ファインアロマホップの中でも特に品質が高いとされる伝統的なヨーロッパ産4品種を<strong>ノーブルホップ（貴族ホップ）</strong>と呼ぶ：</p>\n<p>1. <strong>テトナング</strong>（ドイツ・バーデン） — スパイシー・ハーブ香</p>\n<p>2. <strong>ザーツ</strong>（チェコ・ボヘミア） — 上品なフローラル・スパイシー香</p>\n<p>3. <strong>ハラタウアー</strong>（ドイツ・バイエルン） — 穏やかなハーブ・フラワー香</p>\n<p>4. <strong>シュパルター</strong>（ドイツ・シュパルト） — 繊細なスパイス・ハーブ香</p>\n<p>ノーブルホップは伝統的なヨーロッパスタイルのラガー（特にピルスナー）に多用される。</p>\n<h4>各品種の詳細</h4>\n<p><strong>テトナング（Tettnang）</strong></p>\n<ul><li>産地：ドイツ南西部、ボーデン湖畔</li><li>α酸：3〜5%</li><li>香り：スパイシー、ハーブ、わずかにフローラル</li><li>用途：ドイツ系ラガー、ヴァイツェン、ピルスナー</li></ul>\n<p><strong>ザーツ（Saaz / Žatec）</strong></p>\n<ul><li>産地：チェコ北西部・ボヘミア地方</li><li>α酸：3〜4%</li><li>香り：上品なスパイシー・フローラル</li><li>用途：ボヘミアンピルスナー（ピルスナーウルケル等）に不可欠</li></ul>\n<p><strong>カスケード（Cascade）</strong></p>\n<ul><li>産地：アメリカ・ワシントン州ほか</li><li>α酸：4〜7%（中程度）</li><li>香り：シトラス（グレープフルーツ）・フローラル</li><li>用途：アメリカンエール・IPA。アメリカクラフトビール革命を象徴する品種</li></ul>\n<p><strong>マグナム（Magnum）</strong></p>\n<ul><li>産地：ドイツ（ハラタウ地方等）</li><li>α酸：11〜16%（高い）</li><li>用途：煮沸初期の苦味付け用ビターホップとして広く使われる</li></ul>\n<p><strong>ヘラクレス（Herkules）</strong></p>\n<ul><li>産地：ドイツ</li><li>α酸：12〜17%（非常に高い）</li><li>用途：高α酸のビターホップ。効率的な苦味付けに使用</li></ul>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) カスケード</strong>: 誤り。カスケードは<strong>アロマホップ</strong>に分類される。ファインアロマホップではなくアメリカンクラフトビールで多用されるシトラス系の香りが特徴。</li><li><strong>b) テトナング</strong>: ✓ 正解。ドイツ産のファインアロマホップ。ノーブルホップの一つ。</li><li><strong>c) マグナム</strong>: 誤り。マグナムは高α酸の<strong>ビターホップ</strong>。苦味付けに特化しており、香りよりも効率的な苦味付与を目的に使われる。</li><li><strong>d) ヘラクレス</strong>: 誤り。ヘラクレスも<strong>ビターホップ</strong>。α酸含量が非常に高く、少量で強い苦味を付与できるため経済的なビターホップとして使われる。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>ファインアロマ＝ノーブルホップ4品種（テトナング・ザーツ・ハラタウアー・シュパルター）</strong> をまず覚える</li><li><strong>カスケード（アロマ）≠ファインアロマ</strong>: カスケードは「アロマ」だが「ファインアロマ」ではない。この区別が本問のポイント</li><li><strong>マグナム・ヘラクレス＝ビターホップ</strong>（高α酸、ドイツ産）</li><li>分類の判断軸：「α酸が低い→香り重視→ファインアロマ」「α酸が高い→苦味重視→ビター」</li><li>ザーツ＝チェコ産ファインアロマ、テトナング＝ドイツ産ファインアロマ、とセットで産地と紐づけて覚える</li></ul>"},{"id":"016","category":"醸造工程","subcategory":"糖化・マッシング","difficulty":"基礎","topic":"タンパク質分解酵素","keywords":["プロテアーゼ","アミラーゼ","リパーゼ","酵素","タンパク質分解","麦芽","糖化"],"title":"タンパク質をアミノ酸に分解する酵素──プロテアーゼ","questionText":"麦芽内のタンパク質をアミノ酸に分解する酵素名を次の選択肢より選べ。（2017年）","choices":[{"key":"a","text":"アミラーゼ"},{"key":"b","text":"プロテアーゼ"},{"key":"c","text":"ペプチド"},{"key":"d","text":"リパーゼ"}],"answer":"b) プロテアーゼ","answerKey":"b","explanationHtml":"<h3>なぜ正解か</h3>\n<p><strong>プロテアーゼ（Protease）</strong>はタンパク質（Protein）を分解する酵素の総称で、麦芽中のタンパク質をペプチド・アミノ酸へと分解する。問題014（タンパク休止）で扱った50℃保持の工程でまさにこのプロテアーゼが活性化する。分解によって生成されたアミノ酸は、酵母が発酵に利用するFAN（遊離アミノ態窒素）の主要な供給源となる。</p>\n<h3>背景知識</h3>\n<h4>ビール醸造に関わる主な酵素</h4>\n<table><tr><th>酵素名</th><th>基質（分解対象）</th><th>生成物</th><th>活性温度帯</th></tr><tr><td><strong>プロテアーゼ</strong></td><td><strong>タンパク質</strong></td><td><strong>ペプチド・アミノ酸</strong></td><td><strong>45〜55℃</strong></td></tr><tr><td>β‐アミラーゼ</td><td>デンプン</td><td>マルトース（発酵性糖）</td><td>60〜65℃</td></tr><tr><td>α‐アミラーゼ</td><td>デンプン</td><td>デキストリン・糖</td><td>68〜75℃</td></tr><tr><td>リパーゼ</td><td>脂質（油脂）</td><td>脂肪酸・グリセロール</td><td>35〜45℃</td></tr><tr><td>β‐グルカナーゼ</td><td>β‐グルカン（細胞壁多糖）</td><td>低分子多糖</td><td>35〜45℃</td></tr></table>\n<h4>プロテアーゼの役割</h4>\n<p>1. <strong>酵母栄養の供給</strong>：生成されたアミノ酸（FAN）は酵母が健全に発酵するための窒素源</p>\n<p>2. <strong>清澄化への貢献</strong>：高分子タンパク質が残ると低温でのチルヘイズ（冷却濁り）の原因になる</p>\n<p>3. <strong>泡の安定</strong>：適量のペプチドはビール泡の持続性に貢献</p>\n<h4>「プロテアーゼ」という命名規則</h4>\n<p>酵素名は基質名＋「‐アーゼ（-ase）」で命名される規則がある：</p>\n<ul><li><strong>Protein（タンパク質）</strong> → <strong>Prote-ase（プロテアーゼ）</strong></li><li><strong>Starch（デンプン、Amylum）</strong> → <strong>Amylase（アミラーゼ）</strong></li><li><strong>Lipid（脂質）</strong> → <strong>Lipase（リパーゼ）</strong></li></ul>\n<p>この命名規則を覚えると、酵素名から分解対象が推測できる。</p>\n<h4>ペプチドは酵素ではない</h4>\n<p>選択肢cの「ペプチド」はタンパク質の分解産物（アミノ酸が2〜数十個つながった物質）であり、酵素ではない。プロテアーゼによってタンパク質が分解される途中段階の産物がペプチドである。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) アミラーゼ</strong>: 誤り。アミラーゼは<strong>デンプン</strong>を分解する酵素。α‐アミラーゼとβ‐アミラーゼがあり、どちらも糖化（65〜75℃）で活躍。タンパク質は分解しない。</li><li><strong>b) プロテアーゼ</strong>: ✓ 正解。タンパク質を分解してペプチド・アミノ酸を生成する。タンパク休止（50℃帯）で活性化。</li><li><strong>c) ペプチド</strong>: 誤り。ペプチドは酵素ではなく、タンパク質が分解されてできる<strong>中間産物</strong>（アミノ酸の短鎖）。プロテアーゼの生成物の一つ。</li><li><strong>d) リパーゼ</strong>: 誤り。リパーゼは<strong>脂質（油脂）</strong>を脂肪酸とグリセロールに分解する酵素。麦芽中にも存在するが、ビール醸造では主役ではない。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「プロテアーゼ＝プロテイン（タンパク）を分解」</strong>：命名規則（基質名＋ase）で覚える</li><li>酵素名の三本柱セットで記憶：</li></ul>  - **プロテアーゼ → タンパク質**（50℃・タンパク休止）\n<p>  - <strong>アミラーゼ → デンプン</strong>（65〜75℃・糖化）</p>\n<p>  - <strong>リパーゼ → 脂質</strong>（35〜45℃）</p>\n<ul><li>問題014（タンパク休止50℃）と直結：50℃で活性化する酵素がプロテアーゼ</li><li>問題012（アルファアミラーゼ）とも連動：糖化のアミラーゼとタンパク分解のプロテアーゼを区別する</li><li>公式テキスト16ページ（2022年5月改訂版）出典。2017年出題実績あり</li></ul>"},{"id":"016","category":"歴史・文化","subcategory":"ビールの飲み方・サービス","difficulty":"基礎","topic":"3度注ぎ","keywords":["3度注ぎ","缶ビール","注ぎ方","泡","グラス","泡の蓋","ビールサービス","泡立て"],"title":"3度注ぎ：缶ビールをおいしく飲む注ぎ方","questionText":"一般的な缶ビールをおいしく飲むための方法に「3度注ぎ」がある。この説明として誤っているものを次の選択肢より選べ。（2017年）","choices":[{"key":"a","text":"グラスは傾けず、水平なところに置く"},{"key":"b","text":"最初は泡がグラスの半分程度になるまで勢いよく注ぐ"},{"key":"c","text":"2度目はグラスの9割程度になるまで勢いよく注ぐ"},{"key":"d","text":"3度目は少しグラスのふちに泡が盛り上がるように慎重に注ぐ"}],"answer":"c) 2度目はグラスの9割程度になるまで勢いよく注ぐ","answerKey":"c","explanationHtml":"<h3>なぜ正解か</h3>\n<p>2度目の注ぎは「<strong>勢いよく（×）</strong>」ではなく「<strong>ゆっくり・静かに</strong>」注ぐのが正しい。缶の口をグラスの縁に近づけ、泡をあまり立てないようにしながらグラスの9割程度まで静かに注ぐ。「泡の蓋をそのまま上げていくイメージ」で注ぐのがポイント。「グラスの9割程度まで」という量は合っているが、「勢いよく」という注ぎ方が誤り。</p>\n<h3>背景知識</h3>\n<h4>3度注ぎの手順</h4>\n<table><tr><th>回</th><th>操作</th><th>目的</th></tr><tr><td><strong>1度目</strong></td><td>グラスを水平に置き、缶を高めの位置から<strong>勢いよく</strong>注いで泡をグラスの<strong>半分程度</strong>まで作る</td><td>大きな泡を作り、炭酸を一気に放出させる</td></tr><tr><td><strong>待つ</strong></td><td>泡が落ち着くまで（グラスの3分の1程度になるまで）待つ</td><td>粗い気泡が消え、細かくきめ細かい泡に変わる</td></tr><tr><td><strong>2度目</strong></td><td>缶の口をグラスの縁に近づけ、<strong>ゆっくり・静かに</strong>グラスの<strong>9割程度</strong>まで注ぐ</td><td>泡の層を崩さず、液体部分を静かに増やす</td></tr><tr><td><strong>待つ</strong></td><td>泡が落ち着くまで少し待つ</td><td>泡面が安定する</td></tr><tr><td><strong>3度目</strong></td><td>泡がグラスのふちから少し<strong>盛り上がるように慎重に</strong>注いで仕上げる</td><td>きめ細かい泡のドームを作る</td></tr></table>\n<h4>3度注ぎの科学的根拠</h4>\n<p><strong>なぜ泡が大切か</strong>：</p>\n<ul><li>ビールの泡（泡蓋）はビールが空気に触れるのを防ぎ、<strong>酸化を抑制</strong>する</li><li>泡があることでビールの香り成分が揮散しにくくなり、香りが保たれる</li><li>きめ細かい泡はビールの苦みをマイルドにし、なめらかな飲み口を生む</li></ul>\n<p><strong>1度目を勢いよく注ぐ理由</strong>：</p>\n<ul><li>最初に大きな泡（粗い気泡）を作ることで、余分な炭酸ガスを一気に放出させる</li><li>粗い泡が落ち着くと、タンパク質や苦み成分がネットワークを形成したきめ細かい泡に変化する</li></ul>\n<p><strong>2度目をゆっくり注ぐ理由</strong>：</p>\n<ul><li>1度目でできた泡の層（泡蓋）を崩さないため</li><li>新たな粗い泡を作らず、既存の泡の下に液体を静かに加えていく</li><li>「泡の蓋をそのまま上げていくイメージ」が重要</li></ul>\n<p><strong>3度目で盛り上げる理由</strong>：</p>\n<ul><li>グラスのふちより少し高く盛り上げることで、泡が厚くなり酸化防止効果が高まる</li><li>見た目の美しさも向上し、飲む楽しみが増す</li></ul>\n<h4>グラスを傾けない理由（選択肢 a との関係）</h4>\n<p>缶ビールの3度注ぎでは、グラスを<strong>傾けずに水平に置く</strong>のが基本。</p>\n<ul><li>缶の高さを変えることで勢いを調整するため、グラス自体を動かす必要がない</li><li>瓶ビールや生ビールのサーバーを使う場合は、グラスを傾けて注ぐ方法もある（グラスに沿わせてゆっくり注ぎ最後に立てる）</li><li><strong>缶ビール3度注ぎ</strong>と<strong>グラスを使った通常の注ぎ方</strong>の違いを混同しないよう注意</li></ul>\n<h4>理想的なビールの泡と液体の比率</h4>\n<ul><li>一般的に推奨されるビール：泡の比率は<strong>7:3</strong>（ビール7割・泡3割）</li><li>泡が少なすぎると酸化しやすく、炭酸も逃げやすい</li><li>泡が多すぎるとビールの量が減り、風味のバランスが崩れる</li></ul>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) グラスは傾けず、水平なところに置く</strong>: 正しい記述。缶ビールの3度注ぎではグラスを水平に置き、缶の高さで勢いを調整する。</li><li><strong>b) 最初は泡がグラスの半分程度になるまで勢いよく注ぐ</strong>: 正しい記述。1度目は勢いよく注いで泡を半分程度まで作るのが正しい手順。</li><li><strong>c) 2度目はグラスの9割程度になるまで勢いよく注ぐ</strong>: ✓ <strong>誤り（正解）</strong>。2度目は「勢いよく」ではなく「ゆっくり・静かに」注ぐ。到達量（9割程度）は正しいが注ぎ方が間違い。</li><li><strong>d) 3度目は少しグラスのふちに泡が盛り上がるように慎重に注ぐ</strong>: 正しい記述。3度目は慎重にふちから盛り上がるように仕上げる。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「1度目：勢いよく・2度目：ゆっくり・3度目：慎重に」</strong>：注ぎ方のリズムの変化で覚える</li><li><strong>「量」と「速さ」を混同しない</strong>：選択肢 c は「量（9割）」は正しいが「速さ（勢いよく）」が誤り。この構造は問006（女性の体内水分量）と同じく「正しい数値＋誤った説明」型の引っかけ</li><li><strong>缶ビールの高さで勢いを調整</strong>：缶を高く持てば勢いよく、低く（グラス縁に近づけて）持てばゆっくり注げる</li><li><strong>泡の役割3点</strong>：①酸化防止、②香りの保持、③なめらかな飲み口。これを覚えると「なぜ泡が大切か」という問いにも答えられる</li><li>「誤っているものを選べ」型は、一部だけ誤っている選択肢（量は正しいが速さが誤り）が正解になる場合が多い。選択肢の全要素を確認する習慣をつける</li></ul>"},{"id":"017","category":"原材料","subcategory":"麦芽","difficulty":"基礎","topic":"ビール醸造の主要穀物","keywords":["大麦","二条大麦","六条大麦","小麦","麦芽","ヴァイツェン","オーツ麦","穀物"],"title":"ビールの主原料：大麦と二条・六条の違い","questionText":"一言で、「麦」といっても様々な種類がある。ビールで使用されている麦のうち、そのほとんどを占める麦の種類を次の選択肢より選べ。","choices":[{"key":"a","text":"小麦"},{"key":"b","text":"大麦"},{"key":"c","text":"ライ麦"},{"key":"d","text":"燕麦"}],"answer":"b) 大麦","answerKey":"b","explanationHtml":"<h3>なぜ正解か</h3>\n<p>世界のビール醸造において、使用される穀物の大部分は<strong>大麦（Barley / <em>Hordeum vulgare</em>）</strong>である。大麦は製麦（モルティング）に適した性質を持ち、アミラーゼなどの糖化酵素が発芽時に豊富に生成されるため、ビール醸造の主原料として世界的に広く使われている。大麦を発芽・乾燥させた<strong>麦芽（モルト）</strong>がビールの色・風味・アルコールのもととなる。</p>\n<h3>背景知識</h3>\n<h4>大麦の二条・六条の違い</h4>\n<p>大麦は穗に実る穀粒の列数によって分類される：</p>\n<table><tr><th>種類</th><th>穀粒の列数</th><th>特徴</th><th>主な用途</th></tr><tr><td><strong>二条大麦</strong></td><td>2列</td><td>粒が大きく均一。デンプン多く、タンパク質少なめ。醸造適性が高い</td><td>ビール醸造（主流）</td></tr><tr><td><strong>六条大麦</strong></td><td>6列</td><td>粒がやや小さく不均一。タンパク質が多め</td><td>食用・飼料・一部醸造</td></tr></table>\n<p>日本を含む多くの国のビール醸造では<strong>二条大麦</strong>が主に使われる。二条大麦は発芽が均一で酵素力価が高く、ビール醸造に最も適した品種群とされる。</p>\n<h4>大麦がビール醸造に適している理由</h4>\n<p>1. <strong>酵素力価が高い</strong>: 発芽時にアミラーゼ（糖化酵素）が豊富に生成され、デンプンを効率よく糖に変換できる</p>\n<p>2. <strong>穀皮がろ過助剤になる</strong>: 大麦の穀皮（チャフ）は麦汁ろ過（ラウタリング）の際に自然なフィルター層を形成する</p>\n<p>3. <strong>デンプン含量が高い</strong>: アルコール生成の原料となる発酵性糖を多く供給できる</p>\n<p>4. <strong>製麦のしやすさ</strong>: 発芽制御が比較的容易</p>\n<h4>他の穀物のビールでの使用</h4>\n<p>大麦以外の穀物もビール醸造に使われるが、補助原料・副原料の位置づけが多い：</p>\n<table><tr><th>穀物</th><th>ビールでの役割</th><th>代表スタイル</th></tr><tr><td><strong>小麦</strong></td><td>白濁・フルーティな風味・泡持ち向上</td><td>ヴァイツェン（独）、ヴィット（ベルギー）、アメリカンウィート</td></tr><tr><td><strong>ライ麦</strong></td><td>スパイシー・ドライな風味</td><td>ロッゲンビア、ライウィート</td></tr><tr><td><strong>燕麦（オーツ）</strong></td><td>クリーミーなマウスフィール</td><td>オートミールスタウト</td></tr><tr><td><strong>米・コーン</strong></td><td>軽い飲み口（大量生産ラガー）</td><td>アメリカンラガー、日本の発泡酒</td></tr></table>\n<h4>日本の酒税法とビールの定義</h4>\n<p>日本の酒税法では、ビールの原料として「麦芽・ホップ・水」が基本。麦芽は主に大麦麦芽を指す。麦芽使用比率が50%以上の場合に「ビール」と定義され、それ未満は「発泡酒」となる（改正後は規定がやや異なる）。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 小麦</strong>: 誤り。小麦はヴァイツェン（小麦ビール）など一部のスタイルで使われる重要な原料だが、ビール全体の使用量では大麦がはるかに多く「ほとんどを占める」とは言えない。</li><li><strong>b) 大麦</strong>: ✓ 正解。世界のビール醸造の主原料。二条大麦が最も多用される。</li><li><strong>c) ライ麦</strong>: 誤り。ライ麦はロッゲンビアなど一部のスタイルで使われるが、使用量・スタイル数ともに大麦に比べて少数。また製麦の際に粘性が高くなり扱いが難しい側面もある。</li><li><strong>d) 燕麦（オーツ麦）</strong>: 誤り。燕麦はオートミールスタウトなどでクリーミーな口当たりを出すために副原料として使われるが、使用量は限定的。ビール全体の主原料とは言えない。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「ビール＝大麦（麦芽）」</strong> がまず大前提</li><li><strong>二条大麦＝醸造用、六条大麦＝食用・飼料用</strong> と覚える</li><li>「2列→醸造（ビール）」「6列→食（ご飯・味噌）」とイメージで区別</li><li>小麦ビールの代表<strong>ヴァイツェン</strong>（独語で小麦）は小麦麦芽50%以上使用が特徴 → 「小麦は特殊スタイル、基本は大麦」</li><li>大麦の穀皮がろ過フィルターになる（ラウタリング）点は醸造工程問題でも出題されるポイント</li></ul>"},{"id":"017","category":"歴史・文化","subcategory":"日本ビール史・企業","difficulty":"応用","topic":"キリンビールの前身","keywords":["ジャパン・ブルワリー・カンパニー","キリンビール","スプリング・バレー・ブルワリー","岩崎弥之助","横浜","1885年","明治18年","麒麟"],"title":"キリンビールの前身：ジャパン・ブルワリー・カンパニー","questionText":"1885（明治18）年に横浜で創業、3年後、「キリンビール」を発売した現キリンホールディングス（キリンビール）の前身である会社を、次の選択肢より選べ。（2017年）","choices":[{"key":"a","text":"アマヌマ・ビヤザケ"},{"key":"b","text":"ジャパン・ブルワリー・カンパニー"},{"key":"c","text":"スプリング・バレー・ブルワリー"},{"key":"d","text":"ヨコハマ・ブルワリー"}],"answer":"b) ジャパン・ブルワリー・カンパニー","answerKey":"b","explanationHtml":"<h3>なぜ正解か</h3>\n<p>1885年（明治18年）、横浜にあったスプリング・バレー・ブルワリーの跡地に<strong>ジャパン・ブルワリー・カンパニー（Japan Brewery Company）</strong>が設立された。外国人実業家が中心となり、三菱財閥の<strong>岩崎弥之助</strong>が日本人唯一の株主として参加。1888年（明治21年）に東洋の霊獣「麒麟」をラベルに採用した「<strong>キリンビール</strong>」を発売したのがキリン（現キリンホールディングス）の起点となっている。</p>\n<h3>背景知識</h3>\n<h4>キリンビール誕生の系譜</h4>\n<pre><code>スプリング・バレー・ブルワリー（1869年〜1884年）\n<p>          ↓ 閉業後、跡地に設立</p>\n<p>ジャパン・ブルワリー・カンパニー（1885年設立）</p>\n<p>          ↓ 1888年「キリンビール」発売</p>\n<p>麒麟麦酒株式会社（1907年設立）</p>\n<p>          ↓ 現在</p>\n<p>キリンホールディングス / キリンビール株式会社&lt;/code&gt;&lt;/pre&gt;</p>\n<h4>スプリング・バレー・ブルワリー（Spring Valley Brewery）</h4>\n<ul><li><strong>創業</strong>：1869年（明治2年）</li><li><strong>創業者</strong>：アメリカ人醸造家<strong>ウィリアム・コープランド（William Copeland）</strong></li><li><strong>場所</strong>：横浜・山手（現在の麒麟麦酒横浜工場近辺）</li><li><strong>意義</strong>：日本で本格的な近代ビール醸造を行った先駆け的存在。居留地の外国人向けに販売していたが、日本人向けの商業展開は限定的だった</li><li><strong>閉業</strong>：1884年（明治17年）に経営難で閉業</li><li><strong>現在</strong>：キリンが「SPRING VALLEY BREWERY」ブランドをクラフトビール部門として復活させている（2014年〜）</li></ul>\n<h4>ジャパン・ブルワリー・カンパニーの設立</h4>\n<ul><li><strong>設立年</strong>：1885年（明治18年）</li><li><strong>設立地</strong>：横浜（スプリング・バレー・ブルワリーの跡地）</li><li><strong>中心人物</strong>：外国人実業家（主に居留地の商人・外交官）</li><li><strong>日本人株主</strong>：<strong>岩崎弥之助</strong>（三菱財閥2代目。岩崎弥太郎の弟）が日本人唯一の株主として参加</li><li><strong>1888年</strong>：ラベルに中国神話の霊獣「麒麟（キリン）」を採用した「キリンビール」を発売</li></ul>\n<h4>岩崎弥之助と三菱財閥</h4>\n<ul><li><strong>岩崎弥之助</strong>（1851〜1908年）：岩崎弥太郎（三菱創業者）の実弟で第2代社長</li><li>問013（ヱビスビールの馬越恭平）でも「三菱財閥の岩崎弥太郎の支援」が登場したが、キリンに関わったのは弟の<strong>弥之助</strong>であることに注意</li><li>三菱財閥はビール業界の複数の場面に登場する重要なキーワード</li></ul>\n<h4>麒麟麦酒株式会社への移行</h4>\n<ul><li><strong>1907年（明治40年）</strong>：ジャパン・ブルワリー・カンパニーを引き継ぐ形で日本資本の<strong>麒麟麦酒株式会社</strong>が設立される</li><li>以後、キリン（麒麟麦酒）は日本資本のビール会社として発展</li><li>問015で解説した通り、1949年の大日本麦酒分割時に麒麟は独立を維持し、昭和40年代には60%超のシェアを獲得</li></ul>\n<h4>日本のビール会社設立年の比較</h4>\n<table><tr><th>設立年</th><th>会社名（当時）</th><th>現在</th></tr><tr><td>1869年</td><td>スプリング・バレー・ブルワリー</td><td>キリンの源流（閉業→後継）</td></tr><tr><td><strong>1885年</strong></td><td><strong>ジャパン・ブルワリー・カンパニー</strong></td><td><strong>キリンビール（前身）</strong></td></tr><tr><td>1876年</td><td>開拓使麦酒醸造所</td><td>サッポロビール（源流）</td></tr><tr><td>1887年</td><td>日本麦酒醸造会社</td><td>サッポロビール（ヱビス系）</td></tr><tr><td>1889年</td><td>大阪麦酒会社</td><td>アサヒビール（前身）</td></tr><tr><td>1907年</td><td>麒麟麦酒株式会社</td><td>キリンビール（法人格の直接前身）</td></tr></table>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) アマヌマ・ビヤザケ</strong>: 誤り。実在しない架空の社名。「アマヌマ（天沼？）」「ビヤザケ」という名称は日本のビール史に登場しない。</li><li><strong>b) ジャパン・ブルワリー・カンパニー</strong>: ✓ 正解。1885年横浜設立、1888年にキリンビール発売。岩崎弥之助が唯一の日本人株主。</li><li><strong>c) スプリング・バレー・ブルワリー</strong>: 誤り。キリンの<strong>さらに前の源流</strong>にあたる醸造所（1869〜1884年）。1884年に閉業しており、1885年に設立されたジャパン・ブルワリー・カンパニーの<strong>前身</strong>にあたる。「キリンビールを発売した会社」ではなくキリンの源泉となった会社。引っかけとして最も紛らわしい選択肢。</li><li><strong>d) ヨコハマ・ブルワリー</strong>: 誤り。実在しない架空の社名。「ヨコハマ（横浜）」という地名が入っておりもっともらしく見えるが、キリン史に登場しない。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「スプリング・バレー（1869）→ジャパン・ブルワリー（1885）→キリンビール発売（1888）→麒麟麦酒（1907）」</strong>という4段階の系譜をセットで覚える</li><li><strong>スプリング・バレーとジャパン・ブルワリーの混同注意</strong>：どちらも横浜のビール醸造に関わるが、キリンビールを発売したのはジャパン・ブルワリー・カンパニー</li><li><strong>岩崎「弥之助」と「弥太郎」の区別</strong>：弥太郎は三菱創業者・ヱビス系に関係、弥之助はキリン系に関係</li><li><strong>1885年＝明治18年</strong>：明治は1868年始まりなので「18-1=17年後」が1885年（計算：1868+17=1885）</li><li>「キリン」の名の由来が「東洋の霊獣・麒麟」であること、ラベルデザインにその姿が描かれていることも関連知識として覚えておく</li></ul>"},{"id":"017","category":"ブランド・銘柄","subcategory":"日本のビールブランド","difficulty":"発展","topic":"サッポロビールCM・三船敏郎","keywords":["三船敏郎","サッポロビール","男は黙ってサッポロビール","テレビCM","昭和45年","1970年","黒澤明"],"title":"「男は黙ってサッポロビール」CMに出演した俳優","questionText":"かつて、「男は黙ってサッポロビール」のテレビＣＭに出演した俳優を次の選択肢より選べ。","choices":[{"key":"a","text":"三船 敏郎"},{"key":"b","text":"石原 裕次郎"},{"key":"c","text":"三浦 友和"},{"key":"d","text":"渡 哲也"}],"answer":"a) 三船 敏郎","answerKey":"a","explanationHtml":"<h3>なぜ正解か</h3>\n<p>「<strong>男は黙ってサッポロビール</strong>」は、<strong>三船敏郎</strong>（みふね としろう、1920〜1997）が出演したサッポロビールのテレビCMのキャッチコピーで、<strong>1970（昭和45）年〜1972（昭和47）年</strong>に放映された。無口で男らしい三船のイメージと「黙って」という言葉が見事に合致し、日本のCM史に残る名作として語り継がれる。</p>\n<h3>背景知識</h3>\n<h4>三船敏郎とサッポロビールCM</h4>\n<p>三船敏郎は黒澤明監督作品の常連俳優で、国際的にも高い評価を受けた日本映画界の巨星。「羅生門」「七人の侍」「椿三十郎」「用心棒」などで侍の強さと沈黙の美学を体現したイメージが、「男は黙って」というコピーに重なり、強烈な印象を与えた。</p>\n<table><tr><th>項目</th><th>内容</th></tr><tr><td>CM放映期間</td><td>1970（昭和45）年〜1972（昭和47）年</td></tr><tr><td>キャッチコピー</td><td>「男は黙ってサッポロビール」</td></tr><tr><td>出演俳優</td><td>三船敏郎</td></tr><tr><td>ブランド</td><td>サッポロビール</td></tr><tr><td>時代背景</td><td>大阪万博（1970年）の年、高度成長期の末期</td></tr></table>\n<h4>各選択肢の俳優とビールCMの関係</h4>\n<p>選択肢に並ぶ4名は全員、昭和を代表する男優であり、各社ビールCMとの関わりが深いことから混同しやすい。</p>\n<table><tr><th>俳優</th><th>代表作・特徴</th><th>ビールとの関係</th></tr><tr><td><strong>三船敏郎</strong></td><td>黒澤映画（羅生門・七人の侍）、国際的映画スター</td><td>サッポロ「男は黙って〜」（1970〜72年）</td></tr><tr><td>石原裕次郎</td><td>日活映画、「太陽の季節」、裕次郎ブランド</td><td>ニッカウヰスキーのCMで有名（ビールではない）</td></tr><tr><td>三浦友和</td><td>山口百恵との共演、NHK大河など</td><td>ビールCMへの目立った出演なし</td></tr><tr><td>渡哲也</td><td>日活映画、「大都会」「西部警察」</td><td>サッポロビール「男の料理」シリーズ等（別キャンペーン）</td></tr></table>\n<h4>日本のビールCM史における名作コピー</h4>\n<p>昭和〜平成のビールCMはブランドイメージを確立する上で重要な役割を担った：</p>\n<ul><li>サッポロ「男は黙ってサッポロビール」（1970年〜）三船敏郎</li><li>キリン「一番搾り」シリーズ（1990年代〜）多数の俳優</li><li>アサヒ「スーパードライ」（1987年〜）辛口生ビールとしての定着</li></ul>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) 三船敏郎</strong>: ✓ 正解。1970〜1972年のサッポロビールCM「男は黙ってサッポロビール」に出演。黒澤映画の侍イメージと「黙って」というコピーが完璧にマッチ。</li><li><strong>b) 石原裕次郎</strong>: 誤り。昭和を代表する俳優だが、CMでの代名詞はニッカウヰスキー。サッポロビールの「男は黙って〜」とは無関係。</li><li><strong>c) 三浦友和</strong>: 誤り。山口百恵のパートナーとして知られる俳優。当該CMへの出演歴はない。</li><li><strong>d) 渡哲也</strong>: 誤り。石原裕次郎と同じく日活・日本映画の重鎮で、男臭い雰囲気でサッポロビールとも関わりはあるが、「男は黙って〜」のCMに出演したのは三船敏郎。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「黙って＝三船」</strong>：無言の侍・国際スター三船敏郎のイメージと「男は黙って」が一致</li><li>放映年と大阪万博（1970年）をリンク：同じ昭和45年</li><li>石原裕次郎→ニッカ（ウイスキー）、三船敏郎→サッポロ（ビール）と紐付けておく</li><li>CMのキャッチコピー「男は黙ってサッポロビール」は現在でも広告コピーの名作として引用される</li></ul>"},{"id":"018","category":"醸造工程","subcategory":"麦汁煮沸・清澄化","difficulty":"発展","topic":"ブルッフ・タンパク凝固物","keywords":["ブルッフ","タンパク凝固物","麦汁煮沸","ホットブレイク","タンニン","清澄化","仕込工程"],"title":"麦汁煮沸で生成されるタンパク質の凝固物──ブルッフ","questionText":"ビールの仕込工程において行なわれる麦汁煮沸で生成される、タンパク質を主とした凝固物を何というか、次の選択肢より適切なものを選べ。","choices":[{"key":"a","text":"マイシェ"},{"key":"b","text":"ブルッフ"},{"key":"c","text":"タンニン"},{"key":"d","text":"シュタイン"}],"answer":"b) ブルッフ","answerKey":"b","explanationHtml":"<h3>なぜ正解か</h3>\n<p>麦汁の煮沸中、熱によってタンパク質が変性・凝集し、ホップのタンニンと結合して形成される<strong>凝固物</strong>を<strong>ブルッフ（Bruch）</strong>という。ドイツ語で「破片・砕けたもの」を意味する言葉で、英語では<strong>ホットブレイク（Hot Break）</strong>とも呼ばれる。かつての醸造技術者はブルッフの生成状態だけを見て、煮沸の適正な時間を経験的に判断していた。</p>\n<h3>背景知識</h3>\n<h4>ブルッフとは何か</h4>\n<p>麦汁を煮沸すると、以下のメカニズムで凝固物が生じる：</p>\n<pre><code>高分子タンパク質（麦芽由来）\n<p>＋</p>\n<p>タンニン（ホップ・麦芽由来のポリフェノール）</p>\n<p>        ↓ 煮沸による熱変性・結合</p>\n<p>    【ブルッフ（凝固物）】</p>\n<p>        ↓ 除去（ワールプール・沈降）</p>\n<p>    清澄な麦汁&lt;/code&gt;&lt;/pre&gt;</p>\n<h4>ブルッフ除去の重要性</h4>\n<table><tr><th>ブルッフが残ると</th><th>ブルッフを除去すると</th></tr><tr><td>発酵に悪影響（酵母の健全性低下）</td><td>酵母が健全に発酵できる</td></tr><tr><td>ビールに渋み・雑味が残る</td><td>クリアでクリーンな風味</td></tr><tr><td>フィルタリングが困難</td><td>清澄なビールに仕上がる</td></tr></table>\n<h4>ホットブレイク（Hot Break）とコールドブレイク（Cold Break）</h4>\n<p>煮沸・冷却の各段階でタンパク質の凝固が起きる：</p>\n<table><tr><th>名称</th><th>日本語名</th><th>タイミング</th><th>メカニズム</th></tr><tr><td><strong>Hot Break（ホットブレイク）</strong></td><td><strong>ブルッフ</strong></td><td><strong>煮沸中（高温）</strong></td><td><strong>熱変性・タンニンとの結合</strong></td></tr><tr><td>Cold Break（コールドブレイク）</td><td>冷却タンパク沈殿</td><td>冷却時（低温）</td><td>温度低下による高分子タンパクの析出</td></tr></table>\n<h4>ブルッフの生成と煮沸時間の関係</h4>\n<p>ブルッフは煮沸開始後一定時間（通常30〜45分程度）で急激に生成・凝集し始める。この状態を「ブレイク（Break）」と呼ぶ。かつての職人はブルッフが大きな塊として明瞭に沈降し始める様子を目視して「煮沸が十分進んだ」と判断した。</p>\n<h4>ワールプール（Whirlpool）によるブルッフ除去</h4>\n<p>現代の醸造設備では<strong>ワールプール槽</strong>と呼ばれるタンクに熱い麦汁を接線方向に送り込み、遠心力でブルッフをタンク中央に集めて除去する。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) マイシェ</strong>: 誤り。マイシェは糖化工程で麦芽を温水に混合したおかゆ状の醪のこと（問題015参照）。煮沸で生成される凝固物ではない。</li><li><strong>b) ブルッフ</strong>: ✓ 正解。ドイツ語で「破片」を意味し、煮沸中に生成するタンパク質とタンニンの凝固物。英語名はホットブレイク（Hot Break）。</li><li><strong>c) タンニン</strong>: 誤り。タンニンはホップや麦芽由来のポリフェノールで、ブルッフを形成する<strong>成分の一つ</strong>ではあるが、ブルッフそのものではない。タンニン単体は苦渋味成分として知られる。</li><li><strong>d) シュタイン</strong>: 誤り。シュタイン（Stein）はドイツ語で「石・岩」を意味し、ビールジョッキ（Bierkrug）の俗称として使われることがある。醸造工程の凝固物の名称ではない。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「煮沸でブレイク（Break）＝ブルッフ」</strong>：英語名ホットブレイクと対応させて覚える</li><li>タンニン（成分）とブルッフ（凝固物）を混同しない：タンニンはブルッフの材料の一つ</li><li>生成のメカニズム：<strong>タンパク質＋タンニン→熱→ブルッフ</strong></li><li>問題014（タンパク休止）・問題015（製造工程）・問題016（プロテアーゼ）と連動するタンパク質管理の一連の知識</li><li>かつての職人がブルッフの目視で煮沸時間を判断したエピソードは、試験の説明文としても登場しやすい</li></ul>"},{"id":"018","category":"ビアスタイル","subcategory":"ラガースタイル","difficulty":"基礎","topic":"ピルスナーの誕生","keywords":["ピルスナー","ピルゼン","ボヘミア","ヨーゼフ・グロル","1842年","軟水","淡色麦芽","下面発酵"],"title":"ピルスナーの誕生：1842年ピルゼンで生まれた黄金色の革命","questionText":"1842年にボヘミア（現チェコ共和国）のピルゼンで生まれた、ホップの効いた淡色の下面発酵ビールを次の選択肢より選べ。","choices":[{"key":"a","text":"ドルトムントビール"},{"key":"b","text":"ランビック"},{"key":"c","text":"ピルスナー"},{"key":"d","text":"ペールエール"}],"answer":"c) ピルスナー","answerKey":"c","explanationHtml":"<h3>なぜ正解か</h3>\n<p>1842年、チェコ（当時オーストリア帝国領ボヘミア）のピルゼン市（現プルゼニュ）で誕生したのが<strong>ピルスナー</strong>である。ピルゼン市民醸造所がミュンヘンから招いた醸造技師<strong>ヨーゼフ・グロル（Josef Groll）</strong>の指導のもと、下面発酵を導入。本来は濃色ビールができる予定だったが、①ピルゼンの醸造水が<strong>軟水</strong>（ミネラル分が少ない）だったこと、②最新乾燥技術による<strong>淡色麦芽</strong>が使用されたことにより、世界初の<strong>黄金色に輝く淡色ラガー</strong>が誕生した。これが現在の世界市場を席巻するピルスナースタイルの原点である。</p>\n<h3>背景知識</h3>\n<h4>ピルスナー誕生の3要素</h4>\n<table><tr><th>要素</th><th>内容</th><th>影響</th></tr><tr><td><strong>軟水</strong></td><td>ピルゼンの水はミネラル分が極めて少ない</td><td>苦味が穏やかでクリア、ホップの香りが際立つ</td></tr><tr><td><strong>淡色麦芽</strong></td><td>最新の間接加熱乾燥炉で作られた低色度麦芽</td><td>黄金色の澄んだビールの色調</td></tr><tr><td><strong>下面発酵（ラガー酵母）</strong></td><td>ミュンヘンから技術導入</td><td>クリーンでクリスプな風味</td></tr></table>\n<p>この3要素が重なって「黄金色・澄んだ・ホップ感のあるラガー」というピルスナーの特徴が生まれた。</p>\n<h4>ヨーゼフ・グロルについて</h4>\n<p>ヨーゼフ・グロル（1813〜1887）はバイエルン（ミュンヘン近郊）出身の醸造技師。1842年にピルゼン市民醸造所（ブルゲルリヘス・ブラウハウス）に招聘され、下面発酵ラガーの技術を伝えた。本人が意図したわけではなく、偶然の産物としてピルスナーが誕生したという側面がある。</p>\n<h4>ピルスナーの世界的普及</h4>\n<p>ピルスナーは誕生後、急速に世界に広まった背景がある：</p>\n<ul><li><strong>ガラスコップの普及</strong>: 19世紀後半に透明なガラスの食器が庶民に広まり、ビールの黄金色の美しさが視覚的な魅力となった</li><li><strong>鉄道の発達</strong>: 瓶ビールの遠距離輸送が可能になり、ピルスナーが欧州全土に拡散</li><li><strong>冷凍技術の進歩</strong>: 低温醸造（ラガー）が季節・地域を問わず可能に</li></ul>\n<p>現在、世界のビール生産量の約80〜90%がピルスナータイプといわれる。</p>\n<h4>ピルスナースタイルの分類</h4>\n<p>「ピルスナー」は大きく3つのサブタイプに分かれる：</p>\n<table><tr><th>タイプ</th><th>産地</th><th>特徴</th></tr><tr><td><strong>ボヘミアンピルスナー</strong></td><td>チェコ（ピルゼン）</td><td>軟水由来のまろやかさ、ザーツホップの上品な香り。ピルスナーウルケルが代表</td></tr><tr><td><strong>ジャーマンピルスナー</strong></td><td>ドイツ北部</td><td>よりドライで苦味強め。硬水地域の影響</td></tr><tr><td><strong>アメリカンピルスナー</strong></td><td>アメリカ</td><td>米・コーンを副原料に使いより軽くライト</td></tr></table>\n<h4>水質とビールスタイルの関係</h4>\n<p>ピルゼンの軟水はピルスナーに最適だが、他の名産地も水質とスタイルが対応している：</p>\n<ul><li><strong>ピルゼン（軟水）</strong> → ピルスナー</li><li><strong>ミュンヘン（中硬水）</strong> → マルツェン・ヘレス</li><li><strong>ダブリン（硬水・炭酸水素塩）</strong> → スタウト（アイリッシュスタウト）</li><li><strong>バートン（硫酸塩硬水）</strong> → ペールエール・IPA</li></ul>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) ドルトムントビール</strong>: 誤り。ドルトムントビール（エクスポート）はドイツ・ドルトムント発祥の淡色ラガーだが、ピルゼン産ではなくドイツ産。硬水地域で生まれたやや甘みのある淡色ラガーで、ピルスナーとは別スタイル。</li><li><strong>b) ランビック</strong>: 誤り。ランビックはベルギー・ブリュッセル近郊（パヨッテンランド）の自然発酵ビール。野生酵母・乳酸菌による自然発酵で作られる独特のスタイルで、下面発酵でも上面発酵でもない（自然発酵）。</li><li><strong>c) ピルスナー</strong>: ✓ 正解。1842年・ピルゼン・ヨーゼフ・グロル・軟水・淡色麦芽がキーワード。</li><li><strong>d) ペールエール</strong>: 誤り。ペールエールはイギリス発祥の<strong>上面発酵</strong>（エール）スタイル。淡色ではあるが下面発酵ではない。18世紀にイギリスで誕生し、ピルゼンとは無関係。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「1842年・ピルゼン・グロル・軟水・淡色麦芽」</strong> の5点セットで覚える</li><li>意図せずして偶然に生まれた黄金色ビールという「発明の逸話」とセットで記憶に残りやすい</li><li><strong>軟水→ピルスナー向き</strong>（苦味がやわらかく香りが際立つ）は水質問題でも頻出</li><li>ドルトムントビールは「ドイツの淡色ラガー」、ペールエールは「イギリスの淡色エール」として区別</li><li>ランビックは「自然発酵・ベルギー」と全く異なる文脈で覚える</li></ul>"},{"id":"018","category":"ビアスタイル","subcategory":"ドイツビール・特殊スタイル","difficulty":"応用","topic":"ラオホビール・バンベルグ","keywords":["ラオホビール","バンベルグ","燻製麦芽","スモーク麦芽","シュレンケルラ","下面発酵","世界遺産","北バイエルン"],"title":"ラオホビール：バンベルグの燻製麦芽が生む下面発酵ビール","questionText":"歴史的な市街地があり、町全体が世界遺産に登録されているバンベルグの名物で、燻製した麦芽でつくられる下面発酵ビールを次の選択肢より選べ。（2012年、2013年）","choices":[{"key":"a","text":"ミルクスタウト"},{"key":"b","text":"ポーター"},{"key":"c","text":"ヴァイツェン"},{"key":"d","text":"ラオホビール"}],"answer":"d) ラオホビール","answerKey":"d","explanationHtml":"<h3>なぜ正解か</h3>\n<p><strong>ラオホビール（Rauchbier）</strong>はドイツ・<strong>バンベルグ</strong>（北バイエルン州）の名物ビール。「ラオホ（Rauch）」はドイツ語で「煙・燻煙」を意味し、ブナ（ビーチ）の木などで<strong>燻製にした麦芽</strong>（スモーク麦芽）を使用して醸造する<strong>下面発酵ビール（ラガー）</strong>。燻製特有のスモーキーな香りと風味が強い個性を持ち、バンベルグの「<strong>シュレンケルラ（Schlenkerla）</strong>」というビアレストランのラオホビールが特に有名。</p>\n<h3>背景知識</h3>\n<h4>バンベルグ（Bamberg）</h4>\n<ul><li><strong>場所</strong>：ドイツ・バイエルン州の北部（フランケン地方）、ニュルンベルク北方約60km</li><li><strong>世界遺産</strong>：1993年にUNESCOの世界文化遺産に登録（「バンベルクの町」）</li><li><strong>ビール文化</strong>：人口約8万人の小都市ながら、数多くの醸造所（ブラウエライ）が密集し「ビールの都」とも呼ばれる。ラオホビールはその象徴的存在</li><li><strong>シュレンケルラ（Aecht Schlenkerla Rauchbier）</strong>：バンベルグで最も有名なラオホビールの醸造所・ビアレストラン。伝統的な製法を守り続け、世界中のビール愛好家が訪れる</li></ul>\n<h4>ラオホビールの特徴</h4>\n<table><tr><th>項目</th><th>内容</th></tr><tr><td>使用麦芽</td><td><strong>燻製麦芽（スモーク麦芽）</strong>：ブナ（ビーチ）材の煙で燻した麦芽</td></tr><tr><td>発酵方法</td><td><strong>下面発酵</strong>（ラガー酵母使用）</td></tr><tr><td>色</td><td>濃い琥珀〜銅色</td></tr><tr><td>香味</td><td>燻製・スモーキー・肉の燻製に似たアロマ、モルトの甘みが土台</td></tr><tr><td>アルコール度数</td><td>約5〜6%</td></tr><tr><td>主な産地</td><td>ドイツ・バンベルグ</td></tr></table>\n<h4>燻製麦芽が生まれた歴史的背景</h4>\n<p>現代では麦芽乾燥に熱風乾燥機（キルン）を使用するが、産業革命以前は<strong>直火で煙を使って麦芽を乾燥</strong>させるのが一般的だった。そのため、かつては世界中のビールがある程度スモーキーな風味を持っていた。乾燥技術が進化して煙を使わない方法が主流になる中、バンベルグの一部醸造所だけが伝統的な燻製麦芽の製法を守り続け、現在のラオホビールとして残っている。</p>\n<h4>下面発酵と上面発酵の区別</h4>\n<table><tr><th>発酵方法</th><th>特徴</th><th>代表スタイル</th></tr><tr><td><strong>下面発酵（ラガー）</strong></td><td>低温（5〜15°C）・タンク底に沈む酵母</td><td>ピルスナー、メルツェン、ラオホビール</td></tr><tr><td><strong>上面発酵（エール）</strong></td><td>高温（15〜25°C）・液面近くに浮く酵母</td><td>ポーター、ミルクスタウト、ヴァイツェン</td></tr></table>\n<p>ラオホビールは<strong>燻製麦芽を使う</strong>点でユニークだが、発酵方法はラガー（下面発酵）であることが重要。</p>\n<h4>各選択肢のビアスタイル解説</h4>\n<p><strong>ミルクスタウト（Milk Stout）</strong>：</p>\n<ul><li>イギリス発祥の<strong>上面発酵</strong>（エール）の濃色ビール</li><li>醸造時に<strong>乳糖（ラクトース）</strong>を添加。乳糖は酵母が発酵できないため残糖として残り、甘みとクリーミーなボディを生む</li><li>燻製麦芽とは無関係</li></ul>\n<p><strong>ポーター（Porter）</strong>：</p>\n<ul><li>18世紀イギリス発祥の<strong>上面発酵</strong>（エール）の濃色ビール（問007でスリースレッドとの関係を解説）</li><li>ロースト麦芽（焙煎麦芽）を使うが燻製ではない</li><li>バンベルグとは無関係</li></ul>\n<p><strong>ヴァイツェン（Weizen）</strong>：</p>\n<ul><li>ドイツ南部の<strong>上面発酵</strong>（エール）の小麦ビール</li><li>小麦麦芽を50%以上使用。バナナ・クローブのような特徴的な香り</li><li>燻製麦芽は使わず、下面発酵でもない（問004のヴァイツェングラスと関連）</li></ul>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) ミルクスタウト</strong>: 誤り。イギリスの上面発酵ビール。乳糖を使う甘い濃色ビールで、燻製麦芽・バンベルグとは無関係。</li><li><strong>b) ポーター</strong>: 誤り。イギリスの上面発酵濃色ビール。ロースト麦芽を使うが燻製ではなく、バンベルグとも無関係。問007でスリースレッドの文脈で登場したスタイル。</li><li><strong>c) ヴァイツェン</strong>: 誤り。ドイツの上面発酵小麦ビール。燻製麦芽を使わず、バンベルグの名物でもない。</li><li><strong>d) ラオホビール</strong>: ✓ 正解。バンベルグ名物の燻製麦芽使用下面発酵ビール。「ラオホ＝煙」の意。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「ラオホ＝煙（Rauch）＝燻製（スモーク）」</strong>：ドイツ語の語源から直結して覚える</li><li><strong>「バンベルグ＝世界遺産＋ビールの都＋ラオホ」</strong>：三点セットで覚える</li><li><strong>「ラオホ＝下面発酵（ラガー）」</strong>：燻製のイメージからエール（上面）と混同しやすいが、ラガーであることを確認する</li><li><strong>シュレンケルラ</strong>：固有名詞として問われることもある。「シュレンケルラ＝バンベルグのラオホビールの名店」</li><li>2012年・2013年と複数年出題されているスタイル。試験頻出のビアスタイル問題として優先度高め</li><li>ポーター・スタウト系（上面発酵・ロースト）とラオホ（下面発酵・燻製）の<strong>製法の違い</strong>を整理しておくと、類似スタイルの混同を防げる</li></ul>"},{"id":"019","category":"歴史・文化","subcategory":"ビールの飲み方・サービス","difficulty":"基礎","topic":"ブルーパブ","keywords":["ブルーパブ","醸造設備","ブルワー","クラフトビール","発泡酒免許","ビアホール","醸造所併設"],"title":"醸造設備を併設するパブの名称──ブルーパブ","questionText":"ビールの醸造設備を併設しているパブを一般的に何と呼ぶか、最も適切なものを次の選択肢より選べ。（2017年）","choices":[{"key":"a","text":"ビアホール"},{"key":"b","text":"ビアレストラン"},{"key":"c","text":"ブルーパブ"},{"key":"d","text":"ブルワー"}],"answer":"c) ブルーパブ","answerKey":"c","explanationHtml":"<h3>なぜ正解か</h3>\n<p><strong>ブルーパブ（Brewpub）</strong>は<strong>Brewery（醸造所）＋Pub（パブ）</strong>を組み合わせた造語で、<strong>店内に醸造設備を持ち、自家醸造したビールをその場で提供する飲食店</strong>のことを指す。日本では酒税法上の制約があり、ビールの年間最低製造数量（60kl）を満たせない小規模店舗では、最低製造数量が<strong>6kl</strong>と少ない<strong>発泡酒製造免許</strong>を取得してブルーパブを開業しているケースが多い。</p>\n<h3>背景知識</h3>\n<h4>ブルーパブの特徴</h4>\n<table><tr><th>項目</th><th>内容</th></tr><tr><td>定義</td><td>醸造設備を店内に持つ飲食店</td></tr><tr><td>提供するもの</td><td>自家醸造ビール（または発泡酒）を同一施設内で販売・提供</td></tr><tr><td>英語表記</td><td>Brewpub（ブリュワリー＋パブ）</td></tr><tr><td>日本の法的位置づけ</td><td>発泡酒製造免許（最低6kl）での開業が多い</td></tr></table>\n<h4>日本のクラフトビール・ブルーパブと酒税法</h4>\n<p>1994（平成6）年の酒税法改正でビールの年間最低製造数量が<strong>2,000kl→60kl</strong>に引き下げられ、地ビール・クラフトビールのブームが始まった。さらに発泡酒（麦芽使用比率50%未満等）の最低製造数量は<strong>6kl</strong>と低く設定されているため、小規模なブルーパブは発泡酒免許で運営するケースが現実的な選択となっている。</p>\n<h4>ビール関連施設の用語整理</h4>\n<table><tr><th>名称</th><th>定義</th></tr><tr><td><strong>ブルーパブ（Brewpub）</strong></td><td>醸造設備を併設したパブ・飲食店</td></tr><tr><td>ビアホール</td><td>大きなホールでビールを提供する飲食施設（醸造設備なし）</td></tr><tr><td>ビアレストラン</td><td>レストランスタイルのビール提供施設（醸造設備なし）</td></tr><tr><td>ブルワリー（Brewery）</td><td>醸造所。飲食スペースを持たない場合もある</td></tr><tr><td>ブルワー（Brewer）</td><td>ビールの<strong>つくり手</strong>（人・醸造家）</td></tr><tr><td>タップルーム</td><td>醸造所に併設されたビール提供スペース（ブルーパブに近い）</td></tr></table>\n<h4>ブルーパブとブルワリータップルームの違い</h4>\n<ul><li><strong>ブルーパブ</strong>：飲食店が主体で、醸造設備を店内に持つ</li><li><strong>タップルーム</strong>：醸造所（ブルワリー）が主体で、飲食スペースを併設</li></ul>\n<p>実態としては重なることが多く、明確な区別は文脈による。</p>\n<h3>各選択肢の補足</h3>\n<ul><li><strong>a) ビアホール</strong>: 誤り。広いホール空間でビールを提供する施設。自社での醸造設備は持たないのが一般的。日本初は1899年の恵比寿ビールBeer Hall（問題009参照）。</li><li><strong>b) ビアレストラン</strong>: 誤り。レストランスタイルでビールを提供する施設を指す一般的な呼称。醸造設備の有無は問わないが、ブルーパブの正式な呼称ではない。</li><li><strong>c) ブルーパブ</strong>: ✓ 正解。Brewery＋Pubの合成語。醸造設備を店内に持つ飲食店。</li><li><strong>d) ブルワー</strong>: 誤り。ブルワー（Brewer）はビールの<strong>つくり手（醸造家）</strong>を指す人名詞。施設の名称ではない。</li></ul>\n<h3>覚え方・関連事項</h3>\n<ul><li><strong>「ブルー（Brew）パブ＝醸造（Brew）するパブ」</strong>：語の成り立ちをそのまま覚える</li><li>ブルワー（人）とブルーパブ（場所）を混同しない：同じ「ブルー」でも指すものが異なる</li><li>日本の法的ポイント：ビール免許は最低<strong>60kl</strong>、発泡酒免許は最低<strong>6kl</strong></li></ul>  - 10分の1の数量でよいため、小規模ブルーパブは発泡酒免許で開業するケースが多い\n<ul><li>問題009（ビヤホールの日）と連動：ビアホールとブルーパブは別概念</li><li>2017年出題実績あり</li></ul>"},{"id":"019","category":"原材料","subcategory":"ホップ","difficulty":"基礎","topic":"ホップの役割・殺菌・清澄","keywords":["ホップ","殺菌作用","清澄作用","イソフムロン","ポリフェノール","タンパク質沈澱","雑菌抑制","ビール品質"],"title":"ホップの役割：殺菌作用と清澄作用","questionText":"ホップはビールに苦味と香りを与え、泡持ちを助ける作用があるが、この他にも重要な役割がある。この役割として適切なものを次の選択肢より選べ。（2016年）","choices":[{"key":"a","text":"殺菌作用と脱色作用"},{"key":"b","text":"殺菌作用と清澄作用"},{"key":"c","text":"糖化作用と清澄作用"},{"key":"d","text":"抗酸化作用と脱色作用"}],"answer":"b) 殺菌作用と清澄作用","answerKey":"b","explanationHtml":"<h3>なぜ正解か</h3>\n<p>ホップには苦み・香り・泡持ち向上に加えて、以下の2つの重要な役割がある：</p>\n<p>1. <strong>殺菌作用</strong>：ホップの成分（イソフムロン等）が雑菌の繁殖を抑える抗菌作用を持つ</p>\n<p>2. <strong>清澄作用</strong>：ホップに含まれる<strong>ポリフェノール</strong>が麦芽由来のタンパク質と結合して沈殿し、過剰なタンパク質を除去することでビールを清澄化する</p>\n<p>「脱色作用」「糖化作用」「抗酸化作用」はホップの役割ではないため、これらを含む選択肢はすべて誤り。</p>\n<h3>背景知識</h3>\n<h4>ホップの役割まとめ（全5種）</h4>\n<table><tr><th>役割</th><th>関与する成分</th><th>内容</th></tr><tr><td><strong>苦み付与</strong></td><td>α酸→イソフムロン（煮沸で変換）</td><td>ビール特有の苦みを与える</td></tr><tr><td><strong>香り付与</strong></td><td>精油成分（ミルセン・リナロール等）</td><td>花・柑橘・ハーブ等の複雑な香りを生む</td></tr><tr><td><strong>泡持ち向上</strong></td><td>イソフムロン</td><td>泡の安定性に寄与する</td></tr><tr><td><strong>殺菌作用</strong></td>
