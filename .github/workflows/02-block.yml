name: 02 - Block Mode (許可リストのみ通過)
run-name: "[02] Block — 許可リスト外をブロック"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  block:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner (block mode)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            registry.npmjs.org:443

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install dependencies (npm) — 許可済みなので通過
        run: npm install --global cowsay

      - name: Curl to allowed endpoint — 通過するはず
        run: curl -s https://api.github.com/zen

      - name: Done
        run: echo "Block mode complete — all listed endpoints passed"
