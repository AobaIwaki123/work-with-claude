name: 04 - Block Mode + Action失敗
run-name: "[04] Block + Action失敗 — ブロックでワークフローが落ちる"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fail-on-block:
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Harden Runner (block mode)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Reach unlisted domain — ブロックされてActionが落ちる
        run: curl --max-time 10 https://httpbin.org/get
