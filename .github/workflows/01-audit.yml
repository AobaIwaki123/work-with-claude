name: 01 - Audit Mode (観察)
run-name: "[01] Audit — 通信を記録するだけ"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner (audit mode)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install dependencies (npm)
        run: npm install --global cowsay

      - name: Curl to external APIs
        run: |
          curl -s https://api.github.com/zen
          curl -s https://httpbin.org/get | head -5

      - name: Done
        run: echo "Audit complete — check the Harden Runner link in the logs above"
